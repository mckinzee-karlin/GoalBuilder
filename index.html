ates environmental sounds with familiar actions, objects, people, or animals during academic routines.","ex":["Note: “M. has learned that the timer ringing means it is time to go to a new activity. Today, when the timer went off, he looked over to his schedule. I think he knew we were going to check our schedule before moving on.”","Photo: Student holding a toy firetruck. A note adds, “J selected the firetruck as the vehicle to finish his sentence in predictable chart writing (He can drive a ). He knows the firetruck's sound and loves that we make the sound each time we read his sentence.”","Video: The teacher is holding a toy cow in one hand and a pig in another. She says, “Do you want the pig, ‘oink, oink’ or the cow, ‘moooo’.” The student leans in and reaches for the cow as the teacher says, “Moooo.” A note adds, “M. loves a moooo-cow!”"],"teks":["OL_LISTEN"]},{"id":"E1b","text":"Recognizes own spoken name.","ex":["Datasheet: A tally of the number of times O. recognized his name each day.","Note: “When I called M.’s name to be the one to use the pointer for re-reading the chart, he immediately looked up.”","Photo: Student with a big smile. A note adds, “This is how J. looks each time the paraprofessional calls his name to let him know it’s his turn for one-on-one shared reading.”"],"teks":["OL_LISTEN"]},{"id":"E1c","text":"Recognizes the spoken name of familiar people and objects.","ex":["Note: “After reading Finding Food, I gathered pictures of some of the food Brian ate. In review, I said, ‘Brian ate fish.’ D. pointed to the picture of the fish.”","Photo: Student pointing down to shoes. A note adds, “After reading Fudge’s New Shoes, I said, ‘Let’s count our shoes!’ B. looked down and pointed to his shoes.”","Video: The teacher is making a list of everyone who is wearing blue jeans. As she calls out names of peers, S. looks at each peer. A note adds, “Even though it has only been three weeks, S. knows all her friends’ names!”"],"teks":["OL_LISTEN","VOC_WORDS"]},{"id":"E1d","text":"Recognizes spoken words or songs associated with familiar routines.","ex":["Datasheet: Down the first column are songs associated with classroom routines, such as the “Gathering song,” “Clean up song,” and “Line up song.” Along the top are dates. In the cells are notes describing T’s response to the songs.","Note: “I always finish shared reading with an exaggerated ‘The End!’ and then close the book. Today, the gym teacher entered the room as I said, ‘The End.’ I answered her question without shutting the book. R. came over and closed the book while I held it.”","Photo: Student looking at books in front of a bookshelf. A note adds, “I said, ‘Time to read!’ and M. walked over to the bookshelf to pick a book out for independent reading.”"],"teks":["OL_LISTEN","PA_RHYME"]},{"id":"E1e","text":"Identifies symbols associated with characters in familiar books.","ex":["Note: “Shared reading: I said we were going to read the book, Hello Goodbye Dog. A. got very excited and looked over at the stuffed dog on my desk. We named the dog Moose after the character in the book the last time we read it.”","Photo: A. is in her wheelchair with a low-tech communication display on her tray. It is the zoo animals page from the AAC system she is learning to use. She has her hand on one of the symbols. A note adds, “We’ve been reading Grumpy Monkey. I use funny voices for the characters and A. loves it! Today I was pretending to be grumpy Jim and she put her hand right on the monkey symbol.”","Video: Students are arranged in a semi-circle facing the teacher. The book, Don’t Let the Pigeon Drive the Bus is on the teacher’s lap. She also has a stuffed pigeon, a toy bus, and a cap like the bus driver wears. She says, “Today, we’ll read Don’t Let the Pigeon Drive the Bus.” Then she holds up the toy bus and the cap. She says to P., “You can be the driver. Show me the driver’s hat.” P. looks at the cap. The teacher says, “That’s the hat! Do you want to wear it?” Then she puts it on P’s head, and he smiles and vocalizes."],"teks":["LIT_CHAR"]},{"id":"E1f","text":"Identifies symbols associated with objects used during academic routines.","ex":["Note: “We’ve been reading, Shh! I Have a Plan. Before we started today, I asked each student to tell me what object they wanted using symbols on a choice board: net, bird, squirrel. After Q selected the net, I presented the objects and asked him to get the one he wanted. He selected the net. Q. is starting to learn about picture symbols.”","Note: “We’ve been reading Henry and Mudge Go to School. I have gathered the objects that Henry puts in his backpack. Today, I asked kids to select the symbol for the objects before we put them in the backpack. L. found the symbol for the book, crayons, and toy truck I showed her.”","Photo: G. is seated in her wheelchair. On the tray is a choice board with two picture symbols. One is a bird and the other is a squirrel. Sitting next to each symbol is a stuffed animal version of each of the animals. A note adds, “We’ve been reading, Shh! I Have a Plan. Before reading today, I asked G. to help me get organized. I gave her the symbols and asked her to put the animals with the symbols. She did it!”"],"teks":["VOC_WORDS"]},{"id":"E1g","text":"Visually attends to print during book sharing and other print-based activities.","ex":["Note: “I was getting ready to read the morning message. M. was busy with his fidget toy. When I started reading, he looked up and visually attended to the white board as I read and pointed to the message.”","Photo: Picture of a predictable chart titled, What I Wear in Winter. There are 7 sentences with the stem, I put on. A note adds, “Today T. was really paying attention as we took turns rereading the sentences on the chart.”","Video: An adult reads a book with a child sitting beside her. The child is looking at each page as the adult reads. A note adds, “This book has text on the left and an illustration on the right. T. looked at the words while Jenn was reading to him.”"],"teks":["PR_BOOK"]},{"id":"E1h","text":"Uses letters on a keyboard or alternate pencil during writing activities.","ex":["Note: “Today, I tried using the alphabet eye gaze frame for writing with W. He doesn’t understand how it works yet, but I am going to help him learn by using it. As he looked, I named the letters in the group and then named the color of his second look. He was amazed when I showed him that he had written a B. W. has a lot to learn, but today he looked intently enough that he wrote 8 letters. He was into it.”","Photo: Picture shows a student looking at an alphabet flip chart as the adult beside him is pointing to it. A note adds, “N. was very interested in writing about horseback riding today! He selected the letters, b, g, h, and i several times each.”","Work sample: Piece of paper with a picture of a swimming pool on it and the printed letters: C, C, C, G, I, I. A note is attached explaining, “Today, N. wrote about her trip to the pool this weekend.”"],"teks":["HW"]}]},{"code":"E2","outcome":"When interacting with peers or adults in academic contexts, the learner demonstrates early alphabet and phonological awareness.","note":"","indicators":[{"id":"E2a","text":"Identifies 8 or more uppercase letters of the alphabet by name.","ex":["Data Sheet: The top of the sheet has the student’s name and date (week of) and is labeled Letter Identification. The left column has the uppercase letters in alphabetical order. Columns 2-5 are labeled Monday – Friday. There are checkmarks next to 12 letters, with multiple checkmarks for many of those letters each day and across multiple days.","Note: “Whenever we read a book, I ask B. to ‘show me the letter ’ from the book's title. He is getting so good. So far, he has identified the 10 uppercase letters, including the Ps in Pig the Pug, D and P, in Don’t Let the Pigeon Drive the Bus, and N and B in Pigeon Needs a Bath.”","Photo: Student sitting at a computer and touching letters on a keyboard. A note adds, “We were working on the alphabet today, and I asked L. to type each letter I named. She found the following: A, E, O, U, X, L, M, B, F, and S."],"teks":["PR_LET","PH_LS"]},{"id":"E2b","text":"Identifies 8 or more lowercase letters of the alphabet by name.","ex":["Data Sheet: The top of the sheet has the student’s name and date (week of) and is labeled Lowercase Letter ID. The left column has the lowercase letters in alphabetical order. Columns 2-5 are labeled Monday – Friday. There are checkmarks next to 9 letters with multiple checkmarks for many of those letters each day and across multiple days.","Video: J. and an adult are playing Go Fish. The cards have the lowercase letters of the alphabet. J. uses a single message switch to say, “DO YOU HAVE …?” then he shows the letter he wants to the adult. She does not have the letter. She says, “Do you have the letter m?” J. shakes his head ‘no’ and then takes his turn. When the adult has a turn again, she says, “Do you have the letter b?” J. nods, “yes,” and the adult uses partner-assisted scanning points to each of the cards displayed on the card tray in front of him (she cannot see them). J. shakes his head “no” until the adult points to the card with the letter b. There is a note, “During the game, J. accurately identified 15 of the lowercase letters Ms. P. requested.”","Note: The note has 12 lowercase letters written across the top. Under the letters, an adult has written, “We went on a scavenger hunt today. Each time we found a sign or print in the hallways, I asked T. to show me letters (‘Show me the letter .’). T. identified these 12 lowercase letters.”"],"teks":["PR_LET","PH_LS"]},{"id":"E2c","text":"Identifies 8 or more uppercase letters of the alphabet based on the most common sound they represent.","ex":["Data Sheet: The top of the sheet has the student’s name, date (week of), and UPPERCASE LETTERS RECOGNIZED BY SOUND (*the adult says the sound and Z. selects the letter from the keyboard or a field of 5 or more letters). The left column has the uppercase letters in alphabetical order. Columns 2-5 are labeled Monday – Friday. There are checkmarks next to 10 letters with multiple checkmarks for many of those letters each day and across multiple days.","Note: “During predictable chart writing, I asked, “What letter do I need to write the sound /n/ at the beginning of need? W. used her keyboard to tell me, N. She also helped me with /h/ for help.”","Photo: Picture of student sitting in her wheelchair with her communication device attached to a mount and open to the keyboard page. A note adds, “Today we played ‘sound search.’ I said a letter sound and then P. would name the letter by touching it on her keyboard. P. identified the letters representing 11 of the 15 sounds I provided.”"],"teks":["PH_LS"]},{"id":"E2d","text":"Identifies 8 or more lowercase letters of the alphabet based on the most common sounds they represent.","ex":["Data Sheet: The top of the sheet has the student’s name, date (week of), and LOWERCASE LETTERS RECOGNIZED BY SOUND (*the adult says the sound and Z. selects the letter from the keyboard or a field of 5 or more letters). The left column has the lowercase letters in alphabetical order. Columns 2-5 are labeled Monday – Friday. There are checkmarks next to 8 letters with multiple checkmarks for many of those letters each day and across multiple days.","Photo: Picture of a student sitting at a table in a Rifton chair. A plastic bin full of foam letters is on the table in front of her. A note adds, “C. and I played a game today. I said the sound, and C. had to find the letter from all the letters on the table. When she got it, she put it in the bin. I said the sounds represented by 18 letters, and C. found 14. Nice work!”","Work Sample: A printed screen shot of the score page presented when B. finished the quiz in the letter-sound app. A note adds, “Today, B. used the letter-sound app and correctly identified the letters representing each sound from sets of 6 lowercase letters.”"],"teks":["PH_LS"]},{"id":"E2e","text":"Segments words in a spoken sentence.","ex":["Note: “After reviewing the student’s contributions for predictable chart writing, I reread them and clapped once for each word. L. loved doing that! He clapped right along with me!”","Photo: Student holding pointer on the chart. A note adds, “J. was able to point to the words in sequence as we read his sentence for predictable chart writing.”","Video: The teacher says a sentence and then repeats it, asking her students to “tap her sentence” on the table. A note adds, “F. was consistently able to tap each word when my sentences were 3-4 words long.”"],"teks":["PA_SENT"]},{"id":"E2f","text":"Recognizes rhyming words during a shared reading of a text.","ex":["Note: “We were re-reading There’s a Bear on My Chair. I created a list of words that rhymed with bear and asked students to raise their hands when they heard one. After slowly reading ‘There isn’t any room to spare,’ F. immediately vocalized after hearing spare.”","Photo: Students holding arms up in the air. A note adds, “After reading the title, A Bug in a Jug Wants a Hug, I asked students to raise their arms when they heard a word that rhymes with bug. I said, ‘Bug-In.’ M. didn’t move. I said, ‘Bug-Jug.’ Immediately M. smiled and lifted his arm.”","Video: Teacher reads Pig the Pug. The teacher said, “I read, ‘Well, Pig flipped his wig. Oooo, I hear two rhyming words. One is Pig. You tell me the other. Is it Pig-Well? Is it Pig-Flipped? Is it Pig-Wig?” A note adds, “J. recognized Pig-Wig rhymed by smiling and nodding his head.”"],"teks":["PA_RHYME"]},{"id":"E2g","text":"Recognizes when two spoken words begin with the same sound.","ex":["Note: “Today’s letter of the day was B, and during Shared Reading, each time Q. heard a word that began with the B sound, he smiled and vocalized.”","Video: The teacher finishes the sentence for chart writing, I put away…pencils. She repeats the sentence and points out that two words begin with the same sound. A note adds, “J. was able to tell me that ‘put’ and ‘pencils’ both started with the same sound, p.”","Video: The teacher reads the title, Pig the Pug. She points out that two words have the same sound. A note adds, “I asked V. to indicate yes when I said the two words starting with the same sound. He raised his eyes to say “yes” after I said Pig and after I said Pug.”"],"teks":["PA_RHYME"]},{"id":"E2h","text":"Recognizes when two spoken words end with the same sound.","ex":["Note: “After reading Pete the Cat, I asked students to help me find other words that ended with the ‘t’ sound like Cat. When I got to cat-wet Y’s eyes lit up – she smiled and vocalized. I asked her if cat and wet had the same sound at the end. She nodded enthusiastically!”","Note: “During chart writing of You can write a… J. selected note. I asked J. if he could find two words that ended with the ‘t’ sound. He did it!”","Photo: Teacher holding up two words and student pointing. A note adds, “When I said ‘jam- ham’ H pointed at the cards and nodded to let me know they ended with the same sound.”"],"teks":["PA_PHON"]}]},{"code":"T3","outcome":"When interacting with peers or adults in academic contexts, the learner demonstrates and applies alphabetic and phonological awareness.","note":"","indicators":[{"id":"T3a","text":"Identifies all uppercase and lowercase letters of the alphabet by name.","ex":["Data Sheet: Top of sheet has student’s name and date (week of). The left column has one uppercase letter followed by the corresponding lowercase letters displayed in individual rows. Columns 2-5 are labeled Monday – Friday. There are multiple checkmarks next to all of the uppercase letters and at least one checkmark next to each lowercase letter with most letters having multiple marks across the week.","Note: “During writing today, I heard M. humming the alphabet song as he typed A-Z, in order, using the keyboard on the classroom computer (which has a special keyguard for M.).”","Work Sample: A page with all 26 letters of the alphabet in uppercase. A note adds, “Today, K. used the computer keyboard and selected all 26 letters when I said the letter name.”"],"teks":["PR_LET","PH_LS"]},{"id":"T3b","text":"Identifies 16 or more letters of the alphabet based on the most common sounds they represent.","ex":["Data Sheet: The top of the sheet has the student’s name, date (week of), and LETTERS RECOGNIZED BY SOUND (*the adult says the sound and Z. selects the letter from the keyboard or a field of 5 or more letters). The left column has the uppercase letters in alphabetical order. Columns 2-5 are labeled Monday – Friday. There are checkmarks next to 18 letters, with multiple checkmarks for many of those letters on multiple days.","Photo: Picture of student sitting in her wheelchair with her communication device attached to a mount and open to the keyboard page. A note adds, “Today we played ‘sound search’. I said a letter sound and then P. would name the letter by touching it on her keyboard. P. identified the letters representing 18 of the sounds I provided.”","Work Sample: A screenshot of the score report provided at the end of a session with a letter- sound app. It shows that the student identified the letters representing each of the sounds presented for 20 different letters."],"teks":["PH_LS"]},{"id":"T3c","text":"Produces or selects each letter of the alphabet based on its name.","ex":["Photo: L. smiles as she holds up her communication device so the message is in the picture. Across the message window is a long string of letters. A note adds, “We played a game. L. had to type each letter that I said. She got every one of them right.”","Video: J. is sitting with his tablet-based AAC device on the table in front of him. His peers are sitting around him. Some have paper/pencil; others also have their devices. The teacher says a letter and all the kids write or select the letter. A note adds, “J. wrote every letter I asked the students to write.”","Work Sample: A piece of paper with the alphabet written in a combination of upper and lowercase forms. A note adds, “Today, I sat with N. and asked him to write some letters for me. I said a letter name and he wrote. He wrote some uppercase and some lowercase. Some are not formed perfectly, but he can write all of the letters.”"],"teks":["PR_LET","PH_LS"]},{"id":"T3d","text":"Changes the initial consonant in a word to write a new word during word study instruction.","ex":["Note: “During today’s word study lesson, C. found the word wall word, make, and changed the first letter to figure out how to spell cake.”","Video: During a Making Words lesson using the letters A, C, M, and P, the teacher asks students to replace one letter to change the word cap to map. D. removes the C and puts an M in its place to spell map.","Work Sample: Sheet shows two words with common rimes – back and cot. N. changed the first letter to write two new words under back: sack and Jack and three new words under cot: hot, not and pot."],"teks":["PH_LS","SP_PAT"]},{"id":"T3e","text":"Identifies words that result from blending individual phonemes.","ex":["Note: “While reading today, we talked about some of the illustrations. I asked J. to find objects in the illustration with the sounds stretched (show me the b-a-g). J. got it every time.”","Photo: Picture shows a student pointing to a pen. A note is added that reads, “M. is really starting to get blending. I say words with the sounds stretched, and she finds the pictures and objects that match. Today we were getting objects for shared reading. I asked her to find the b- oo-k and p-e-n. She found them both.”","Work Sample: A worksheet with line drawings of objects (e.g., cat, dog, mop, bag, sun, can, pot, box, bat, cup). Each one has a circle around it and 6 have a check mark. A note adds, “P. got 6 of 10 correct when I said the words stretched out.”"],"teks":["PA_PHON"]},{"id":"T3f","text":"Identifies words that result when phonemes are deleted from words.","ex":["Note: “I asked P. what word you get if you take the b sound away from the word, ball, and she used her communication device to say, “ALL”. She also got up from cup and it from sit.”","Photo: Picture of K. pointing to the word, at. A note reads, “K. found the correct word when I asked what word you get if you take the h sound away from hat.”","Work Sample: at and ox are written on the left. There are pictures of a box, cat, fox, bat, hat. The student has drawn lines to connect each picture to the word ending. A note adds, “I read at and ox. I then pointed to each picture and asked, what word is left if you take the b sound off box? Is it at or ox? She got them all.”"],"teks":["PA_PHON"]},{"id":"T3g","text":"Represents or identifies the initial sound in words when writing.","ex":["Note: “J. asked me how to spell, camp. I told him to think about the sounds he hears in the word. He stretched the sounds himself and wrote k!”","Note: “During writing today, L. asked me how to spell gorilla. I asked her what other word she knew that started like gorilla. She pointed to GO on her device. Then she wrote G.”","Work Sample: H’s writing which has a picture of a basketball hoop and shows the letter B. A note adds, “H. chose to write about his favorite sport today, basketball. He got the B on his own.”"],"teks":["SP_PAT","PA_PHON"]},{"id":"T3h","text":"Represents or identifies the final sounds in words when writing.","ex":["Photo: A picture that R. drew for his mom with a note that reads, Lv U Mam.","Work Sample: M’s writing about her trip to the lake: I sm n lk. A note adds, “M told me she wrote, I swim in the lake.”","Work Sample: There is a screen shot of an illustration from Pigeon Needs a Bath. The student has written, PEGN ND BAF NT WANT. A note adds, “I made sure G. couldn’t see the book because I didn’t want him to copy. He did the first words by himself, ‘Pigeon needs a bath’. Then he wrote NT before looking at his device to copy the word WANT. He was done so I didn’t make a big deal today, but we’ve got to keep working on hearing the sounds instead of copying!”"],"teks":["SP_PAT","PA_PHON"]}]},{"code":"T4","outcome":"The learner applies alphabetic and phonemic awareness in reading and writing tasks.","note":"","indicators":[{"id":"T4a","text":"Identifies all letters of the alphabet based on the most common sounds they represent.","ex":["Data Sheet: The top of the sheet has the student’s name, date (week of), and LETTERS RECOGNIZED BY SOUND (*You say the sound. Q. selects the letter.). The left column has the uppercase letters in alphabetical order. Columns 2-5 are labeled Monday – Friday. There are checkmarks next to each letter, with multiple checkmarks for many of those letters on multiple days.","Note: “Today we played ‘sound search.’ I said a letter sound and then P. would name the letter by touching it on her keyboard. P. identified the letters representing all of the sounds I provided.”","Work Sample: A screenshot of the score report provided at the end of a session with a letter- sound app. It shows that the student got 100% on all 26 letters."],"teks":["PH_LS"]},{"id":"T4b","text":"Represents the initial and final sound when writing words.","ex":["Note: “D. was playing with the magnetic letters today. He made the word md (mad). I asked why he was mad, and he made coke (cookie). I said, ‘Mad about a cookie?’ He added, eat and wnt (want).”","Photo: Picture of the whiteboard with a message and a smiling student. A note adds, “C. decided to write her own morning message. She wrote GD mn toDa muk ht dg [Good morning, Today music hot dogs].”","Work Sample: L’s writing for the day was, I wn gm. A note attached explains, “L. wanted to write about winning a game of ‘Go Fish’. He’s hearing those first and last sounds. Now we need to add some vowels!”"],"teks":["SP_PAT"]},{"id":"T4c","text":"Places a vowel in the correct location when spelling CVC (consonant-vowel- consonant) words.","ex":["Note: “Today, during our Making Words lesson, I asked V. to spell the word bun, and she spelled bon. She did a great job of hearing the beginning and ending sounds, and even though she chose the wrong vowel, she knew she needed a vowel in the middle.”","Video: A making words lesson. The student successfully makes at > fat > fan > tan > tin > fin as the teacher calls each word.","Work Sample: Across the top are the letters a, g, o, t. There are line drawings down the left representing cat, hat, pot, dog, hog. The first letter of each word is provided and the student has finished spelling each word. She used the a instead of the o on the last three words, but the vowel (a) was in the right place."],"teks":["SP_PAT"]},{"id":"T4d","text":"Correctly represents all sounds when attempting to spell words.","ex":["Note: “The topic of today’s Predictable Chart Writing lesson was Fruits. I asked P. to spell the word, like, and she said, L-I-K. Even though she didn’t spell the word correctly, she got all the sounds.”","Work Sample: Picture of a writing sample from M. A note attached said the topic was about watching a basketball game with the text: Mi tem wun gam [my team won game].","Work sample: A thank you card that says, “thak you I like bak pak” (Thank you I like new backpack.)"],"teks":["SP_PAT"]},{"id":"T4e","text":"Spells taught CVC (consonant-vowel-consonant) words.","ex":["Note: “During Making Words today, L. made each word correctly: at > fat > sat> sit > fit > fin > tin. Then she used the words she made to spell bat and bin.”","Photo: The picture shows a class chart created during Predictable Chart Writing lesson. The topic is Pets. The sentence stem is, I like … An attached note explains, “W. used her communication device to tell me her favorite pet is a “CAT”. When I asked her to spell cat, she went to her alphabet page and spelled C-A-T.”","Work Sample: D’s writing – I run in PE. I go fat. I hav fun. An attached note explains, “D. had a lot to write about PE today! He also spelled run and fun correctly.”"],"teks":["SP_PAT"]},{"id":"T4f","text":"Reads taught CVC (consonant-vowel-consonant) words.","ex":["Data Sheet: List of ten CVC words. +/- indicates that J. correctly read 9 of the 10 words.","Note: “D. has been reading some simple books. We read them together a few times and then he reads them alone. After a few times reading the book, he does a MAZE passage and identifies the CVC words that I delete from the sentences from a choice of 3 words. Today, D got 4 of the 5 words correct.”","Work Sample: Line drawings of CVC objects with lines matching the pictures to printed words (pig, hat, dog, hen, cat, mop, pan, can). T. got 100%."],"teks":["PH_LS"]},{"id":"T4g","text":"Identifies 50 or more common words.","ex":["Data Sheet: The first column lists Fry’s 100 site words. Dates are written next to words each time the student reads the word correctly. There are dates next to 61 words, some have 5 or more dates written next to them.","Note: “Today, D. played Snapwords and moved up another level. He is now reading more than 75 words!”","Photo: A boy stands with the teacher’s pointer in front of the morning message written on the easel. A note adds, “Every day, B. points to the words while we all read the message. Today, when we were done, I said some words randomly, and he pointed to them. I’ve been keeping a list of the words he identifies correctly. He is up to 57 words from the Dolch list we use.”"],"teks":["PH_HFW"]},{"id":"T4h","text":"Reads familiar text that includes decodable (consonant-vowel-consonant) words and high frequency words.","ex":["Note: “T. loves our new collection of non-fiction decodable readers. We read them together a few times. Now he chooses them when it’s time for self-directed reading. Since I can’t listen to him read aloud, I sat down with him when he finished reading and called out words on each page. He correctly pointed to every word I asked him to read.”","Photo: Picture of D. hugging the book, The Cat Sat on the Mat. A note adds, “I read this book this morning. During self-directed reading, B. chose it. He read the entire book. He was so proud, and I was too!”","Video: The video shows V. reading the predictable chart her class made. The topic is Things I Can Do, and the sentence stem is, I can (fill in the blank). V. is using the teacher’s pointer and reads the entire chart while pointing to each word."],"teks":["PH_LS","PH_HFW","FLU"]}]},{"code":"C5","outcome":"The learner applies knowledge of phonics to decode and spell simple single-syllable words.","note":"","indicators":[{"id":"C5a","text":"Decodes and/or spells VC and CVC (consonant-vowel-consonant) words (e.g., in, it, cat, fit, mop, tin).","ex":["Photo: Picture of the display on W’s communication device. The words, cat, pet, dog, get, and it appear in the message display. A note adds, “We were talking about our predictable chart, My Favorite Pet. W. used the keyboard on her communication device to write CAT. I asked, ‘Is that your favorite?’ She smiled and wrote PET. We kept talking, and a classmate said he did not want a cat. W. wrote DOG. I said, ‘Do you want a dog?’ He responded, 'Yes.’ W. then wrote, GET IT.”","Work Sample: A page from D’s writing folder. He has written, I run. I go ft. I haf fun.","Work Sample: Ten CVC words are listed down one side with three pictures next to each. One picture is circled for each word. A note adds, “L. got 7 of the 10 items correct and only needed encouragement to keep going after he did the first half.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C5b","text":"Decodes and/or spells CVC (consonant-vowel-consonant) words with a plural -s (e.g., bats, pigs, pens).","ex":["Note: “During reading today, we read one of the decodable readers. Afterward, I gave C. a copy of the book with one decodable word on each page covered with a sticky note with three words written on it. When he got to the sticky, he had to circle the word that went with the sentence. He got all of them, including bats, cats, and hats.”","Work Sample: A worksheet with one column showing pictures of a cat, hat, pan, can and a space to write words next to each. Then a second column of pictures showing two cats, hats, pans, and cans. The student has written all of the words correctly.","Work Sample: A page from T.’s journal. There is a photo of a baseball game. T. wrote: tEm cot bats Balls runs wE win! A note adds, “He labeled many things: tem (team), cot (coach), bats, balls. Then he pointed to the player running and wrote, runs. He finished by adding, WE WIN! He always labels the things he sees – it was fun to see him write more, and he is starting to use that s (bats, runs, balls).”"],"teks":["PH_LS","PH_ADV","SP_PAT"]},{"id":"C5c","text":"Decodes and/or spells words that begin with common consonant blends (e.g., bl, gr, sp).","ex":["Note: “Today, during our making words lesson, A. used the letters i, k, l, n, p, and s to spell the words in pin, spin, skin, skip, slip, and snip.”","Note: “During reading today, we read one of the decodable readers. Afterward, I gave C. a list of decodable words from the book. I called the words and P. pointed to them on the list. He got 92% of the words, including grip, trip, and stop.”","Photo: K. is in front of a bulletin board with a big grin on her face. A note adds, “As we walked to PE this morning, we stopped to look at the new bulletin board by Ms. T’s classroom. Out of habit, I started to point to the words and read them. Then I stopped and asked K. to help me. I said a word and then used partner assisted scanning to point to each of the words on the board until K. indicated ‘YES.’ In this way she identified so many words including spell.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C5d","text":"Uses knowledge of words with common 2-letter spelling patterns (e.g., -at, -in, -it, - ot) to read other words with the same spelling pattern.","ex":["Note: “Today, I wrote 3 words on the top of the board – top, can, hat. I asked students to use those words help read words in 3 sentences they had not learned before. L. was able to read the 4 new words, and I read the rest of the sentence: I use a mop to clean the floor; I told my cat to scat; My mom got a new van.”","Work Sample: A worksheet with a picture of a bat and a mug on the left and lines T. has made connecting the words hat, cat, rat to picture of the bat and the words bug, hug, jug to the picture of the mug. All were completed correctly.","Work Sample: A worksheet that has five sentences. Each sentence has a picture illustrating the meaning (e.g., a picture of a man wearing a hat), a blank where a word is missing (e.g., He likes his ), and three choices to complete the sentence (e.g., cat, hit, hat). J. has circled the correct word to complete 9/10 sentences."],"teks":["PH_LS"]},{"id":"C5e","text":"Uses knowledge of words with common 2-letter spelling patterns (e.g., -at, -in, -it, - ot) to spell other words with the same spelling pattern.","ex":["Note: “During writing, today, I watched T. look up at the schedule on the board – he looked like he was trying to read it. Then, I watched him look back and forth from the board to his paper to write, big rig. I asked him what he was doing and he pointed and said “pig.” I asked him if pig helped him spell big rig. He told me it helped him spell big and then he ‘just got’ rig.”","Photo: The picture shows two rows of words P. has written. A note is attached that says, “P. used two words that we learned in class, yell and rug to help him spell new words – bell, fell, and bug, hug.”","Video: The class is gathered around the teacher who is writing sentences on a chart. A note adds, “I asked the students to, ‘Help me spell the word, van.’ I waited a full 5 seconds and got no response. Then I wrote fan on the whiteboard and said, ‘C. can you use this word fan to help you spell van.’ C. vocalized excitedly and used the keyboard on her communication device to produce V. Then I said, ‘Yes, V. What else?’ and C. added A-N before touching the message window to speak ‘VAN’.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C5f","text":"Identifies 100 or more high frequency words.","ex":["Data Sheet: The first column lists Fry’s 100 site words. Dates are written next to words each time the student reads the word correctly. There are dates next to all the words, some have 5 or more dates written next to them.","Note: “Today, D. played Snapwords and moved up another level. He is now reading more than 125 words!”","Work Sample: Three sheets with lists of Dolch words at the preprimer, primer, and first grade levels (131 words). Could, round, every, once, where are circled on the first-grade list. A note adds, “M. read all the words on the lists except the circled words.”"],"teks":["PH_HFW"]},{"id":"C5g","text":"Spells high frequency words (sometimes called sight words, popcorn words, cloud words, red words) correctly when writing.","ex":["Writing Sample: A copy of a page from the student’s journal. The student has written, “I like go prc. I can sig. It fun.” The teacher has written, “I like go park. I can swing. It fun.”","Writing Sample: A copy of a page from the student’s journal. There is a picture like one from a Richard Scary book. The student has written, “I see ball. I see trk. I see kr. I see sun. I see brd. I see tree. I see cows.” The teacher has written, “I see ball. I see truck. I see car. I see sun. I see bird. I see tree. I see clouds.”","Writing Sample: A copy of a page from the student’s journal. There is a photo of the child with their family. The student has written, “me mom dad go.”"],"teks":["SP_HFW"]},{"id":"C5h","text":"Reads unfamiliar (new) sentences and short texts that are comprised of words that can be decoded given taught skills and high frequency words.","ex":["Note: “I opened a new pack of decodable readers today. S. read right through the 5 books featuring words with short vowels. I wish I had a video – the look on his face as he realized he could do it.”","Video: M. is seated on a chair with a few of his classmates gathered around (acting like he is the teacher). He is holding up a book and reading it to the others, stopping to show them the pictures. A note adds, “His speech is hard to understand, but he was clearly reading every word of the book he just checked out from the library. His exaggerated expression and stopping to show the pictures to others cracked me up. At least I know he is paying attention when we read aloud to the group.”","Work Sample: The sheet has a series of 10 short sentences and a set of line drawings depicting each. V. has successfully matched the sentences to the pictures."],"teks":["PH_LS","FLU","PH_HFW"]}]},{"code":"C6","outcome":"The learner applies knowledge of phonics to decode and spell single syllable words and read short texts that include these words.","note":"","indicators":[{"id":"C6a","text":"Decodes and/or spells single syllable words that begin with common digraphs (e.g., ch, sh, th, wh).","ex":["Photo: The picture shows a sentence made with a set of words written on separate sticky notes. A note adds, “P. read the book, Chicks! Since she can’t read out loud, I do this after she reads. I give her words from sentences in the book on sticky notes. She has to read the words and put them in order. It lets me know she is reading the words AND getting the sentences.”","Photo: The picture shows F.’s writing on the tabletop with an erasable marker. There are three columns with the headers: ch, sh, and th. The student has correctly spelled a list of words under each digraph: ch – chin, chip, chop; sh –ship, shin, shop; th – thin, that, than. A note adds, “We reviewed the diagraphs and wrote them together. Then I called a new word, and F. showed me which beginning he needed to spell the word. After he got the right beginning, I repeated the word, and he wrote it. I had to elongate the sounds in shin and each word starting with th but he got them.”","Work Sample: A page from N.’s writing folder. M. has written, “Sky. She is pink. She can fly. She is smart.” A note adds, “Earlier today we did a lesson in reading about characters. We listed things that described some characters from books we read. When it came time to write, N. chose to write about her favorite character from Paw Patrol.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C6b","text":"Decodes and/or spells single syllable words that end with common digraphs (e.g., ch, ck, gh, ng, nk, ph, sh, th).","ex":["Photo: The picture shows the following words written on index cards: am, at, as, ash, mash, bash, bath, math, mat, mast. A note adds, “C. did a great job during Making Words today! She spelled ALL these words. C. is starting to hear those th and sh word endings. She even got st, a new one when I stretched the sounds.”","Video: R. reads a book to her teacher. She accurately reads the text, which includes words ending in the diagraphs, th and sh: I take a bath. I brush my teeth. I brush my hair. I am ready for bed!","Work Sample: A photocopy of a lesson from a Making Words book. Letters u, b, c, h, m, r, and s. Seven words are marked with a +. Five end with a digraph (bum, bus, bush, rush, mush, much, such). A note adds, “These are the words Z. made the first time – I didn’t stretch the sounds or help him in any other way.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C6c","text":"Decodes and/or spells words with a vowel-consonant-e pattern (e.g., cake, ride, mane).","ex":["Photo: A picture of the tabletop where W. has written words in 3 lists. At the top of the lists are the words bake, hide, and tell. Under each is a set of 3 words that share the same spelling pattern. A note adds, “We reviewed the words at the top of the list and wrote them together. Then I called new words. First, W. showed me which keyword would help her spell the new word. After getting the right keyword, I repeated the new word, and W. wrote it. W. got them all right without any help.”","Photo: The picture shows a sentence made with a set of words written on separate sticky notes. A note adds, “P. read the book, The Nice Mice! Since she can’t read out loud, she makes sentences from the book when she is done. I give her words from sentences on sticky notes. She reads the words and then makes the sentence – of course, I put the book away! It helps me know she is reading the words and understanding how they go together in sentences.”","Work Sample: A photocopy of V.’s writing. It says, “I do not like to get a shot. It hurts a lot. It make me skred. I try to hide but mom can fine me.” The teacher has highlighted like, make, and hide. A note adds, ‘fine = find – I guess she got used to the pattern and over used it.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C6d","text":"Decodes and/or spells single syllable words with -ed, -es, and -ing added.","ex":["Note: “Since I can’t listen to H. read aloud, I am always trying to find other ways. Today, I wrote some simple sentences on big sticky notes. I asked H. to read them and put them where they belong in the room. He got: Ben is jumping here. We do reading here. Our lunches go here.”","Work Sample: A worksheet with one column showing pictures depicting verbs. Then a second column says NOW and the third says YESTERDAY. L. has correctly written look, looking, looked; help, helping, helped; work, working, worked; jump, jumping, jumped; wash, washing, washed.","Work Sample: A page from F.’s journal. F. has written, “We piked apls. We ride wagon. I piked a big punkn. I liked going apl piking.” A note added, “Have to work on -ck, but he’s got -ed and -ing.”"],"teks":["PH_ADV","SP_PAT"]},{"id":"C6e","text":"Decodes and/or spells single syllable words with r-controlled vowels (e.g., er, ir, ur).","ex":["Note: “D. read a brand-new decodable passage, Barb the Shark. I think the single illustration of the shark helped her read that word the first time, but then she was off! She needed help with found and ocean, but she read all the words with -ar (car, far, park, dark, shark, Barb).”","Note: “Today, A. read the lunch menu posted on the wall. The options were corn dog with tater tots or a cheese sandwich. I wasn’t sure A. could read it. I asked her what it said. She used her AAC device to tell me CORN, which she said by navigating to the page with vegetables, and DOG which she said by navigating to the page with pets. Then she said CHEESE using the foods page.”","Video: Video of N. reading One and More to her teacher. The only word she had difficulty reading was guinea (as in guinea pig). She repeatedly read more and horse or horses."],"teks":["PH_LS","SP_PAT"]},{"id":"C6f","text":"Decodes and/or spells single syllable words with vowel pairs (i.e., two vowels together that represent a single speech sound like ea, oo, ou).","ex":["Photo: A picture of the tabletop with three columns. The headers are look, dear, found. The student has correctly spelled words under each: look – book, hook, took; dear – fear, tear, near; found – sound, round, hound. A note adds, “We reviewed the keywords and the vowel pairs in each. Then I called a new word and F. showed me which keyword would help him spell the new word. After he identified the keyword, I repeated the new word, and he wrote it using the keywords to help him.”","Video: D. is reading the book, Sheep in a Jeep. He makes a few errors that he self-corrects and is successful with the words: beep, cheap, shout and steer.","Work Sample: P. wrote, Dear Bob I mis you. Come home soon. Love P. The ea, ou and oo are highlighted. A note adds, “P. used her eye gaze alphabet to write this note to her brother.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C6g","text":"Uses knowledge of words with common 3-letter spelling patterns (e.g., -ack, -ame, -ice, - ump) to read and spell other words with the same spelling pattern.","ex":["Note: “J. was reading a new decodable reader today. I could tell he was stuck. I asked him to tell me which word was the problem. I could tell which sentence he was on, but not the word. So, I pointed to each word and he stopped me when I got to the word he did not know. The word was hump. I reminded J. that he had a keyword that would help him. I asked him to think about the keyword with the same spelling pattern. He used his AAC device to tell me “JUMP.” I told him, ‘Yes, if jump is J-U-M-P, what word is H-U-M-P? He thought for a few seconds and then grinned and went to the animals page in his communication device and selected the camel. I knew immediately that he got it and confirmed, ‘Yes, a camel has a hump.’”","Photo: A picture of the tabletop where W. has written words in 3 lists. At the top of the lists are the words back, name, and jump. Under each is a set of 3 words that share the common spelling patterns: back - pack, rack, Zack; name – game, came, tame; jump – bump, dump, pump. A note adds, “W. wrote his keywords at the top of each column. Then I called new words. First, W. showed me which keyword would help her. After getting the right keyword, I repeated the new word, and W. wrote it. W. got them all right without any help.”","Work Sample: A short poem written on a paper. A note is attached that reads, “We have been reading poems that rhyme, so I worked with N. to write one with me today. I wrote one sentence, then N. thought of and wrote the words to complete the following sentences with a rhyming word. I wrote, Let’s have cake. It’s easy to (N. filled in the word) make. We need an oven, so we can (N. filled in the word) bake. It will be nice, to have a (N. filled in the word) slice, and if we want more, we can eat it (N. filled in the word) twice. N. used the rhyming sound to come up with her words and used the spelling pattern of the rhyming word to write.”"],"teks":["PH_LS","SP_PAT"]},{"id":"C6h","text":"Reads unfamiliar (new) paragraphs or multiple-page texts that include words with a range of decodable words with level C6 patterns (e.g., digraphs, vowel-consonant-e, - ed/- es/-ing endings, r-controlled vowels, vowel pairs) and high frequency words.","ex":["Data Sheet: C.’s reading log with a list of 6 decodable books, the patterns they include (vce, r- controlled, oo, ch/sh, -ed), and dates when they were read.","Photo: G. is standing next to the morning message holding the teacher’s pointer. A note adds, “The kids were on the carpet for morning meeting. I forgot my book so I headed to my desk to find it. Before I got back, G. stood up and started morning meeting for me. He started by reading the message aloud and successfully read all of the words: Good Morning Students, Today we are going to have Art.”","Work Sample: A decodable passage has the student’s name on top and four words circled. A note adds, “R. read the entire passage missing only the circled words. When we went back, he got them.”"],"teks":["PH_LS","FLU"]}]},{"code":"C7","outcome":"The learner applies knowledge of phonics to decode and spell one- and two-syllable words and read short texts that include these words.","note":"","indicators":[{"id":"C7a","text":"Decodes and/or spells compound words (e.g., baseball, sunset).","ex":["Note: “B. read Compounds Are Cool. I wasn’t sure how she did with the compound words (since she can’t read aloud), but a little later in the morning, I noticed her using her talker (AAC) to make the words checkbook, checkout, and checkoff.”","Photo: The picture shows three sets of combined index cards to make single words into compound words. There are also four cards with single words. A note adds, “I gave C. eight cards with the words: ball, base, box, brush, dog, hot, mail, and tooth. She read the words and then combined them to make: hotdog, baseball, mailbox, and toothbrush. She’s getting the idea.”","Work Sample: A page from L.’s journal. She wrote. Mom and Sam and me go to Target. I get new backpack. It is skishmalo Cam.” “A note adds, L. wrote about her new Squishmallow backpack.”"],"teks":["PH_ADV","SP_PAT"]},{"id":"C7b","text":"Decodes and/or spells two-syllable words with short vowels/closed syllables (e.g., basket, napkin).","ex":["Note: “B. read a story called The Contest. I wasn’t sure he knew the words ‘upset’ and ‘winner’ since we just started working on two-syllable words. I showed him those words when he finished and asked what they meant. He rubbed his eyes like he was crying in response to ‘upset’ and raised his arms in the air like a champion for ‘winner.’ So exciting to see him make this progress!”","Work Sample: A page from L.’s journal. She wrote, I go to the dollar spot. I get hallween candy basket.","Work Sample: A worksheet. One column of pictures and a column with words (basket, helmet, jacket, magnet, picnic, rabbit, ribbon, rocket, tennis, ticket). B. has connected the words with the correct pictures."],"teks":["PH_ADV","SP_PAT"]},{"id":"C7c","text":"Decodes and/or spells words with common word endings (e.g., -ful, -ly, -er, -est) added to single syllable words (e.g., painful, badly, colder, slowest).","ex":["Note: “I read Climate Change with K. today. She decoded most of the words ending in –er (faster, hotter, colder). She needed help with warmer. Warm was hard. Once I helped her get warm, she got warmer.”","Work Sample: A writing sample from N. The title is, Pumkins. We went to the pumkin farm. Mom and me ride a hay wagun. We get pumkins. I got the biggest pumkin. The teacher highlighted the word “biggest.”","Work Sample: Words listed in the left column (mean, fast, slow, cold, hot, small, old, young). T. has written the comparative version of the word (added –er) in one column and the superlative version (added -est). On the bottom of the page. T. wrote four sentences using some of the words: Tom is older. Dad is oldest. Sal is slowest. I am fastest."],"teks":["PH_ADV","SP_PAT"]},{"id":"C7d","text":"Decodes and/or spells words with common prefixes (e.g., un-, pre-, re-, dis-).","ex":["Note: “Today we read If You Were a Prefix. We took turns reading parts of the text. When it was J’s turn, he read many of the words including words with common prefixes such as unhappy, unlucky, replay, and copilot.”","Video: F. is in his wheelchair with a large plexiglass eye-gaze frame in front of him. The frame has 25 words, prefixes (un, re), and endings (er, ed, ing). The teacher says a word and F. uses eye-gaze to select the parts and the teacher writes them down. F. combines the parts to spell more than a dozen words including: unkind, undo, unlock, unmake, remove, redo, remake.","Work Sample: A writing sample from L. She wrote, We went to Target. We take back dres. A note adds, “When L. was finished, I asked if she knew the word ‘return’ means ‘take back.’ She nodded. I asked her if she could spell return, and she did.”"],"teks":["PH_ADV","SP_PAT"]},{"id":"C7e","text":"Decodes and/or spells words that have double consonants followed by -ed, -ing, - er, and - est (e.g., stop > stopped, stopping; plan > planned, planning, planner; big > bigger, biggest).","ex":["Data Sheet: A reading log listing the books D. has read including Boxes and Foxes, Fixed, and The Show. A note adds, “These are all decodable books written so kids can practice es, ed, and ing.”","Photo: A photo of the tabletop with the words sit, fit, pin, plan, run in blue marker and the words sitting, fitting, pinning, planning, running in red marker. A note adds, “I wrote the list of blue words. R. wrote the red words remembering to double the consonant before adding the -ing.”","Work Sample: A page from L.’s journal. She wrote, “I like going to Target. I like getting cloths. I love shopping.” A note adds, “When she was done, L. used her talker to tell me, ‘I’m a shop-a- holic.’ We both laughed because she always writes about going to Target!”"],"teks":["PH_ADV","SP_PAT"]},{"id":"C7f","text":"Decodes and/or spells words with diphthongs (e.g., -ou/-ow, could/cow; -oy/-oi, boy/boil; -aw/-au, paw/pause).","ex":["Data Sheet: J.’s reading log including the decodable readers Hank the Pig (oi), The Vault (au), and The Clown Who Lost Her Smile (ow). At the top of the log it says, “Books I can read by myself.”","Note: “The students are on a Shel Silverstein kick. Today, L. wanted to read Falling Up. L. read it to herself. After, I put the poem away and wrote some of the words on a whiteboard—a correct and incorrect spelling for town/toun, down/doun, sound/sownd, around/arownd. L. selected the correctly spelled word each time.”","Photo: The picture is of F.’s writing on the tabletop with an erasable marker. There are two columns with the headers: found and town. The student has correctly spelled words under each: found – sound, round, mound, pound; town – down, frown, clown, brown. A note adds, “We reviewed the diphthongs ou/ow and the keywords found and town. F. had to write some words both ways but when he looked at them, he erased the wrong one each time.”"],"teks":["PH_ADV","SP_PAT"]},{"id":"C7g","text":"Spells most (>90%) of single syllable words correctly when writing.","ex":["Work Sample: A page from L.’s journal. She wrote, “I like going to Target. I like getting things. I love shopping.” A note adds, “5/5 different single syllable words spelled correctly.”","Work Sample: A writing sample from N. The title is, My Summer. N. wrote, I swim. I like jumping in water. I went a trip. I like flying on plane. A note adds, “8/8 different single syllable words spelled correctly.”","Work Sample: A page from L.’s journal. She wrote. Mom and Sam and me go to Target. I get new backpack. It is skishmalo Cam.” A note adds, “11/11 different single syllable words spelled correctly.”"],"teks":["SP_PAT"]},{"id":"C7h","text":"Reads unfamiliar (new) paragraphs or multiple-page texts that include a range of decoded words with level C7 patterns (e.g., common words endings, common prefixes, double consonants) and high frequency words.","ex":["Data Sheet: C.’s reading log with a list of books he has read with dates. At the top it says, “Books I can read by myself.” Next to the titles in the list, some books are marked with the patterns they include (mm/tt; compound).","Note: “I projected our news article on the whiteboard. Before we talked about it, M. read the whole thing. He needed some help with a few words, but it was a long paragraph.”","Work Sample: A MAZE passage. The first two sentences are complete. After that, every 7th word is removed with three choices offered for each blank. A note added, “R. has circled the correct word for 7 of 8 blanks.”"],"teks":["PH_ADV","FLU"]}]}]},{"title":"Engagement with Text to Comprehension of Text","desc":"This scale supports tracking student progress as they learn to engage and interact during shared reading and work toward reading and listening to text with comprehension.","levelDescs":{"E1":"Communicators learning to use behaviors, gestures, and vocalizations to communicate intentionally with others and are working toward demonstrating beginning engagement with and attention during print-based interactions.","E2":"Intentional, early symbolic communicators who are beginning to attend and engage and are working toward demonstrating understanding during familiar print-based routines.","T3":"Symbolic communicators beginning to understand early literacy who are working toward demonstrating an understanding of text during familiar shared reading routines.","T4":"Flexible symbolic communicators who are starting to read and listen with understanding.","C5":"Conventional communicators, readers, and writers working on reading and listening to text and understanding it line-by-line.","C6":"Conventional communicators, readers, and writers working on reading and listening to paragraph- length text, remembering it, and demonstrating literal understandings after they are done.","C7":"Conventional communicators, readers, and writers working on reading and listening to text, remembering it, and demonstrating inferential understandings after they are done."},"placement":[{"n":1,"q":"After reading or listening to a new text that has one or more paragraphs, does the student make inferences?","yes":"Start with Level C7.","no":"Go to the next question."},{"n":2,"q":"After reading or listening to a new text that has one or more paragraphs, does the student demonstrate understanding at a literal level?","yes":"Start with Level C6.","no":"Go to the next question."},{"n":3,"q":"During reading or listening to a new text, does the student demonstrate understanding at a literal level?","yes":"Start with Level C5.","no":"Go to the next question."},{"n":4,"q":"During shared reading of familiar text, does the student use spoken words, signs, or symbols to initiate, respond, and engage in multiple turn exchanges to demonstrate understanding at a literal level?","yes":"Start with Level T4.","no":"Go to the next question."},{"n":5,"q":"During shared reading of familiar text, does the student use spoken words, signs, or symbols to initiate and respond with familiar texts and the reader for brief periods during shared reading or other academic routines?","yes":"Start with Level T3.","no":"Go to the next question."},{"n":6,"q":"Does the student respond using single spoken words, signs, or symbols when communicating with others during shared reading or other academic routines?","yes":"Start with Level E2.","no":"Go to the next question."},{"n":7,"q":"Is the student still learning to communicate intentionally and symbolically?","yes":"Start with Level E1.","no":"Start working on communication and start with Level E1."}],"levels":[{"code":"E1","outcome":"The learner demonstrates beginning engagement with and attention to language-driven interactions.","note":"","indicators":[{"id":"E1a","text":"The student attends for brief periods during shared reading interactions.","ex":["Note: “While we read Go Sleep in Your Own Bed, I tried to be very animated with the repeated line, “Go sleep in your own bed.” F smiled and bobbed his head a bit each time.”","Note: “During predictable chart writing, we were rereading the chart. D and I held the pointer together while I moved the pointer and read. He didn’t watch the whole time, but if I paused at the beginning of a sentence, he picked up his head and looked for a bit while I read.”","Photo: The teacher is pointing to an illustration in the book. V is leaning forward with his hand on the book page. A note adds: “V loved the colors in this book.”","Video: Y is rocking back and forth and smiling while the teacher is reading. A note adds, “Reading Chicken Soup with Rice, Y was animated and kept her eyes on the book for several pages. She liked the rhyme. I need to find more books like this.”"],"teks":["SSR"]},{"id":"E1b","text":"The student attends for brief periods during group discussions about academic content.","ex":["Note: “Brainstorming ideas for predictable chart sentence I will share my__. I asked T, ‘Should I add boppie?’ T vocalized and rocked at the mention of his favorite toy.”","Photo: A small group is outdoors with pinwheels. M looks back and forth at the two adults as they talk. A note adds, “He was listening! Looking at me, then Ms. S., then to others.”","Video: The teacher and a small group doing shared reading. The teacher says, “Look! I see umbrellas.” One student says, “raining.” The teacher replies, “We do use umbrellas in the rain.” Another student says, “red” and points to one of the umbrellas. The teacher then asks some students to point to different colored umbrellas. As she holds the book up for the child next to E., she leans in and looks at the book, then her peer. One other time, E. looks directly at the teacher and student the teacher is talking to."],"teks":["OL_LISTEN"]},{"id":"E1c","text":"The student responds to spoken bids for attention during shared reading interactions.","ex":["Note: “Today, at the beginning of shared reading, G was gazing out the window. I said, ‘G, let’s check out our book today!’ he shifted his gaze to the book.”","Photo: A student is laughing with the teacher during shared reading. A note adds, “J cracked me up today. He came to school so tired, but when I said, ‘Time to read! Who’s with me?’ J danced in his seat and waved his arms, laughing. He pumped us all up!”","Video: The teacher and two students are engaging in shared reading. The teacher reads a page of the book about a dog and says to the students \"I like dogs. Do you?”. H. looks up, vocalizes and smiles."],"teks":["OL_LISTEN"]},{"id":"E1d","text":"The student responds to simple directives during shared reading interactions.","ex":["Datasheet: Book titles down column 1. Dates across top with a tally of the number of times the student looked when asked, “Look at the ___.”","Note: “M was on it during shared reading today! I asked him to ‘show me the book’ and he reached for the book. I asked him to ‘tell me more,’ and he vocalized more.”","Video: Shared reading with Penguins Don’t Wear Sweaters. The teacher says, “It is cold today. We are all wearing sweaters and sweatshirts.” When she asks E to, “show me your sweater,” E touches her own arm."],"teks":["OL_DIR"]},{"id":"E1e","text":"The student initiates interactions during shared reading.","ex":["Datasheet. Books listed down first column. Dates across top. For each shared reading, the words the student initiated using his AAC device are listed with tally marks next to words that were initiated more than once.","Note: “T. had a lot to say during shared reading today. She pulled the book away from me, put her hand on a picture, and then ‘talked’ to us about the page by vocalizing. We weren’t sure what T was saying, but she sure seemed to be telling us about the book. She reached for the book each time I turned to a new page.”","Photo: Three students sitting in a semi-circle around an adult during shared reading. R. is looking down at the core board on his tray. He points to a symbol. A note adds, “While Ms. S. was reading, R. looked at her and then touched ‘DIFFERENT’ on his core board. It wasn’t clear what he meant, but Ms. S. said, ‘different’ and pointed to ‘DIFFERENT’. R. touched “DIFFERENT” again. We aren’t sure what is different, but he is trying to tell us something.”"],"teks":["OL_SHARE"]},{"id":"E1f","text":"The student engages in familiar, interactive, text-based routines without extrinsic rewards.","ex":["Note: “Today we read Pete the Cat, I Love my White Shoes. K. was with me each time I said, ‘Oh no!’ He would join me by saying his spoken version of ‘no’ while raising his hands.”","Video: During shared reading, the teacher turns to a page with an illustration of colorful umbrellas. A. reaches for the book. The teacher responds, “Do you like umbrellas, A.?” A. smiles and rocks back and forth in her chair.","Video: Small group doing shared reading of Chicken Soup with Rice. M. does her own gestures for sipping, blowing, mixing, and paddling as the teacher reads the text."],"teks":["SSR"]},{"id":"E1g","text":"The student recognizes familiar texts during shared reading interactions.","ex":["Note: “W. loves the elephant and piggie books. All I have to do it pick it up to start reading, and I have his attention through the whole book – now to broaden his interests a bit!”","Note: “We were ready for shared reading. I picked up Pete the Cat, I Love my White Shoes. Before I said anything, H. raised his arms, shrugged his shoulders and said, ‘no!’ We do this each time we read, ‘Oh, no!’ in the book.”","Photo: J. is reaching both hands toward the sky. A note adds, “We are reading a poem about the sun and stars – it has movements. J is really getting into it, especially when it comes time to reach for the sun. Before we started today, he reached up!”"],"teks":["SSR"]},{"id":"E1h","text":"The student recognizes objects that match illustrations in familiar texts used during shared reading.","ex":["Note: “When we were reading our book about clothes we wear in summer, I read, ‘This girl is wearing sunglasses.’ I pointed to the picture and said, ‘She is wearing ____.’ M. looked at the picture and reached for the sunglasses on the table.”","Photo: A group of students gathered around a chart with a recipe that has pictures to match each of the ingredients that are laid out on the table B. is pointing to the eggs. A note adds: “Each time I said, ‘Next, we need’ and pointed to the picture of the ingredient, B. pointed to the actual item on the table.”","Video: A teacher is reading Do I Have to Wear a Coat. On the table there are clothing items from the story. The teacher reads, “On rainy days we put on” then pauses and points to the illustration. The student reaches for the rainboots on the table. Later, the teacher reads, “On cool days we wear a warm” then pauses and points to the illustration. The student points to the sweater on the table."],"teks":["VOC_CTX"]}]},{"code":"E2","outcome":"The learner demonstrates understanding during familiar language-driven routines.","note":"","indicators":[{"id":"E2a","text":"The student sustains attention during language-based academic routines.","ex":["Note: “While waiting for the buses today, we read Most People. Y. looked at me, then the book repeatedly, before looking out the window to see the buses lined up.”","Photo: T is leaning toward the teacher who is reading. A note adds, “T has loved the Elephant and Piggie books we are reading. He can’t seem to get enough.”","Video: Four students and the teacher are doing predictable chart writing. A note adds, “It used to be that H. would lie his head down or look out the window when we created our charts. Today she was sitting up and looking at the chart and her friends the whole time.”"],"teks":["OL_LISTEN","SSR"]},{"id":"E2b","text":"The student identifies or provides a missing word or phrase from familiar texts, poems, or rhymes.","ex":["Datasheet: A “Poem of the Week” data sheet depicts the number of times O. completed the last line of the poem each week by directing her eye gaze to the appropriate picture from a choice of three.","Photo: M is in her chair with her left hand held high and a big grin. A note adds, “As we chant our days of the week song, M raises her hand and moves her feet to complete the sentences, ‘I can dance/shake my hands’ and ‘I can dance/shake my feet.’”","Video: The teacher reads The Tree that We Planted to a small group of students. Twice when the teacher says, “This is the ____,” G can be seen leaning forward and touching the illustration of the tree in the book. The teacher replies, “Tree, yes!” and then repeats the line, “This is the tree,” pointing to the same illustration."],"teks":["PA_RHYME","CMP_PRED"]},{"id":"E2c","text":"The student demonstrates understanding of words used to describe objects or people in familiar texts.","ex":["Note: “We are reading Ish. S is getting really into it. When we read the text, we show how the character is feeling with our faces and bodies, and S’s depictions are so spot on.”","Photo: The teacher is reading A Color of His Own. She holds a piece of black paper over the illustration of the red chameleon. A pile of colored cards is on the table. L is holding a red card. A note adds: “L found the color card that matched the description of the chameleon three times.”","Video: The teacher is doing a shared reading of The Ball Book with six children. On the table is a laundry basket with different kinds of balls. The children take turns finding the ball that matches the words on the page. A note adds: “J loves this! He is finding the ball that matches the words I read. At first, he just went for his favorite every time.”"],"teks":["VOC_WORDS"]},{"id":"E2d","text":"The student identifies characters in familiar texts.","ex":["Datasheet: The names of books are listed in the first column. Dates are listed at the top of the page. Each book has a tally with the number of times the student pointed to the character's picture when directed to “Show me <character name>.”","Note: “Today we reread Flat Stanley and The Firehouse. Whenever we read Flat Stanley’s name, we put our hands together to make a flat pancake. When I got out the book, I said, ‘Look what we’re reading today!’ and immediately G slapped his hands together to make a Flat Stanley pancake!”","Video: Shared reading with Little Bear. The teacher asks the student to “Show me Little Bear.” The student looks where the little bear appears in the bottom corner of the page. A note adds: “K. can find Little Bear even when Mother Bear is also on the page.”"],"teks":["LIT_CHAR"]},{"id":"E2e","text":"The student identifies objects in familiar texts.","ex":["Photo: The teacher is holding a class-made book about things the students do at school. On the table are familiar items students use at school (AAC devices, paper, books). T has his whole hand on the backpack that is on the table. A note adds: “T is able to identify the real objects that are part of the school routines in our book.”","Photo: The teacher is holding the book If You Take a Mouse to School. There is one student holding a block and other objects on the table. A note adds: “S. loves finding the objects that match the objects in the story. I read VERY slowly because he wants to find the objects to go with every line.”","Video: A teacher is reading about the toothbrush in Scaredy Squirrel Makes a Friend. One student picks up the toothbrush from the collection of objects on the table and pretends to brush his teeth. A note adds: “K. loves the toothbrushing part of this book.”"],"teks":["VOC_CTX"]},{"id":"E2f","text":"The student responds to yes/no questions about familiar texts using conventional gestures (head nod/shake), words, signs, or symbols.","ex":["Photo: The teacher is holding Pig the Pug. Four students are leaning in. One has his arms across his chest as if he is hugging himself. A note adds: “When I ask, ‘Will Pig share?’ T. says, ‘no, no, no, mine, mine, mine’ and hugs himself like he is protecting his stuff. He responds with a ‘yeah’ and ‘no’ to other questions, but this ‘no, no, no’ is the best!”","Datasheet: There are several sections. Each has a book name and then three yes/no questions. There is a tally next to each question showing the number of times the student answered each question correctly.","Video: The teacher is reading A Color of His Own and pointing to the red leaf and asks, “Is the Chameleon red?” The student looks up in response. A note adds: “W. is doing great looking up to indicate ‘yes’ and to the side for ‘no’.”"],"teks":["OL_LISTEN"]},{"id":"E2g","text":"The student responds to directives that are part of familiar academic routines.","ex":["Note: “M. followed multiple directives during predictable chart writing. 1. Made a choice when asked to complete the sentence. 2. Put his hand on mine to help write when asked to ‘hop on.’ 3. Grabbed the pointer when asked to read with me.”","Video: The TA is saying, “Let’s get ready for shared reading!” R. is getting out of his wheelchair to crawl to the reading table. The TA helps him get into a chair at the table. The TA says, “get your book.” R. reaches for a communication book and pulls it in front of him. A note adds, “R. loves to get ready for reading every day.”","Video: A student is working with a TA during writing. The TA says, “Tell me what you want to write about.” The student looks at a photo album on his tray. The TA says, “You choose a picture. Tell me when to stop.” The TA turns three pages, and the student smacks the tray. The TA says, “Okay. You want that one. Tell me about it.” The student then touches several symbols on his core board."],"teks":["OL_DIR"]},{"id":"E2h","text":"The student anticipates the next step in a forward progression in familiar texts.","ex":["Note: “We were reading The Little Red Hen for the 5th time this week. B. shrugs his shoulders and raises his hands while saying his version of ‘Oh well, I’ll do it myself’ after each time the other animals say, ‘Not I!’”","Photo: The photo shows a social story about getting ready to go home. A note adds: “Transitions are hard for D. This social story is helping. We read it day after day. He now anticipates what comes next after every step and things are so much better.”","Video: The teacher is reading a book about making a peanut butter and jelly sandwich on the interactive white board. She turns to a page with the text, “scoop out the peanut butter.” Before she reads, T. gestures as if he is scooping. T. does each action before the teacher reads the text. A note adds: “This is T’s favorite book and PB&J is his favorite food.”"],"teks":["CMP_PRED","LIT_PLOT"]}]},{"code":"T3","outcome":"The learner demonstrates understanding of familiar texts during shared reading.","note":"","indicators":[{"id":"T3a","text":"Makes simple predictions about next steps or events in familiar texts that have a clear sequence.","ex":["Note: “Reread Dirty Bertie. I read, ‘and sometimes….’ Before I turned the page, G put his finger in his mouth to show 'he eats it.'\"","Video: The teacher is doing shared reading with a small group. The teacher reads, \"Watch out up there! Good Trevor did cry. But the shame of it was ...\" Before the page is turned, G. points to “DOWN” on the core board. The teacher points to and says “DOWN”. Then he adds, \"Pig falls DOWN. Pugs cannot fly - they fall DOWN.\"","Work sample: A page with pictures from the book The Case of the Missing Doll with a lopsided picture glued at the end. A note adds, “G. selected the picture for the step in the story & added it.”"],"teks":["CMP_PRED"]},{"id":"T3b","text":"Demonstrates understanding of words that are used across academic contexts when they appear in familiar texts.","ex":["Note: “We were reading The School Project. I read, ‘They had to cooperate.’ And asked F what it means to cooperate. F used his talker to say, ‘ALL DO MAKE HELP.’ He gets it! When we cooperate, we all do it together. We all make, and we all help.”","Note: “We read Looms and Weaving getting ready for an art project. I read, ‘They create patterns and colors.’ I said, ‘Create means ____.’ J selected ‘MAKE’ on his talker.”","Video: The book Field Trip on a Boat is on the interactive whiteboard showing the text, ‘First you plan your field trip.’ The teacher reads the page, and G selects “NEED” on his AAC device. The teacher says, ‘Yes, we can plan. We can make a plan about things we NEED.” She points to “NEED” on his device while saying the word."],"teks":["VOC_WORDS","VOC_CTX"]},{"id":"T3c","text":"Demonstrates understanding of words used to describe objects and people in familiar texts.","ex":["Datasheet: Books are listed down the first column with a tally indicating the number of times G. pointed to the correct object or character.","Note: “Today we read, After the Fall. G identified the white and green Humpty Dumpty.”","Video: A small group doing shared reading. G. correctly points to pictures in the book as the teacher says, “Show me the red ball.” Then, “Show me the old man.”"],"teks":["VOC_WORDS"]},{"id":"T3d","text":"Identifies the beginning and end of familiar stories.","ex":["Datasheet: Books are listed down the first column, and reading dates are listed across the top. A +/- indicates when G. identified the beginning and end of each.","Note: “G identified the picture matching the beginning and ending of our story today.”","Note: “After reading today, G. put photocopies of pages of the story in the right order.”"],"teks":["LIT_PLOT"]},{"id":"T3e","text":"Identifies concrete details about characters in familiar texts.","ex":["Note: A frequency count on a sticky note with three tally marks and a note that reads, “G. named the people in the pictures three times today!”","Note: “While reading The School Project, the CROWD comment was, ‘Tell me about Peter.’ G. pointed to the words ‘MAKE’ and ‘COLOR’. I asked him to show me where Peter ‘MAKE COLOR’. G turned to the page with the colored pencils.”","Note: “We were reading After the Fall. JT used the response sheet I made to tell me when Humpty was ‘hurt’, ‘scared’, and ‘happy’.”"],"teks":["LIT_CHAR"]},{"id":"T3f","text":"Identifies concrete details about the setting in familiar texts.","ex":["Datasheet: Tally marks show that G. correctly identified the places where the boy went during repeated reading of What If Everybody Did That?","Note: “We’ve been reading The Panda Problem. G. repeatedly indicated ‘yes/no’ when I asked about things in the bamboo forest (the setting).”","Note: “Book: Creepy Carrots. I read, ‘Later that night, as Jasper lay in bed, he heard it. Breathing. Terrible carroty breathing’ CROWD comment, ‘Tell me where Jasper is.’ G. pointed to the word ‘SLEEP’ on his device (he doesn’t have bedroom).”"],"teks":["LIT_SET"]},{"id":"T3g","text":"Identifies concrete details about events in familiar texts.","ex":["Datasheet: Events and details from Pig the Pug (e.g., event – Pig won’t share. Detail – he piles up his toys; he says, MINE, MINE, MINE) are listed with +/- showing that G. identified more details with each reading.","Note: “We were reading Snowmen at Night and D. pointed to pictures to show me details as I read about the events. Things like, ‘They skated on the __.’ And ‘They threw the __.’”","Video: Shared reading of Koala Can Do with two other students. The teacher says, “Show me who asks Kevin to play?” and G. points to the wombat in the illustration."],"teks":["LIT_PLOT"]},{"id":"T3h","text":"Responds to simple wh- questions during shared reading of familiar texts.","ex":["Datasheet: Book title on top, Chickens to the Rescue. Wh- questions listed down the first column. Dates across top. +/- shows that P. answered 2 wh- questions during the first reading (“What did the chickens make?” and “What animal did the chickens rescue from the tree?”) and many more after multiple readings.","Datasheet: The sheet has the book title on top, Koala Can Do. List of wh- questions (e.g., Where is Koala? What does Koala eat?) and date at top of the column for each day of repeated reading and +/- indicating responses to questions.","Note: “Book: The Very Noisy Bear. CROWD wh- question: ‘What instrument does bear play?’ G pointed to the guitar in the illustration.”"],"teks":["OL_LISTEN","CMP_Q"]}]},{"code":"T4","outcome":"The learner demonstrates understanding DURING shared reading and discussion of FAMILIAR texts.","note":"","indicators":[{"id":"T4a","text":"The student demonstrates understanding of content-specific words that appear in familiar texts during shared reading interactions.","ex":["Datasheet: The sheet is from a repeated reading of Don’t Let the Pigeon Drive the Bus. Words are listed down the first column—dates across the top. Tally showing the number of times N. demonstrated understanding of the words by pointing to the picture, using gestures, or using his AAC device.","Note: “We’ve been reading Pig the Pug. Each time we get to the part about wobbling, I’ve been acting out wobbling. Today, R. rocked side to side in his seat to show me wobbling before I had a chance to do it.”","Video: A small group doing a shared reading with Ruby Finds a Worry. The teacher read, “She loved to explore wild, faraway places.” She asked, “What does explore mean?” J used her AAC device to say, “LOOK DIFFERENT.” The teacher adds, “Yes when we explore, we LOOK in DIFFERENT places,” as she selects LOOK and DIFFERENT on the device. Then the teacher adds, “You remembered!”"],"teks":["VOC_WORDS","VOC_CTX"]},{"id":"T4b","text":"The student demonstrates understanding of characters and their actions in familiar texts during shared reading interactions.","ex":["Note: “We’ve been reading ‘Who sank the boat’ and talking about the characters. Today, A. pointed to the mouse in the picture when asked, ‘Who sank the boat?’”","Note: “During today’s shared reading with The Train Ticket. L. pointed to the picture of Jo March in the book when asked, ‘Who cut her hair?’”","Video: P. used his AAC device during shared reading to say, “GO GO” when the teacher asked, “What did the hare do?”"],"teks":["LIT_CHAR"]},{"id":"T4c","text":"The student demonstrates understanding o
