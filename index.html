f events in familiar texts during shared reading interactions.","ex":["Note: “We read Living at Camp Green Lake again. I asked, ‘Why is Stanley at Camp Green Lake?’ J. used his communication device to say, ‘TAKE,’ and pointed to his shoes.”","Note: “We’ve been reading Pig the Pug. Today, L threw his arms up and pretended to fall out of his chair when I asked, ‘What happened to Pig?’”","Video: Shared reading with Gift of the Magi. The group is gathered in front of a whiteboard. The teacher says, “We know that Della cut her hair. Why did Della cut her hair?” A. says what sounds like “money.” The teacher adds, “What about money?” A. uses her AAC device to say “NEED” and then says the approximation of “money” again."],"teks":["LIT_PLOT"]},{"id":"T4d","text":"The student demonstrates understanding of settings in familiar texts during shared reading interactions.","ex":["Datasheet: The book’s name is Because. Questions are listed in the first column. Setting questions include: Where did the orchestra play? Where did the woman play music? Dates are listed across the top with a tally mark each time questions are answered correctly. By the final three dates, the student got the questions right 75% of the time.","Note: “Re-reading Pigeon Needs a Bath today. On the comic-like page, I asked, ‘Where is the pigeon?’ G used his gesture for ‘bathroom’.”","Note: “We read Living at Camp Green Lake for the last time this week. I asked, ‘What was camp like?’ L. told me, ‘BAD WORK, NO DRINK.’ So many words!”"],"teks":["LIT_SET"]},{"id":"T4e","text":"The student sequences the beginning, middle, and end of a familiar texts during shared reading interactions.","ex":["Datasheet: Book name is The Sandwich Swap. The first column lists questions and sequence. Tally marks show that R. correctly sequenced 3 pictures illustrating events from the beginning, middle and end of the story on the 3rd and 4th dates.","Note: “We’ve been working on sequencing the events. Today we reread The Invisible Boy. Yesterday, Z. got the beginning and end. Today, Z. got the beginning, middle and end.”","Photo: J. is at his desk with three pictures from The Invisible in front of him. A note adds: “J’s been working on sequencing the events from the story. After reading today, J put the three pictures in order, without any help!”"],"teks":["LIT_PLOT"]},{"id":"T4f","text":"The student relates information from familiar texts to personal experiences during shared reading interactions.","ex":["Note: “Shared reading with Kinds of Gardens. We’ve been talking about the kinds of gardens we have at school and home. Today, M. made lots of connections. She signed ‘Mom’ on the page about flowers (she has a flower garden at home). Said ‘NOT’ using her talker on the page about tomatoes (she does NOT like tomatoes).”","Note: “Rereading Pig the Pug today. J saw the picture of Pig in a cast and said, ‘Luke.’ Luke had big casts for weeks after hip surgery.”","Photo: Four students at the table with a teacher who is holding up Ish. One student is pointing to another area in the room. A note adds: “I read the first line, ‘Roman loved to draw.’ A. squealed and pointed to her drawings on the bulletin board. She does LOVE to draw.”"],"teks":["CMP_CONN","RESP_CONN"]},{"id":"T4g","text":"The student relates information from familiar texts to prior knowledge during shared reading interactions.","ex":["Note: “We’ve been reading Taking Care of a Dog. JR has 3 dogs. As we were reading, JR made connections. After I read, ‘Dogs need food’, JR said, ‘EAT.’ I read, ‘Give your dog toys.’ JR said, ‘PLAY.’ I read, ‘Take your dog for walks.’ JR said, ‘GO.’”","Photo: Picture shows the cover of the book, Movie Night. There is a note attached that says, “J. loves the movies. As we’ve been reading the book we’ve been talking about the illustrations – some don’t show movies at all. Today, as I read, J. used his talker to say “MOVIE” and then used his voice to say “not” to label each illustration.","Video (two edited clips): The teacher is reading Dragons Love Tacos with a small group. Several children are making comments. A note adds: “W. loves this book! She is calling out ‘NOT’ as soon as I read the title. She really does not love lunch on taco Tuesdays. When I read about salsa she makes a yukky face, adding “NO, NO, NO.” She is so funny that we programmed a message on her talker. It is, ‘PLEASE HOLD THE TOMATOES AND SALSA.’ Now she says that during shared reading and can’t wait to use it next Taco Tuesday.”"],"teks":["CMP_CONN"]},{"id":"T4h","text":"The student relates information from one familiar text to other familiar texts during shared reading interactions.","ex":["Note: “Last week, we read Apples & Oranges Going Bananas with Pairs and talked about how silly the author was telling us about differences. The kids loved it. This week, we’re reading Don’t Judge an Egg by Its Shell. Today, KT. told me ‘WANT FUNNY.’ It took me a minute, but I realized he was telling me he wanted the funny book from last week. I asked him if the egg book was funny. KT told me, ‘NOT FUNNY.’ Then we had fun as I held up one book and the kids said FUNNY. Then I’d hold up the other and they said NOT and NO.”","Note: “We’ve been reading books about helping. Last week we did repeated shared readings with Omakayas and listed the things she did to help. This week we’re reading I Can Help and checking our list to see what is in both books. M. identified the two things that are in both books.”","Photo: TJ is grinning with copies of Pigeon Needs a Bath and I Will Never Not Ever Eat a Tomato on his tray. A note adds: “Reading I Will Never Not Ever Eat a Tomato. TJ. used his talker to say, ‘BIRD.’ I was confused and asked for more. He told me, ‘BOOK’ then added ‘BATH.’ I got it!!, ‘Do you mean the book Pigeon Needs a Bath?’ He gave me an excited YES and Ms. T. got the book. I asked him, ‘What about the pigeon book?’ He said, ‘BIRD GIRL SAME.’ WOW!!!! What a connection. The girl is full of reasons just like the pigeon.”"],"teks":["CMP_CONN","RESP_CONN"]}]},{"code":"C5","outcome":"The learner demonstrates explicit understanding of key words, ideas, and details DURING reading or listening to NEW texts.","note":"","indicators":[{"id":"C5a","text":"The student demonstrates understanding of content-specific words during reading or listening to new texts.","ex":["Note: We were reading a simplified version of Esperanza Rising today. I read, “Papa handed Esperanza the knife. The short blade was curved like a scythe, its fat wooden handle fitting snugly in her palm.” I asked, “what is a scythe?” K. went to the mealtime page on her talker and said, “Cut it up, please.” I told K. yes, we use it to cut things. Then I showed her how to find knife on her talker. She repeated, “knife.” I then said, a scythe is a special kind of knife. Do you know where this special kind of knife is used? K. indicated “no” so I showed her “farm” on her talker and said “farm.” Once we were on the farm page, K. selected “crops.” We were so excited. Yes! A scythe is a kind of knife used on farms to cut crops.","Photo: A photo of the message window of an AAC device with the words “MAKE DO NOT NOT GET IT.” A note adds, “We were reading our new book about Harriet Tubman. I read a sentence with the word ‘enslaved.’ I asked B. to tell me about the word ‘enslaved.’ The photo shows what he told me. The next line of the book was “They forced her to work with no pay.” B. cleared her display and said, “NOT GET.” She is right. People who are enslaved do NOT GET paid.","Work Sample: A copy of a page of information text about bees and pollen. The word pollen and the picture of a flower are circled. There is a note that says, “I stopped after reading, ‘How do flowers make fruit? They need pollen.” I said, “Pollen. Tell me about that word.” J. said, “yellow.” I said, “tell me more.” J. added, “mom car yellow.” I am sure I laughed as I confirmed, “Yes! Our cars get yellow from pollen every spring.” Then I asked, “where does pollen come from?” J. said “plants.” I asked, “what kind of plants.” J. said, “flower plants and trees.”"],"teks":["VOC_WORDS","VOC_CTX"]},{"id":"C5b","text":"The student demonstrates understanding of characters and their actions during reading or listening to new texts.","ex":["Note: “Today we read ‘Who Sank the Boat.’ As we read each page, I stopped and asked K. to tell me about the animals. From the first time she said “GO IN.” By the 5 th time, she laughed as she repeated “GO IN.” First time reading this book and she gets it.","Note: “L. read The Train Ticket with the para today. After reading most pages, the para turned the text into a question. For example, after reading “Jo liked to write” the para asked, “Who liked to write?” L. used her talker to say “JOE” (her Dad’s name) each time.","Work Sample: The work sample has pictures of the characters in Garcia and Collette Go Exploring. There are pictures of a hat, socks, peanut butter sandwiches, a notebook, and a pen. The student has drawn lines connecting the characters with the objects they used in the story."],"teks":["LIT_CHAR"]},{"id":"C5c","text":"The student demonstrates understanding of events during reading or listening to new texts.","ex":["Note: Reading The Great Kapok Tree. After I read, “One by one the animals came down to speak to the man,” I paused. M. said, “want help,” using her device. I said, “Tell me more,” and she added “tree.” She clearly understood the event of animals convincing the man to stop cutting to save the tree.","Photo: Three sentence strips tacked on the white board with magnets. “We reviewed the three events in random order before reading. As I read to the group, P. was in charge of listening for each event. When I read about the first event, we stopped to review the sentences and decide which one matched what I just read. Before reading again, I reviewed the remaining two sentence strips. When I read the next event, P. stopped me and pointed to the strips. With some help reading them, P. found the next event and put it after the first. When I read the final event, P. stopped me again and moved the third sentence strip below the first two.”","Video: The teacher is reading Harriet Tubman to a small group. The teacher reads about the people hiding Harriet during the day and helping her with directions at night. The teacher asks, “why are people were hiding Harriet?” F.: “she slave.” Teacher: “Yes, she is a slave. Tell me more.” F.: “She run away.” Teacher: “Yes, she is running away. Why is she running?” Long pause … F.: “She scared.” Teacher: “Yes, she is scared. She is running because she is afraid to be sold. She is scared. Tell me more.” F.: “Can’t see at night.” Teacher: “Who can’t see?” F.: “bad guys can’t see her.”"],"teks":["LIT_PLOT"]},{"id":"C5d","text":"The student demonstrates understanding of settings during reading or listening to new texts.","ex":["Note: Reading A Walk in the Woods for the first time. I read, “They stepped into the dark forest,” I asked Z. to tell me the setting. Z pointed to the picture. I asked him to tell me more. He pointed to the text. Again, I asked him to tell me more. He looked closely, paused, and pointed to the word, forest. I told him yes, it is the forest, then I showed him how to find that word on his device if he wanted to say it again. That then led to a great conversation with the group about the words forest and woods.","Photo: A photo of a page from Farmhouse with a picture symbol for kitchen and a choice board with three symbols representing other rooms in the house. A note adds, “We talked about the rooms in a house and reviewed the symbols before reading. While I read, I asked, “what is the setting?” L. picked the right symbol each time. (I had to remind myself to ask about the setting not “where are they?”).","Video: The teacher is reading The City of Ember to a small group, She reads, “The streets were lit only by old lamps.” The student R. is typing on his AAC device. The device speaks, “dark.” The teacher responds, “Yes, it is dark. What is the setting?” R. types more and the device speaks, “city.”"],"teks":["LIT_SET"]},{"id":"C5e","text":"The student sequences the beginning, middle, and end during reading or listening to new texts.","ex":["Note: Reading Nora and the Sacred Stones. After the first chapter, I asked S. to tell me what happened at the beginning, middle, and end of the chapter. I told S. to stop me when I read about one of the events. When S. stopped me, I used partner assisted scanning for the beginning, middle or end as needed. S. got them all.","Photo: A whiteboard with three sentence strips. Note: “Events from The Red Pencil. We talked about what each strip said before reading. Then G. was my helper and put them in order while I read.”","Work Sample: The Paper Dragon is written across the top. There are three boxes labeled ‘first,’ ‘next,’ and ‘last.’ There is a picture cut out and placed in each box. A note adds, “We cut out the pictures before reading. Then, while I read, T. put the pictures in the right box. After we read, he used the three pictures to help him retell the story!”"],"teks":["LIT_PLOT"]},{"id":"C5f","text":"The student relates information in a text to personal experiences during reading or listening to new texts.","ex":["Note: Reading The Year We Learned to Fly. I told the students to listen and think about ways they were like the characters. When I read, “She stared out the window wishing, for something different,” J. called out. I stopped and waited as he selected a message using his AAC device. J. said, “I want LEGOLAND.” J. got that the girl was wishing just like he wishes.","Photo: P. is holding the book The Wild Robot on the Island. He is pointing to a bulletin board with a picture he drew of his house. A note adds, “While I was reading about Roz’s safe home, P. signed “me, me, me” by patting his chest. I stopped and asked him to tell me more. He said something that I could not quite understand. Then he pointed to the bulletin board where there was a picture he had drawn of his house. In the moment it took me to understand, he bolted over to the picture, pointed at it, then signed “me, Mom, Dad, good, home.” I asked, “Is your home a safe place too?” P. said “yuh, yuh.”","Video: The teacher introduces a new book, Each Kindness. She reminds the small group, “While I read, remember to think about the ways the book connects to your own life.” Then she adds, “Stop me if I read something that makes you think about your own life.” When the teacher reads, “She wished she had been kinder,” M. vocalizes and signs “sorry.” The teacher stops and says, “Are you sorry M?” M. confirms with a vocal “uh huh” and signs sorry again then points to another student. The peer says, “It’s okay, M. I know you didn’t mean it.” The teacher says, “Good connection, M. The character is sorry. She wishes she was kinder. You said you were sorry too,..”"],"teks":["CMP_CONN","RESP_CONN"]},{"id":"C5g","text":"The student relates information in a text to prior knowledge during reading or listening to new texts.","ex":["Note: We were reading The Boy Who Harnessed the Wind. I read, “He studied how the blades turned in the wind,” I noticed P. starting to use his talker. Then he said, “turn make go.” I asked him to tell me more. He pointed to the corner where we made pinwheels during science. He connected our science unit to the book!","Note: We were reading Charlotte’s Web. We got to Chapter 8 where it is revealed that Fern can hear Wilbur talking. As I read about Mom being worried, C. said, “animals can’t talk.” C. used background knowledge to understand why mom was worried.","Video: The teacher introduces the new book, Coral Reefs. She says, “We’re starting this new unit on coral reefs. You already started building a coral reef with Ms. P. during art. We’re going to learn more about them during science. Today, we’ll start reading this new book.”When the teacher reads, “A coral reef is an important ecosystem” B. calls out, “Like a forest!” The teacher says, “yes! A coral reef is an ecosystem like forests are an ecosystem.”"],"teks":["CMP_CONN"]},{"id":"C5h","text":"The student relates information from a previously read text during reading or listening to new texts.","ex":["Note: Reading Freedom Soup, when I read the part where the grandmother explains how their family honors the people who fought for freedom, K. used her device and typed “Harit,” connecting this book to the Harriet Tubman book. I asked K to tell me more. K added, “want free.” She made the connection – Harriet wanted to be free and the people in Freedom Soup wanted freedom.","Photo: R. holding the books Rain and When Rain Falls. The note says, “Reading our new book, Rain. I read the part about the dog hiding under the porch and in the shed, R. said “like a fox.” I asked him to tell me more. He said it was like the Rain Falls books. I didn’t make the connection so I asked if he could show me. He got the book, When the Rain Falls and turned to the page showing the fox hiding from the rain.","Video: During a new reading of The One and Only Ivan, when I read, “Ruby looked scared,” A. pointed to the book jacket for Bridge to Terabithia. I said, “Are you remembering that Jess was scared about crossing the creek when it was raining? We were all scared about that.” A. shook his head, “Yes.”"],"teks":["CMP_CONN"]}]},{"code":"C6","outcome":"The learner demonstrates explicit understanding of key words, ideas, and details after reading or listening to NEW paragraph-length texts (or longer).","note":"","indicators":[{"id":"C6a","text":"The student demonstrates understanding of the intended meaning of multi-meaning words after listening to or reading new paragraph-length texts.","ex":["Note: I’ve been reading aloud from The Treasure Hunters. The phrase “bolt for cover” appeared in the new chapter I read today. I stopped at the end of the paragraph to ask the students about the word bolt. No one answered so I asked them to listen carefully for the word while I reread the paragraph. When I finished reading R. used his device to say, “GO FAST.”","Note: I read a passage about steer that were allowed to roam on the range. First, I showed the two words. I asked kids to think about what they mean. They immediately connected steer to Don’t Let the Pigeon Drive the Bus. The pigeon wants to steer the bus. The kids couldn’t come up with any other meaning. I asked them to listen while I read the passage to see if they could figure out what steer meant. After I read, I paused and R. said, “like cow.”","Work Sample: A passage about a group of kids in the gym playing a game being very loud. The passage ends with “the racket ended when the bell rang.” The student has drawn a picture to illustrate it. There are lines coming from the mouths of the stick figures and one stick figure with its hands over its ears."],"teks":["VOC_CTX","VOC_WORDS"]},{"id":"C6b","text":"The student demonstrates understanding of characters and their actions after listening to or reading new paragraph-length texts.","ex":["Note: At the end of each page in our Amelia Bedelia book, I stopped to ask what Amelia did. Then we’d talk about what she was supposed to do. T. pointed to the illustrations, acted out cutting, and used his voice to say “out” while pointing to the illustration on another page. T. showed me that he understood Amelia and her actions.","Note: I read the next chapter of Because of Winn-Dixie. After I asked, “Why did Opal help Winn- Dixie?” R. used his device to say, “Dog scared.” R explained the character’s actions and motivation.","Work Sample: There is a list of three characters on the left. On the right are three pictures with captions depicting actions. There are lines connecting the characters and actions with a note “We reviewed the character names and the actions before reading. Then L. listened while I read the short chapter. After, L. correctly matched the characters and actions with no help!"],"teks":["LIT_CHAR"]},{"id":"C6c","text":"The student demonstrates understanding of events after listening to or reading new paragraph-length texts.","ex":["Note: After reading a paragraph from The Wild Robot Protects, I said, “tell me what happened when the boats arrived.” T. used her device to say, “Take her.” T. summarized the key event from the paragraph with a couple of simple words.","Video: The teacher is with a small group of students at a table. Each student has a copy of Stone Fox (one is clipped open on a slanted display). The teacher closes her book and says, “how do you feel?” Some students say “sad.” One student signs sad. V. uses his AAC device to say, “sad happy.” The teachers turns to V. and says, “sad and happy?” Everyone agrees that they feel sad. Tell us why you feel happy. V. looks at his AAC device and after a long pause presses two buttons and says, “he help.” The teacher confirms, “Oh, it makes you happy that Stone Fox helped Willy. That is a feel-good moment. It is sad that Searchlight died, but it is happy that Stone Fox helped.”","Work Sample: The page shows a t on the top, Stone Fox Chapter 2. Directions: Mark all the things Willy did to help his grandfather. There are 12 picture symbols depicting tasks on a farm (feeding a horse, milking a cow, shucking corn, picking potatoes). Five of the pictures are marked with a big X and the teacher has written “100%” on the top."],"teks":["LIT_PLOT"]},{"id":"C6d","text":"The student demonstrates understanding of settings after listening to or reading new paragraph-length texts.","ex":["Note: I just read chapter 3 of Front Desk. After I read the first few pages, I stopped and asked, “Where is Mia?” S. said, “Hotel.” I confirmed and asked S. to tell me more. S. added “office.” Again, I confirmed and asked, “What is special about this office? What do people do when they come to this office?” S. said, “Get a room? Pay?” We then talked about a lobby and the front desk at a hotel or motel. It led to a good conversation about a 10-year-old doing that job.","Photo: A choice board with three setting symbols (school, forest, neighborhood). An added note: “Before reading, I told J to listen to identify the setting. After hearing the paragraph from A Bike Like Sergio’s. J. pointed to the symbol of neighborhood and correctly said, “street.”","Video: Reading a paragraph from The Year of Billy Miller, the teacher told K and the others to listen to decide where the characters were, the setting. Before she finished, K. waved his hand and signed ‘school.’ K correctly identified the setting."],"teks":["LIT_SET"]},{"id":"C6e","text":"The student will sequence three or more events after listening to or reading new paragraph-length texts.","ex":["Note: Before I read the passage, I told students to listen to remember the order things happened, or the sequence. After, L. used her device to say, “push, teacher, say.” L. very efficiently captured the events in the right order.","Photo: On a table there are three cards with the words “first, next, last” and three cards with the pictures, ‘suitcase, open, tiger.’ A note says, “After reading the paragraph from The Tiger Rising, P. placed the picture cards in the right order.”","Work Sample: The Chalk Box Kid is printed at the top. Three pictures depicting events are glued onto the page (walking to the yard, finding the empty building, drawing on the wall). In teacher handwriting it says, “100% independent work!”"],"teks":["LIT_PLOT"]},{"id":"C6f","text":"The student relates personal experiences to the text after listening to or reading new paragraph-length texts.","ex":["Note: After listening to a paragraph from The Chalk Box Kid, T. pointed to his drawing from art and said, “same.” T. recognized a similarity between the characters' work and his own work during art.","Note: When I finished the paragraph from The Invisible Boy about Brian, standing alone, M. pressed, \"no play\" on his device and looked toward the door where the class lines up for recess. M. connected the moment in the text to yesterday’s recess time when he couldn’t go outside to play.","Photo: A student pointing to frustrated on a feelings poster that is hanging on the wall while holding a Jenga game box. A note adds, “I read a story about a boy whose science project fell and broke. After, I asked how the boy was feeling. S. vocalized, gestured, and pointed to the poster. I asked him to tell me more. He went to the poster and pointed at frustrated. Then he started walking to the break corner. I was trying to redirect him back our group when I realized he was getting the Jenga box. He gets so frustrated when the Jenga tower falls.”"],"teks":["CMP_CONN","RESP_CONN"]},{"id":"C6g","text":"The student relates prior knowledge to the text after listening to or reading new paragraph-length texts.","ex":["Note: Before reading a section of Those Shoes about choosing needs instead of wants, we sorted pictures of different things based on needing them (food, water, sleep) and wanting them (treats, toys, parties). I told students the purpose was to listen to decide what the boy in the story needs and what he wants. After, K. said “need shoes.” I asked him to tell me more. He said, “we need shoes.” I confirmed and asked, “do we need the shoes everyone else has?” K. said, “no, he want those shoes. We need shoes but not those shoes.” K. gets it!","Note: Reading Mirette on the High Wire. During the anchor step, we talked about problems we remember from other books. Then I told the group that Bellini has a problem. Their task was to listen to tell me about his problem. I stopped half-way through to remind the students that they were listening to tell me about the problem. After reading, B. told me, “he scared.” I confirmed. Then I asked, “What is Bellini scared about?” B. says, “Walking up high.” Again, I confirmed and asked why. B. added, “He fell.”","Video: The teacher is sitting with a small group. She is reading Each Kindness. Before reading she tells the group, “We’ve been learning to be good friends to each other. Remember our class rules?” She points to the rules that are posted behind her. Then she says, “As I read this today, think about our class rules.” Which rules do Chloe and the others break?” The video cuts and then starts again with P. saying, “respect” while pointing to “be respectful” on the list of rules."],"teks":["CMP_CONN"]},{"id":"C6h","text":"The student scores > 80% correct on a Modified CLOZE (MAZE) Assessment after repeated readings of complete paragraph-length texts.","ex":["Datasheet: The titles of 6 texts listed down the first column and dates across the tops. There some rows have one MAZE score – others have two or three. The scores for the final read on the last three texts are 11/13; 12/14; and 8/10.","Note: Monday MAZE assessment. Took a 1st grade oral reading fluency passage and turned it into a MAZE assessment using Intervention Central.","Note: This is working! The student reads the story with me, and we work through words as needed. Then he practices reading the story for homework. On Friday he does the MAZE. He got 9/11 (81%) again this week!","Work sample: A MAZE passage from AIMSweb at the first-grade level. Score of 81% circled on top."],"teks":["CMP_MON","FLU"]}]},{"code":"C7","outcome":"The learner demonstrates the ability to make logical inferences AFTER reading or listening to NEW paragraph-length text (or longer).","note":"","indicators":[{"id":"C7a","text":"The student determines the meaning of unfamiliar words using context clues or knowledge of word parts or relationships while reading or listening to new paragraph-length texts.","ex":["Note: Before reading today, instead of just teaching the meaning of all the words, I asked students to decide which words they did and did not know. The words were glimmered, flickering, shadowy, shining, flashes. The students had reasonable understandings of all the words except glimmered and flickering. I asked them to listen while I read to see if they could figure out the meaning of one or both. I read, “A faint light glimmered at the edge of the forest, flickering softly like a tiny star pushing through the darkness. The trees around it stayed shadowy and still, but the light kept shining in little flashes.” After, T. said glimmered mean “a little light goes on, off.” I asked if he had ever seen something that glimmered, he pointed to my ring.","Note: Reading today we read about \"muffled voices.\" J. asked what it meant. I asked him to think about all of the words as I read it again to think about what it might mean. I reread, emphasizing, “Jason could barely hear the muffled voices on the other side of the door.” J thought for a minute and then said, “quiet. Maybe he couldn’t hear because they were so quiet?” It isn’t 100% but J. is showing that he can figure out the meaning using context and his background knowledge.","Work Sample: A page with a paragraph on top of several words in bold font. Below the bold words are listed on the left and root words related to the bold words are on the right. The student has matched each of the common root words with the bold words."],"teks":["VOC_CTX"]},{"id":"C7b","text":"The student demonstrates understanding of inferred information about characters after reading or listening to new paragraph-length texts.","ex":["Note: Before reading the 2nd chapter of Charlotte’s Web I gave students a list of good/bad things people do. We talked about each and what we might know about a person who would lie, steal, pick up litter, help a friend who fell. Then I asked them to think about the things Fern does and what they tell us about Fern. After I read, T. told me that Fern is “nice” that she “helps people” and “likes animals.” Each is an inference based on what we’ve learned about Fern so far.","Photo: A picture of R. looking at the camera looking very worried. There is a note that adds, “after reading a paragraph about a boy sitting alone watching for someone out the window, R. said the boy was \"worried\" and made this face. He was right, the boy in the story was worried. I had to get a photo of this expression!”","Video: A small group sits with an adult at a table. They are discussing part of a book. The teacher describes how the character cleaned up after everyone else. While the teacher is talking S. uses her talker to say, \"he help.\" The teacher acknowledges the comment saying, “Yes! It doesn’t say he is helping, but it is helping when you clean up after other people. That was a good inference, S. You used the information the author gave us plus your own information to figure that out.”"],"teks":["CMP_INF","LIT_CHAR"]},{"id":"C7c","text":"The student demonstrates understanding of inferred information about settings after reading or listening to new paragraph-length texts.","ex":["Note: After reading a paragraph describing wet floors, wet coats, and umbrellas, K. said, \"it's raining,\" even though the text never said it was raining.","Note: After listening to a poem about cold air, boots by the door, a warm cozy robe, and quiet, dark mornings,\" A. inferred the setting by saying “somebody’s home in winter”.","Work sample: A story on the top half of the page. The story is about a basketball game. It gives details about high school students playing a game with bright lights, a net, two teams, and people watching. Below the story are three fill-in statements. The student has circled the correct answer to the questions. One question asks, “The teams are playing a game in the _____.” Q. correctly identified gym."],"teks":["CMP_INF","LIT_SET"]},{"id":"C7d","text":"The student demonstrates understanding of inferred information about events or actions after reading or listening to new paragraph-length texts.","ex":["Note: I was reading aloud about the end of the big ball game. I read, “Jordan stepped back, shot the ball toward the net. The buzzer sounded. Jordan’s team went wild. The crowd cheered, ‘Jordan! Jordan!’” I asked what happened and B. used his talker to say, “He did it.” I asked, “What did he do?” B. added, “HE PUT IT IN.” I asked him to tell me more and B used the keyboard to spell “bal.”","Note: We read Ish. Before we read, we talked about perspective, and the ways we can have different perspectives about things. We talked about some examples from class, and I asked kids to listen for the differences. After, D. turned to the part of the book with the sister’s gallery of crumpled pictures. Then he used his talker to say, “She like. He not like.” I asked him to tell me more. D. added, “He put down.” I waited and D. added, “She get. She put up.”","Note: We are reading Divided Loyalties (about the American Revolutionary War). It is a play and the kids have to figure out what is happening based on the things the characters are saying. T. is loving it. Today, T. correctly identified characters who were arguing and told me about the ways they were probably looking at each other."],"teks":["CMP_INF","LIT_PLOT"]},{"id":"C7e","text":"The student demonstrates the ability to make inferences to sequence a combination of explicitly and implicitly occurring events after reading or listening to new paragraph-length texts.","ex":["Note: Read a short story describing a bell ringing, students grabbing backpacks, and students getting on the bus. B sequenced sentence strips with each event. Then pointed correctly to show when missing events happened when I asked, When did they line up? When did they clean up? When did they walk down the hall?","Note: Reading about a cat that knocks things off the counters. His owner has to clean up over and over again. One day, a plant spilled and the owner thinks it was the cat, but the author has given clues that the reader know it was actually the dog. D. got it! He put together the events and the clues.","Work Sample: There are five pictures glued on the sheet. A teacher note adds, “Three of these events were explicitly stated. T. got the other two by inferring.”"],"teks":["CMP_INF","LIT_PLOT"]},{"id":"C7f","text":"The student demonstrates the ability to draw upon personal experience to make inferences about the feelings or intentions of characters after reading or listening to new paragraph-length texts.","ex":["Note: During morning meeting, students shared their artwork from yesterday. Later I read a paragraph describing a character running toward her with a big smile as she held up her finished project. After listening, M said \"she is happy, like when I showed my picture,\" pointing to the drawing he shared earlier. I saw him connecting the characters' excitement to a similar experience he had at school.","Note: We are reading Anne of Green Gables. I read a page that included the lines, ’Now you just listen to me, Matthew Cuthbert,’ said Marilla. ‘You’re not getting any younger, and you need some help with the chores.’ I asked how Marilla was feeling. C. said, “mad.” I asked how she knew that. C. pointed and wagged her finger like someone might do while saying “now you just listen to me” and then C said, “like mom.”","Note: We’ve been reading Charlotte’s Web. We got to the part where Fern spends less time at the farm. Before reading we did an anchor activity focused on the ways people make us feel. Then I asked the kids to listen to decide how Wilbur was feeling during that part of the chapter. E. used his talker to tell me that Wilbur felt “sad.” When I asked how he knew, E. selected a prestored message on his talker that said, “I had fun when Nana and Papa came to visit. I was sad to see them go.” We had a great follow-up conversation about how happy it makes us feel when people visit and how sad it can be when they go."],"teks":["CMP_INF","CMP_CONN"]},{"id":"C7g","text":"The student demonstrates the ability to link problems and solutions or events with outcomes after reading or listening to new paragraph-length texts.","ex":["Note: after reading a paragraph that described a group searching for a lost glove and later, smiling on the walk home, T said, \"found it,\" linking the earlier problem to the implied solution.","Note: We’ve been reading Nellie Bly. Before reading today’s section, I showed students a list of problems and solutions. We matched the problems and solutions we already learned earlier in the book. Then we read to see if we could match more problems and solutions. S. found the solution for Nellie’s problem.","Work sample: A page shows two boxes labeled: “problem” and “what happened next?” After reading a short story, F. wrote, \"She late,” in the first box and “She run,\" in the second. He linked the characters' problem with the action taken."],"teks":["CMP_INF","LIT_PLOT"]},{"id":"C7h","text":"The student scores > 80% correct on a modified cloze (MAZE) assessment with new paragraph length texts.","ex":["Datasheet: The titles of 6 texts listed down the first column and dates across the tops. There some rows have one MAZE score – others have two or three. The scores for the final read on the last three texts are 11/13; 12/14; and 8/10.","Note: Monday MAZE assessment. Took a 1st grade oral reading fluency passage and turned it into a MAZE assessment using Intervention Central.","Note: This is working! The student reads the story with me, and we work through words as needed. Then he practices reading the story for homework. On Friday he does the MAZE. He got 9/11 (81%) again this week!","Work sample: A MAZE passage from AIMSweb at the first-grade level. Score of 81% circled on top."],"teks":["CMP_MON","FLU"]}]}]},{"title":"Print Knowledge","desc":"This scale supports tracking student progress as they work toward understanding the forms and functions of print in reading and writing. [Note: Throughout the scale, the word ‘text’ indicates printed words appearing in sentences and paragraphs.]","levelDescs":{"E1":"Communicators who are learning to use behaviors, gestures, and vocalizations to communicate intentionally with others and are working toward demonstrating interest in and attention to print during reading and writing interactions.","E2":"Intentional, early symbolic communicators who are attending to and engaging with text and working toward demonstrating an understanding of directionality (text is presented left-to-right, top-to-bottom) and the functions of print.","T3":"Symbolic communicators beginning to understand print/text concepts who are working toward demonstrating an understanding of environmental print and the distinction between letters and words in connected text.","T4":"Flexible symbolic communicators who are starting to read and write and demonstrate an understanding of the concept of a word, distinctions between letters, words, and sentences in text, as well as early punctuation and capitalization."},"placement":[{"n":1,"q":"Does the student write words and use spaces between words, capitalization, and punctuation when writing?","yes":"Consider using a different scale since student has developed print concepts.","no":"Go to the next question."},{"n":2,"q":"Does the student understand where to start reading on a page, distinguish between letters and words, and demonstrate an understanding of the word-by-word, left-to-right, top-to- bottom orientation of text?","yes":"Start with Level T4.","no":"Go to the next question."},{"n":3,"q":"Does the student distinguish between text and illustrations, recognize the front and back of a text, and understand there is a 1:1 correspondence between spoken and written words?","yes":"Start with Level T3.","no":"Go to the next question."},{"n":4,"q":"Does the student attend and engage during text-based interactions such as shared reading and writing?","yes":"Start with Level E2.","no":"Go to the next question."},{"n":5,"q":"Is the student still learning to attend to text during text-based interactions?","yes":"Start with Level E1.","no":"Start working on print knowledge and start with Level E1."}],"levels":[{"code":"E1","outcome":"The learner demonstrates a beginning interest in and awareness of print.","note":"","indicators":[{"id":"E1a","text":"Turns to look at and touch books that are being read to them.","ex":["Note: “The para was reading with K. today. She used the book we created with pull-off versions of some of the pictures velcroed on top of the images in the book. As the para turned the page, K. reached out to touch the page. K. moved his hand across the page until he found the pull- off. He could pull it off, and the para labeled it. The pull-offs are helping K interact more with books.”","Photo: D. and the SLP are seated next to each other. The SLP is holding up a book, and D. is looking at it. A note adds, “Ms. Jane read a book she made about D. He LOVED IT! He was so interested in all of the photos of himself that she included.”","Video: J. is in a bean bag chair with the other students in various positions around the teacher. The teacher is reading a book to the group. The book is facing out so the students can see the pictures. On each page, the teacher pauses after reading the page and briefly moves into each student’s view. Students are using natural speech and AAC devices to comment. J. mostly looks up toward the ceiling until the teacher moves right next to him, puts the book to the left of where he is looking, and reads directly to him. Then, J. turns his head, looks at the book, then looks at the teacher and back at the book while vocalizing."],"teks":["PR_BOOK","SSR"]},{"id":"E1b","text":"Attends to print when an adult points to or talks about it during familiar literacy routines.","ex":["Note: “O. was attentive today during predictable chart writing about Birthday Parties. O. selected the word, presents, to finish the sentence, ‘My favorite part is ….’ She watched and vocalized with excitement as I wrote and said each of the letters in the word, presents.”","Photo: Photo of a book page with an illustration on one side and text on the other. A note adds: “We read Orange Pear Apple Bear. I could really see B. looking at the text on the pages like this – text on one side. I had to point it out, but she looked where I was pointing.”","Video: The teacher is reading a book to her class. She draws attention to a word in the title that starts with the letter L. A girl who has been sitting in her wheelchair with her head down looks up at the book as the teacher spells the word and points to each letter."],"teks":["PR_WORD","PR_BOOK"]},{"id":"E1c","text":"Distinguishes between print and illustrations in familiar texts.","ex":["Note: “I asked T. to show me the words to read and the picture on a few pages today of a book we have read several times this week. He did it 4 times!”","Note: “The kids love looking for the hidden mouse in the pictures in Do You See a Mouse? V. is working on attending to words and pictures. Today, I asked her to ‘show me the picture’ on most pages. Then another student would find the mouse. She put her hand on the picture multiple times. She was doing so well that I asked to show me the words to read on the last page, and she did it!”","Video: The teacher reads the book The Cat Sat on the Mat to 5 students sitting at a table facing her. The teacher reminded the students they read this book earlier this week. After she reads the first page, she asks E. to show her where to start reading. E. points to the text – not the first word, but he points to the text. On another page, the teacher asks E to show her the elephant, and E points to the picture of the elephant.”"],"teks":["PR_WORD"]},{"id":"E1d","text":"Recognizes familiar books by their cover.","ex":["Note: “I had four books on the table before reading today. I spread them out and asked V. to find a favorite, Do You See a Mouse? She looked right at it.”","Note: “J. was having a hard time in his stander today. I asked if he wanted me to read with him. He seemed to perk up, so I grabbed a recent favorite, Dirty Bertie, and several other books. I asked, ‘Do you want to read Dirty Bertie?’ and held up two options. He looked right at Dirty Bertie and smiled.”","Photo: A student is hugging a book. A note adds, “F. picked his favorite book out of a basket full of books. He can recognize it anywhere.”"],"teks":["PR_BOOK"]},{"id":"E1e","text":"Recognizes when books are held upside down or orients them correctly when holding them.","ex":["Note: “During independent reading today, P. had a basket full of books. She picked up each one in the right orientation. She didn’t open any of them to look at the pages, but she turned each one in the right orientation before discarding it and selecting another.”","Video: An adult clips the front and back cover of a book to a slant board on a child’s wheelchair tray, but the book is upside down. She talks to the student saying, “I think you’ll love this book.” Then she turns and walks away. S. looks at the book and then at the adult’s back. S. then bangs the tray and vocalizes. The adult turns around and says, “Yes? Do you need me?” S. looks at the book and back at the adult twice. The adult comes over, looks at the book and says, “Oh, silly me! I did it upside down. Let me fix that.” A note adds, “Ms. K came up with this idea. We thought S. understood, but couldn’t figure out how to show it. This sure did work.”","Video: The teacher is sitting with M. The teacher holds the book upside down, shows it to M. She points to the title (which is upside down) and reads, Yo! Yes? Then she turns to the first page of the book to start reading, still holding it upside down. M. looks from the book to the teacher and back again a few times. The teacher smiles and says, “What? Is there a problem?” Then she acts surprised and says, “Oh, wait, I can’t read it like that! It is upside down isn’t it.”"],"teks":["PR_BOOK"]},{"id":"E1f","text":"Attends to print in the environment when pointed out by an adult.","ex":["Note: “We always check out the words on signs and bulletin boards on the way to PE. Today, I was so surprised to find that Ms. E. had a clipboard hanging from her bulletin board. It had the title in braille with some other words printed under it. I pulled Z. close and asked him to ‘hop on’ so we could read the words together. Z. put his hand on mine and stayed there as I read the word and said the letter names. I’m so glad Ms. E. is doing this for her students – we can do this with Z. every day!”","Photo: Picture shows a student pointing to the word, Math, on his visual schedule. A note is attached that reads, “I asked A to check his schedule today. He grabbed the picture card like he always does. I asked him to ‘show me where it says math.’ He pointed to the word printed on the schedule next to where the picture was hanging.”","Video: The class is moving down the hallway. The teacher is pointing to and talking about the words hanging on bulletin boards and doorways. The video zooms in on C. who is watching intently as the teacher points to the words on the bulletin board next to one classroom."],"teks":["PR_WORD"]},{"id":"E1g","text":"Actively uses writing tools (pens, pencils, keyboards, alternate pencils) when asked to write.","ex":["Photo: Picture shows student sitting at a computer touching a keyboard with big, colorful keys. The computer screen is filled with letters, numbers, and punctuation marks in large font. A note adds, “Today when I said it was time for writing, L. looked over at the classroom computer station. Before we moved to the computer, L. chose a topic and used his AAC device to tell us about it. Then we moved his wheelchair to the computer, gave him the Big Keys, and he went at it.”","Video: P. is seated in his wheelchair with his eye-gaze communication system mounted in front of him. P. selects a message that says, “I LOVE SETH CURRY. HE IS THE GOAT.” An adult sitting with him responds, “You can write about Seth. Use your keyboard and write about him.” P. then looks around the screen and dwells on the key labeled ABC. The screen changes to the keyboard and P. spends more than 3 minutes selecting letters.","Work Sample: A document with W.’s name, the date, and the letters FJIKILDDPOWCF. A note adds, “For the 3rd time this week, we brought out the alphabet eye gaze frame for W. to use for writing. He has to look at the groups of letters and then look another time to tell us which letter. It is not easy, but he loves watching us write the things he tells us to write. We’re not sure he really gets it yet, but he sure does stick with it.”"],"teks":["HW"]},{"id":"E1h","text":"Attends to letters when interacting with others during familiar literacy routines.","ex":["Note: “We have been focusing on learning letter names and sounds. G. has struggled, but today he was really engaged. Usually, he just focuses on the objects I gather as if they are fidget toys. Today, he paid attention to the letters. He picked up the foam letter. He was watching when I wrote the letter, and he hopped on when it came time for him to help write it. Then, he really seemed to be searching the keyboard to write the letter at the end.”","Note: “During predictable chart writing, I asked C. to help me find the letter C each time it appeared on the chart. She pointed to some other letters, but she pointed to C three times.”","Photo: A child is seated in an adapted chair with a big wooden tray filled with foam letters. Another child is pulled up to the tray in a standard chair. An adult is on the other side. Each child has a letter in their hands and the adult is holding up a letter. A note adds, “The kids used to just throw these letters around. Now, they really seem to be looking at the individual letters. Look, the letters are even oriented right in their hands.”"],"teks":["PR_LET","PR_WORD"]}]},{"code":"E2","outcome":"The learner demonstrates increasing awareness and knowledge of print.","note":"","indicators":[{"id":"E2a","text":"Distinguishes between the front and back of a book.","ex":["Note: “Every time we read now, I ask a student to show me the book's front or back. Today, C. took the book and showed me the front without hesitation!”","Photo: P. has a book propped up in front of her, with the front of the book facing the camera. A note adds, “P. wanted to read her favorite book. First, she selected it from three I offered. Then, when I handed it to her asking her to show me the front, she eagerly turned it the right way for me to start reading.","Video: The teacher is sitting with a group of five students. She holds up a book, intentionally presenting the spine to the students – not the front and back. She says, “When we read, we always start at the front and read to the back of the book.” As she talks, she shows the front and back. She then reinforces the concepts, front and back, by pointing to and naming the front and back of the classroom. Then she stands the book on the table with the spine facing J. She says, “J., show me the front of the book.” J. takes the book, turns it, and puts it face up on the table in front of him. She says, “That’s right. That is the front of the book. Look, there is the title, Chickens to the Rescue, and the author, John Himmelman.”"],"teks":["PR_BOOK"]},{"id":"E2b","text":"Distinguishes between print and illustrations in texts.","ex":["Photo: The picture shows an adult sitting next to a student, both looking at a book on the computer. A note adds, “Mr. L. read Fast, Faster, Fastest with Q. Q. loves NASCAR racing and was super attentive. Mr. L. knew about all of the cars. He asked Q., ‘What car should we talk about?’ Q. pointed to pictures of cars. Then Mr. L. would say, ‘Okay, let’s read what it says. Show me where to read.’ Each time, Q. would then point to the text.”","Photo: The picture shows a page with an image of a baseball diamond and typed words that read, I like baseball. A note is attached to the photo that explains, “This is the page D. made for our Predictable Chart book about our favorite sports. D. is a huge baseball fan and loves attending the Durham Bulls games with her family. I placed the words she had selected on the table and a choice of 3 photos. I asked her to use the text to write her sentence. I said that she could choose an illustration after that. She had no trouble following my directions.”","Video: The teacher reads a book to the class, with each page projected on the Smart Board. She tells students a word on the page that starts with their letter of the day, D. and asks if anyone can find it. A boy in a wheelchair begins to vocalize, smile, and hit the tray on his chair. The teacher tells him to come to the board and show her the word. A paraprofessional wheels the boy to the board, and he taps on the word dog. His teacher then asks if he sees a dog, and he excitedly taps on the dog in the illustration."],"teks":["PR_WORD"]},{"id":"E2c","text":"Looks at or points to the print in books or other text when asked to read.","ex":["Note: “N. was really into predictable chart writing which was great today. He wanted to help so I helped him hold the pointer. He can’t control it to point word-by-word, but I told him, ‘You point to the words, and we’ll read together.’ He’d move the pointer toward the words, then I helped him point word-by-word. He wanted to read it again and again.”","Note: “J. was early today. I asked her if she wanted to read the morning message. She looked at the chart where it is always displayed. I moved her over to the chart. I asked her to show me what to read. She looked right at the words on the chart.”","Video: The students are gathered around the interactive white board in the front of the room, reading a book that is projected on the screen. G. is in her standing frame, pulled up next to the white board. The teacher hands G. a pointer and says, “Can you help me read? Show me the words to read.” G. accurately points to the bottom of the screen where the words appear. As the teacher reads each page, she asks G. to help, and G. consistently points to the area of the screen with the print each time."],"teks":["PR_WORD","PR_BOOK"]},{"id":"E2d","text":"Indicates where to begin reading a text.","ex":["Note: “We were reading a book on the computer today. I changed the background so the book was black with red words. Then, I turned off the lights and used a flashlight to track the words while I read the first few pages. Then I gave the flashlight to D. He LOVED using the flashlight to show me where to start reading. We had to deal with some sillies, but that was okay. He showed me he knew where to start reading on three pages in a row.”","Photo: L. and a TA are sitting together on the love seat in the media center. The TA is holding a book and L. is looking intently at the upper left corner of the left page. A note adds, \"Mrs. T. is so good. Today she asked L. to show her where to start reading when she got to a new page. She knows not to do it on every page, but she did it three times and each time, L. looked right at the right place to get started.”","Video: The class is gathered around for morning meeting. The teacher says, “G. come help me read out the message.” G. all but skips up to her side. She hands him the pointer. He takes it, and the teacher says, “Show me where to start reading.” G. reaches up high and points to the start of the message and the teacher reads, “Dear Students…”"],"teks":["PR_BOOK"]},{"id":"E2e","text":"Indicates the direction in which to read (left to right).","ex":["Note: “N. loves predictable chart writing and his pointing was great today. He still can’t control the pointer to point word-by-word (if he even understands that), but today he clearly moved the pointer from left to right while I was reading each line of the chart.”","Note: “We were reading a book on the computer today. I changed the background so the book was black with red words. Then, I turned off the lights and used a flashlight to track the words while I read the first few pages. When it was C.’s turn, I gave her the flashlight and asked her to point to the words while I read. She didn’t get each word one-at-a-time, but she definitely got the left-to-right direction.”","Photo: Picture shows a sentence strip that reads, I like to swim, and a student’s hand placed at the beginning of the sentence. A note is attached that explains, “I gave kids their sentence strips for today's predictable chart writing lesson. Before I handed out the scissors, I asked the adults to have the kids point to the words while they read the sentences a few times. I read with T. She put her hand on the left end of the strip and then moved to the right while I read. She doesn’t get the 1:1 yet, but she gets the left-to-right.”"],"teks":["PR_BOOK"]},{"id":"E2f","text":"Demonstrates understanding of concept of word or 1:1 correspondence between spoken and written word.","ex":["Note: “T uses an infrared pointer mounted on a headband to point to text while we are reading. We move him in front of the whiteboard where we have text in large print with good spacing. Today, we gave him time to coordinate his body and get the pointer to the first word; then we read slowly and intentionally as he pointed to each word, one at a time.”","Photo: Four words from a sentence strip have been cut apart and placed back together in the right order. A note adds, “N. cut up her sentence – she needed some physical support to finish each cut, but she started each cut by putting her scissors between each word. Then, she put the sentence back together. As I read it with her, she pointed to each word.”","Video: The teacher is leaning over the wheelchair tray of a student where there is a sentence strip with the three-word sentence: I feel tired. The teacher tells the student, “Help me read. Where do we start?” The student moves his arm, straight arm, closed fist, and lands on the first word. The teacher reads the word and then pauses. Before the teacher says anything, the boy moves his hand to the next word. She reads it, and he moves his fist again to cover the last word."],"teks":["PR_WORD"]},{"id":"E2g","text":"Understands that print carries meaning.","ex":["Note: “I was writing in children’s notebooks at the end of the day. L. was sitting next to me. I showed her two blue notebooks and asked her, ‘How do I know this is your book?’ L. looked at the top right corner where I had printed her name.”","Photo: A picture of a project from art class. There is a piece of paper on the table in front of it with a string of letters printed on it. A note adds, “B. wanted to write about his art project. I think he remembered the art display from the big kids – each piece had a note that displayed a name for the project and the child’s name. When I asked B. about his writing, he tapped his chest (his sign for me) and pointed to the project. I think he wanted to make sure people knew that he made the project.”","Work Sample: A note from a child with a scribbled picture and some letter-like shapes. A note adds, “I asked B. what it said. He pointed to the letter-like shapes and told me something about ‘party thank you.’ I’m not sure what he was trying to write, but he clearly demonstrated that the letters he wrote carried the meaning rather than the picture he drew.”"],"teks":["PR_WORD"]},{"id":"E2h","text":"Independently attends to print in the environment.","ex":["Note: “We always talk about bulletin boards when we are walking down the hallway. Today, I gave T. a single message voice output switch. I told her she could use it to let us know when she saw words we could stop and talk about. When we got to Mrs. P’s classroom door, T. activated the switch, ‘Stop! There are some words.’ We stopped and I asked T. to show me where she saw the words. She looked at Mrs. P’s bulletin board. Then I pointed to the words, and we talked about them.”","Note: “P. got to school late today. I told her we’d check out the lunch menu when we got to the cafeteria since we didn’t get to put in her lunch order. I pushed P. down to the cafeteria and automatically jumped in the lunch line. P. started craning her head around to the left and vocalizing very loudly. I quickly realized that she was telling me that we needed to check out the menu that was hanging on the wall. She can’t read it, but she knew it was there and knew that we needed to read it to see what choices she had today.”","Photo: S. is in the hallway, standing in front of the door looking up at the EXIT sign. A note adds, “S. loves the EXIT sign. I don’t know why, but he loves to take off down hallways only to stop and look at the signs hanging above the doors.”"],"teks":["PR_WORD"]}]},{"code":"T3","outcome":"The learner applies knowledge of print concepts across reading and writing tasks.","note":"","indicators":[{"id":"T3a","text":"Indicates the first word on a page of text.","ex":["Note: “We were reading books together on the interactive white board. G. was in charge of turning the page. On a few pages, I asked him to ‘show me the first word on the page.’ He successfully pointed to the first word each time.”","Video: The video is a heat map of a page in a book gathered using Gaze Viewer software. The video shows that O. looked for an extended time at the first and last word in the sentence. A note adds, “We turned on Gaze Viewer while reading on E’s device. This clip shows a page where I asked E. to show me the first and last words. I could tell where she looked; this evidence is awesome!”","Video: A teacher is doing shared reading with three students gathered around a table. The teacher holds up the book and asks A., “Show me the first word to read.” A reaches up and touches the first word on the page on the left."],"teks":["PR_WORD"]},{"id":"T3b","text":"Indicates the last word on a page of text.","ex":["Note: “We were reading books together on the interactive whiteboard. G. was in charge of turning the page. On a few pages, I asked him to ‘show me the last word on the page.’ He successfully pointed to the last word each time.”","Video: The video is a heat map of a page in a book gathered using Gaze Viewer software. The video shows that O. looked for an extended time at the first and last word in the sentence. A note adds, “We turned on Gaze Viewer while reading on E’s device. This clip shows a page where I asked E. to show me the first and last words. I could tell where she looked; this evidence is awesome!”","Video: A teacher is doing shared reading with three students gathered around a table. The teacher holds up the book and asks A., “Show me the last word on this page.” A. reaches up and touches the last word on the page on the right."],"teks":["PR_WORD"]},{"id":"T3c","text":"Indicates the first letter in a word that appears in text.","ex":["Note: “We read Tough Boris today. Each time I read, ‘He was….” I’d read the sentence and ask J. to look at the last word. Then I’d ask her to tell the first letter in the last word. Since she can’t point at the text, she used the keyboard on her device to tell me the letter. Each time, she told me the first letter of the words.”","Video: The class reads a completed predictable chart about things they like to do at school. The teacher reads the title and the first sentence, using a pointer to point word-by-word as she reads. Then, she gives the pointer to G. and asks him to help her read the next sentence. G. points to each word. After, the teacher asks, “You said, ‘I like recess.’ Show me the word, ‘recess.’” G points to the word. Then the teacher asks, “Show me the first letter in recess.” G points to the first letter.","Work Sample: A picture on top and a 3-line text under it. Some words are circled and there are lines through some of them. A note adds, “I read this story with F. today. He pointed to the words while I read. Then, I asked him to circle the first and last word in each sentence. Then I pointed to some words and asked F. to show me the first letter. He got it!”"],"teks":["PR_WORD","PR_LET"]},{"id":"T3d","text":"Indicates the last letter in a word that appears in text.","ex":["Note: “After shared reading today, I turned to a random page and asked the students to show me different things. R. showed me the first and last word in several sentences and then showed me the first and last letter in a few longer words on the page.”","Video: The class is reading a completed predictable chart about things they like to do at school. The teacher reads the title and the first sentence. Then G. has a turn. Then the teacher asks H. to take a turn. During H.’s turn, the teacher asks him to point while she reads. Then she asks him to show her the first and last word of his sentence. Then she asks him to point to lunch at the end of his sentence. He points to lunch. Then, she asks him to show her the first and last letter. He gets them both.","Work Sample: A picture on top and a 3-line text under it. Some words are circled and there are lines through some of them. A note adds, “I read this story with F. today. He pointed to the words while I read. Then, I asked him to circle the first and last word in each sentence. Then I pointed to some words and asked F. to show me the last letter. He got it!”"],"teks":["PR_WORD","PR_LET"]},{"id":"T3e","text":"Distinguishes between upper-case (capital) and lowercase letters in text.","ex":["Note: “R. was helping me read our morning message. He pointed to ‘Dear Students’ as I read. I stopped and asked him to show me the upper-case D. He did. I read ‘Dear’ again. Then I asked him to point to the next word. He pointed to Students. I asked him to show me the lowercase d in students. He did.”","Note: “We were reading a book on the white board. After we read the book, we went back to read it again. This time, I asked the kids to take turns using the marker to show me different things in the text on some of the pages. D. circled the upper and lowercase letters I asked about on several pages. A few times I had to first get him to point to the target word. Then, once he was looking at the word that included the letter, he could find the letter.”","Work Sample: A page with a picture at the top and a short story at the bottom of the page. R. has circled several letters and underlined some words. A note adds, “R. and I read this together. After we read it, I asked him to underline the first and last words in some sentences. Then I asked him to circle some upper- and lower-case letters. He got them all. One time, I had to point to the word that had the target letter (lowercase t), but once I did that, he was successful.”"],"teks":["PR_LET"]},{"id":"T3f","text":"Identifies words in environmental print (signs, bulletin boards, labels, etc.).","ex":["Note: “Today I read, Pink is Not a Color. As I read the title, G. got really excited. She tried to leave the table. At first, we stopped her, but I realized she was trying to show us something so I told her to go. Turns out she was trying to show us that the word in the title, pink, was also on one of the large crayon pictures on the bulletin board by the door. She went over and pointed to the word pink on the crayon – she didn’t just point to the color – she pointed to the word.”","Note: “As we were walking to the Media Center today, R. got my attention at the bulletin board by Mrs. G’s room. He pointed to the word, cat and then approximated the sign for the word CAT.”","Photo: A student is holding up an apple juice drink box. A note adds, “Since it is fall, we have been reading and learning about apples: different kinds, how they grow, recipes to cook with them. R. showed me yesterday, that he had sliced apple in his lunch. Today, he got my attention and pointed to the word, apple. At first, I thought he might be pointing to the picture, but when I asked R. to show Mr. B. the word, apple, R. clearly pointed to the word not the picture. It is exciting to see him make those connections!”"],"teks":["PR_WORD","PH_HFW"]},{"id":"T3g","text":"Distinguishes between letters and words in text.","ex":["Video: The teacher is reading an alphabet book about sea turtles. The book page is projected on the interactive white board. There are several students gathered around. On the page that features F for Flippers, the teacher asks L. “Help me find the letter F. Where is the letter F?” Then the teacher uses partner assisted scanning to point to the letter F, the illustration, and then word-by-word through the text. L. selects the letter F and then also stops the teacher when she points to flippers in the text. The teacher says, “Do you see the letter F in this word?” L. indicates YES. The teacher then points to the word ‘life’ and says, “Can you show me the f in this word?” She points to each letter and L. selects the f.","Work Sample: A photocopy of a page from a storybook with some letters and words circled and underlined. A note adds, “After we read our book today, I gave the students copies of pages from the book and asked them to underline different words including the first and last words in the sentence, some upper and lowercase letters, and words we are learning to read. R. was very successful, even distinguishing between letters and words.”","Work Sample: A short story: The dog is big. The dog can run fast. That dog is funny. The teacher has added a note: “E. showed me the words the, dog, is, can. She also showed me the upper and lowercase T and then, she pointed to each of the letters in the word funny as I spelled it aloud.”"],"teks":["PR_WORD"]},{"id":"T3h","text":"Demonstrates understanding of return sweep when reading text with two or three lines.","ex":["Note: “During independent reading today, I sat with R. and asked him to read to me. I can’t really understand his speech, but he is vocalizing while he reads, pointing word-by-word and moving to the beginning of the next line when he finishes the first. I have got to do more to figure out what words R. is reading these days!”","Note: “I read with Q. today. As I read the words, she ran her finger under the text. Most pages have 1 line of text, and Q. ran her finger under each line as I read. On a few pages, there were two lines of text, and Q correctly moved to the beginning of the second line when I asked, ‘Where do I go next?’”","Video: There is a book projected on the interactive white board. One student is standing in front of the board pointing to words while the teacher reads aloud. Most pages have two lines of text, and the student moves to the beginning of the 2nd line each time he reaches the end of the first line."],"teks":["PR_BOOK"]}]},{"code":"T4","outcome":"The learner flexibly applies knowledge of print concepts across reading and writing tasks.","note":"","indicators":[{"id":"T4a","text":"Uses spaces between words when writing.","ex":["Note: “Sometimes T. uses the no tech eye gaze frame to write, and sometimes she uses the keyboard on her device with eye gaze, but she is just learning to control her device. Today, she wrote this with the device, ‘se dad.’ We think it says, “see Dad,” and those spaces she is adding sure help!”","Photo: The picture shows a piece of paper with the following letters: BBB EE IN PL SSSSS XXXXX ZZ A note adds, “S. wrote about swimming. She used her talker to say LIKE WATER IN. Then, she worked with Ms. D. using partner-assisted scanning and the flip chart to write. We aren’t 100% certain, but we see the word ‘in’ when we asked if PL was ‘pool,’ S. got very excited. She did include spaces between each word.”","Work Sample: Piece of paper with the following typed on it: tv lgo msrs. A note adds, “M. decided to write about one of his favorite TV shows, Lego Masters. I would not have known that msrs is his effort to spell masters if we didn’t get him to choose the topic first, and he put spaces between the three words.”"],"teks":["HW"]},{"id":"T4b","text":"Capitalizes the first word in a sentence during shared or independent writing.","ex":["Note: “We wrote a new chart today. I asked N. to help me write the sentences. Each time, he reminded me to start the sentences with an uppercase ‘big’ letter.”","Video: The class is creating a chart about their favorite desserts. L. uses her device to say “CAKE” to finish her sentence. The teacher says, “Okay, I like cake. I need to start with I. What do I need to do?” L. uses her device to say “UP”. The teacher says, “Yes! I need an upper-case I.”","Work Sample: A printout of the message R. wrote on the computer. It says, Der Dad. I wt go fis Get wmz Get pop Go bot. A note adds, “R. wrote this. It says, ‘Dear Dad, I want to go fishing. Get worms. Get pop. Go in boat.’ He kept looking at my morning message. I think it helped him. He doesn’t have periods yet, but he has a good sense of the beginning of a sentence and uses an uppercase letter at the beginning of each sentence.”"],"teks":["WR_CAP"]},{"id":"T4c","text":"Identifies the period (.) in text or adds a period to the end of the sentence during shared or independent writing.","ex":["Note: “We wrote a new chart today. I asked N. to help me write the sentences. Each time, he reminded me to put a period at the end of the sentence.”","Note: “In class, we are working on stating an opinion about a book. When we finish a book, I ask the students to use a whole sentence to tell me if the book is good or bad. I write the sentences on a chart like predictable chart writing with the book's title as the chart's title. Today, L. reminded me to start each sentence with an uppercase letter by telling me “UP.” Then, she reminded me to use a period at the end by telling me “FINISHED” each time I got to the end of the sentence. She is so good at using the words she has to communicate different ideas.”","Work Sample: A single page with a picture at the top and three sentences under it. G. has circled and underlined different things. A note adds, “After we read this together, I asked G. to show me different words and letters. I also asked him to find the periods. He circled each one.”"],"teks":["WR_CAP"]},{"id":"T4d","text":"Identifies a question mark (?) in text or adds a question mark to the end of the sentence during shared or independent writing.","ex":["Note: “We are working on asking questions, especially with the kids who have talkers. Today, we made a list of questions we could ask the pigeon in Pigeon Needs a Bath. I asked the kids to give me a question word, then I made a question using the word. After the 2nd question, M. reminded me to use a question mark at the end of every sentence. She did it by selecting the question mark on the keyboard page of her talker.”","Note: “We read No David again today. After we finished, I turned back to the pages that include questions. I used partner assisted scanning to get L to show me where there were periods and question marks. She got them all.”","Work Sample: A single page with a picture at the top. Three sentences and one question are written in the text below it. G. has circled and underlined different things. A note adds, “After we read this together, I asked G. to show me different words and letters. I also asked him to find the periods and the question marks. He circled each one.”"],"teks":["WR_CAP"]},{"id":"T4e","text":"Identifies the beginning, middle, and end of a book","ex":["Note: “At the end of shared reading, I asked G. to show me the beginning of the book. He picked up the book and turned the cover toward me. Then I asked him to show me the end and he turned the book to show me the back. Finally, I asked him to show me the middle. He opened the book and turned a page that was basically in the middle of the text.”","Note: “We’ve been working on sequencing events – talking about things that happen first, next and last. Today, I was contrasting that with the actual beginning, middle, and end of the book. I told the kids we were going to read the beginning and stop in the middle. Then we read the end. After, I asked R. to show me the beginning, he turned to the first page of the story. I asked him to find the middle and he turned several pages and stopped. Then I asked him to show me the end and he closed the book.”","Note: “Yesterday we had to stop reading in the middle of the book because we ran out of time. Today, I told the kids that we had to start in the middle where we left off. I asked G. to show me the middle – he turned to a page near the page where we finished yesterday – in the middle of the book. After we finished, I asked him to show me the beginning, middle, and end. He got all three.”"],"teks":["PR_BOOK"]},{"id":"T4f","text":"Recognizes that changes in the font shape/size provide information (e.g., ALL CAPS can represent shouting; wavy words can represent movement of some kind).","ex":["Note: “We were reading Don’t Let the Pigeon Drive the Bus. We got to the page that says, LET ME DRIVE THE BUS! I have been cupping my hands around my mouth while ‘shouting’ the words. Today, I didn’t do it. T. stopped me by vocalizing loudly. Then he brought his hand up to his mouth before vocalizing more. We all knew immediately that he knew I was supposed to ‘shout’ those words.”","Note: “We were reading The Most Magnificent Thing. It uses all caps, bold words for emphasis – especially when the girl is frustrated. When we were reading today, W. pointed to the words- scrunched her face, making an expression like she was mad. We hadn’t talked about these words in this book, but there is an illustration with a grayed-out speech bubble like the one in Don’t Let the Pigeon Drive the Bus with all caps, bold words – We had talked about showing how mad and frustrated the pigeon was. I thought maybe W. made that connection. When I asked her, she indicated YES. I asked her to tell me more, and she used her talker to say, MAD.”","Note: “G. had to go to the bathroom during lunch today. After helping him wash his hands, I noticed a sign on the wall listing six steps to wash your hands. Across the top, in all caps, it said, WASH YOUR HANDS. I asked G. to show me the part of the sign that was most important. He pointed to those words written in upper case, and I read them to him, confirming that those big, bold words are the most important. I think he is getting that authors use different kinds of font on purpose.”"],"teks":["PR_WORD"]},{"id":"T4g","text":"Demonstrates understanding of return sweep when reading text with four or more lines.","ex":["Note: “N. is always eager to lead the group in reading the charts we write. She takes the pointer, points word-by-word, and then makes the return sweep to start the next line – through the entire chart.”","Note: “Today we read Ruby Finds a Worry again. I didn’t ask her to point throughout the book, but when I asked R. to help me read by pointing to the words on some pages, she pointed word-by-word and made the return sweep perfectly.”","Video: The teacher calls on Q. to come to the front of the class and lead them in reading the morning message. She gives Q. the pointer. He starts at the top and points to each word as the teacher reads it, and at the end of the line, he drops down to point to the beginning of the next line. He does this as the teacher reads the entire message."],"teks":["PR_BOOK"]},{"id":"T4h","text":"Distinguishes between letters, words, and sentences in text.","ex":["Assessment: A recording form from an assessment of concepts about print. Listed down the first column are a range of print concepts including: orients the book, first word, left-to- right, 1:1, return sweep, word, letter, sentence. There are + signs recorded next to each item. A note adds, “We did the concepts about print assessment today and G. got every item!”","Note: “I was reading with D. today. After we read and commented about the book, we went back to the beginning, and I asked him to show me some sentences – we talked about sentences ending with a period. I also asked him to show me some words I know he is learning to read and some letters – he can’t read many words yet, but he gets the difference between a letter, a word, and a sentence.”","Photo: A.’s sentence from predictable chart
