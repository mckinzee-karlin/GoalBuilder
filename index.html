<script type="application/json" id="appdata">{"vc":[{"title":"Expressive Communication","desc":"This scale supports tracking student progress as they work toward using language to communicate flexibly on various topics and purposes with adults and peers.","levelDescs":{"E1":"Communicators who are learning to use behaviors, gestures, and vocalizations to communicate intentionally with others and are working toward demonstrating beginning engagement with and attention to language-driven interactions.","E2":"Intentional, early symbolic communicators who are beginning to attend and engage while working toward demonstrating understanding during familiar language-driven routines.","T3":"Symbolic communicators beginning to understand early literacy who are working toward demonstrating an understanding of text during familiar shared reading routines.","T4":"Flexible symbolic communicators who are starting to read and write and working to demonstrate understanding when reading or listening.","C5-7":"Conventional communicators, readers, and writers working on reading text used during instruction with fluency and comprehension."},"placement":[{"n":1,"q":"Does the student use spoken words, signs, or symbols to initiate, respond, and engage in multiple turn exchanges during shared reading or other academic routines?","yes":"Start with Level T4.","no":"Go to the next question."},{"n":2,"q":"Does the student use spoken words, signs, or symbols to initiate and respond with familiar texts and the reader for brief periods during shared reading or other academic routines?","yes":"Start with Level T3.","no":"Go to the next question."},{"n":3,"q":"Does the student respond using single spoken words, signs, or symbols when communicating with others during shared reading or other academic routines?","yes":"Start with Level E2.","no":"Go to the next question."},{"n":4,"q":"Is the student still learning to communicate intentionally and symbolically?","yes":"Start with Level E1.","no":"Start working on communication and start with Level E1."}],"levels":[{"code":"E1","outcome":"When interacting with peers or adults in academic contexts, the learner uses behaviors, gestures, or vocalizations to communicate intentionally.","note":"E1a and E1b focus on behaviors, vocalizations, and students' facial expressions without communicative intent. Adults can assign meaning to them, but the student does not realize that the behaviors can control or communicate with another person. Indicators E1c, E1d, E1e, E1f, E1g, and E1h require students to demonstrate intentional communication behaviors, vocalizations, and facial expressions. This means the student intentionally tries to control or communicate with another person.","indicators":[{"id":"E1a","text":"Uses behaviors, vocalizations, and facial expressions that others can interpret as having communicative meaning.","ex":["Note: “While getting out photos to be used for independent writing, M. vocalized when he saw the photo of himself during our science experiment. I think he recognized himself!”","Photo: Student is smiling and reaching toward an alternate pencil that a teacher is offering. A note adds, “I think she wants this!”","Photo: There is a student with a wide grin. A note adds, “J. was so happy each time the spider walked across our bug book during shared reading. Look at that smile!”","Video: Student pushes away book and then uses feet to push the chair away from the table. A note adds, “Tried shared reading with M. using Trains, Trains, Trains. Pretty clear that she was finished for today!”"],"teks":["OL_SHARE","OL_SOC"]},{"id":"E1b","text":"Uses behaviors, vocalizations or facial expressions to indicate preferences in a way that others can interpret as having meaning.","ex":["Note: “During independent reading, I held up three books. N. looked at and then touched one of the books. I think he wanted to read it, so we did!”","Note: “Predictable chart today I want to go (FAST or SLOW). After asking T. ‘Do you want sloooooow?’ No response from T. ‘Do you want fast?’, T. started kicking and moving his arms quickly while vocalizing. Fast is way more his speed!”","Video: Student reaches for one of two books held up by the teacher. A note adds, “A true favorite! R. reached for Dirty Bertie before I even finished reading the title!”"],"teks":["OL_SHARE","OL_SOC"]},{"id":"E1c","text":"Uses movements and unconventional gestures to intentionally communicate with others.","ex":["Note: “During a repeated shared reading this morning, T. reached for the book and flipped pages forward to find his favorite picture of the dog. He patted it, and looked at me. He loves that Bulldog!”","Photo: Student is laughing with arms extended out. A note adds, “We read a book about a boy who let go of his balloon. F. loved when I said ‘up, up, up’, while pointing up. She giggled and moved both arms up twice after I did it.”","Video: The teacher offers S., who is on the ground, the choice to do independent reading in the quiet corner or his wheelchair. S. scoots on the carpet towards the bean bag in the corner. After getting there, he looks back and smiles. A note adds, “S. knows how to show us where he likes to read!”"],"teks":["OL_SHARE","OL_SOC"]},{"id":"E1d","text":"Uses vocalizations to intentionally communicate with others.","ex":["Datasheet: A tally of the number of times each day that O. used his voice to get the attention of an adult or peer.","Note: “During science, I held an ice cube out for the students to touch. V. vocalized (a bit irritated) after touching it. When I offered him another chance later on, he vocalized again to let me know he was NOT interested in touching it again!”","Note: “While reading about dinosaurs, I surprised D. when I took a dino from my lap and put it in front of him on the table. He squealed with delight. I made the dino roar and then D. vocalized to indicate more. We did that three more times!"],"teks":["OL_SHARE","OL_SOC"]},{"id":"E1e","text":"Use facial expressions to intentionally communicate with others.","ex":["Note: “Reading about South America. Brought in a bag of coffee beans for students to smell. R. crinkled up his nose in disgust. Later I asked him if he wanted to smell it again, and he crinkled his nose while looking at me. Too funny!”","Photo: M. and two peers with big smiles. A note adds, “Their response to me asking what they thought of the book. I guess we’ll be putting that one on the favorite shelf!”","Video: After the teacher pulls an airplane out of a bag, it flies past the student as she counts it. A note adds, “M. smiled at me and looked at the bag to ask me to take out another airplane to count after each one finished flying.”"],"teks":["OL_SHARE"]},{"id":"E1f","text":"Intentionally indicates preferences using facial expressions, body movement, or vocalizations.","ex":["Photo: M. reaching for scarf in basket of winter clothes. A note adds, “Had these for predictable chart writing. M. went right for the red scarf.”","Note: “Making a graph of favorite pizza toppings. I held up pictures of pepperoni and sausage in front of D. D. looked at the pepperoni, and then lifted her head towards it.”","Video: Student yells when offered first book, then reaches when offered a second book. A note adds, “S. yelled to let us know the amphibian book was not cool. Clearly the train book was better! (he reached).”"],"teks":["OL_SHARE"]},{"id":"E1g","text":"Makes choices regarding personal preferences from arrays of 2 or 3 familiar objects.","ex":["Datasheet: Records the books offered each day. If the student selects a book by looking or reaching, the preferred book is circled. When no choice is made, a check mark is placed next to the book that is selected by the adult.","Note: “Held up three soft items for predictable chart writing, I feel a soft .F immediately smiled and reached for the feather. Not surprised! Earlier he giggled when I blew it off my hand.”","Photo: Student is touching one of three photos. A note adds, “Set out pics of possible topics for independent writing. M. immediately grabbed photo from our field trip.”"],"teks":["OL_SHARE"]},{"id":"E1h","text":"Indicates yes OR no via facial expression, body movement, vocalizations, or other means.","ex":["Note: “Today when I asked M. if they wanted to pick book to read, they smiled and galloped over to the reading shelf.”","Note: “Asked B if he wanted me to use purple marker for chart writing. He pushed it away. I picked up the big fat red marker and asked again. He reached for it and smiled.”","Photo: Two students seated at table. A note adds, “Getting ready for shared reading. Three empty chairs at the table. I asked M. if he wanted to sit near F. M. immediately went to sit next to his best bud. He really missed him when he was absent.”"],"teks":["OL_LISTEN","OL_SHARE"]}]},{"code":"E2","outcome":"When interacting with peers or adults in academic contexts, the learner uses concrete and abstract words, signs, or symbols to initiate and respond.","note":"","indicators":[{"id":"E2a","text":"Uses single words, signs, or symbols to request or obtain desired objects, actions, or people in academic contexts.","ex":["Note: “During today’s shared reading lesson, K. signed ‘more’ when I announced that we were going to move to the next activity. He wanted me to keep reading!”","Photo: MM.’s AAC device is on a page with the symbol for “PENCIL”. A note adds, “We were getting ready for writing. I got to the right page on MM.’s talker. I asked what she needed. She pointed to ‘PENCIL’.”","Video: The teacher stands next to a predictable chart with a pointer. She asks, “Who is next?” N. points to his chest and rocks back and forth."],"teks":["OL_SHARE","OL_SOC"]},{"id":"E2b","text":"Uses single words, signs, or symbols to refuse objects, actions, or people in academic contexts.","ex":["Note: “During today’s Math lesson, L. refused to select the next color in the pattern we were creating by signing ‘no’.”","Note: “Used partner assisted scanning to give E. choices for writing. E. indicated, ‘no’ to the first 3 topics that were offered. He finally chose to write about the movie he saw last weekend.”","Video: Predictable chart writing “Be the Sentence” activity. The teacher asks P. to stay seated while her classmates work to be the sentence. P. keeps selecting “NOT” on her AAC device. The teacher says, “You do NOT want to stay seated. You want to get up and be part of the sentence."],"teks":["OL_SHARE","OL_SOC"]},{"id":"E2c","text":"Uses single words, signs, or symbols to name familiar objects, actions, or people in academic contexts.","ex":["Note: “After T. read our predictable chart – pointed to the words. I asked T. to choose a peer to go next. He looked at Samir, and said his version of Samir’s name.”","Photo: P.’s All About Me bulletin board. A note adds, “We were reading, My Pets. I asked, ‘Do you have a pet?’ P. looked over at the All About Me display on the bulletin board. There was a symbol of a dog representing her dog, Chips.”","Video: Students are at the group table. The teacher sits down and then pulls a book out of a basket on the floor. J uses his communication device to say, “READ”."],"teks":["OL_SHARE","VOC_WORDS"]},{"id":"E2d","text":"Uses single words, signs, or symbols to comment during academic routines.","ex":["Data Sheet: Tally marks noting the noting the number of comments R. made using signs during each shared reading lesson for one week.","Video: Video of M. sharing his writing. After M. shared it with the class, K. used her communication device to say, “LIKE.”","Work Sample: Independent writing sample with a note stapled to it which reads, “When I collected V.’s writing, she navigated on her voice output device and said, ‘GOOD’.”"],"teks":["OL_SHARE"]},{"id":"E2e","text":"Indicates preferences using words, signs, or symbols in arrays with three or more choices in academic contexts.","ex":["Note: “During today’s writing lesson, L. looked at a list our class had generated for writing topics and said, ‘game’. She decided to write about the basketball game UNC won last night.”","Photo: N. is holding up the book she wants to read during self-directed reading. A note is attached to the photo that reads, “When looking through the basket of available books for independent reading, N. pulled out her choice and used the symbol on her communication device to say, ‘THAT’.”","Video: Predictable chart writing lesson showing C. pointing to one of 8 symbols offered indicating her choice to complete her sentence stem."],"teks":["OL_SHARE"]},{"id":"E2f","text":"Responds to direct requests using single words, signs, or symbols during academic routines.","ex":["Note: “When we created our Predictable Chart about favorite pets. I told R. to make a choice and showed him the choice board with pictures of pets. He pointed to ‘DOG.’ When I said, “You love dogs” R got very excited.”","Photo: P is sitting in a bean bag chair reading. A note adds, “When told to choose a book for reading, P. used her communication device to say ‘OK.’ She immediately went to the classroom bookshelf and found The Pigeon Has to Go to School. She loves the Pigeon books!”","Work Sample: A copy of J’s independent writing. A note adds, J signed “party” when asked what he wanted to write about today."],"teks":["OL_DIR","OL_LISTEN"]},{"id":"E2g","text":"Responds to yes/no questions using conventional gestures (head nod/shake), words, signs, or symbols in academic contexts.","ex":["Note: “While reading Don’t Bring Your Dragon to the Library, I asked Q,. ‘Does the dragon have a big behind?’ Q. laughed, smiled and then looked up and down – his head nod.”","Photo: N. is sitting in a rocking chair reading a book made from printed pages stapled together. A note adds, “N. shook her head to refuse 4 other books. Finally, we offered the book we made from our predictable chart last week. She took it and has been happily reading for 6 minutes.”","Video: The teacher is reading aloud, Don’t Bring Your Dragon to the Library. She pauses to ask, “Did the librarian let the dragon go in?” and models on an AAC device, “GO IN.” MM. clearly says, “nah”."],"teks":["OL_LISTEN"]},{"id":"E2h","text":"Takes two or more turns using words, signs, or symbols when communicating with another person in academic contexts.","ex":["Datasheet: SLP provided a data sheet tracking the number of consecutive communication turns T. took during their last 5 shared readings. Data indicated that T. took 2 or more communication turns at least once in the past 5 shared readings.","Note: “During shared reading, when I asked P. to tell me about the page, she selected the communication symbol, ‘LOOK’. When I brought the book closer to her, she selected the communication symbol, ‘GO’ and then pointed to the illustration of the car driving down the road.”","Video: The teacher finishes the last page of the book. She puts it down and says to S., “tell me about your favorite part.” S. signs “party.” The teacher says, “Have you been to a party?” S. replies with a vocal, “yah” as she gets excited. The teacher adds, “I liked the clown at the party. Did you like the clown?” S. replies again with a vocal, “yah” and continues moving and vocalizing with excitement."],"teks":["OL_DISC","OL_SOC"]}]},{"code":"T3","outcome":"When interacting with peers or adults in academic contexts, the learner combines 3 or more words, signs, or symbols to initiate and respond.","note":"","indicators":[{"id":"T3a","text":"Uses single words, signs, or symbols to connect personal experiences about academic content.","ex":["Note: “We read a book called Dogs Are Great during shared reading. When we got to a page showing two dogs running on a beach, B. excitedly said, ‘mine!’ When I asked if she had a dog, I thought she said, ‘Taffy,’ which I later found out is the name of her dog.”","Photo: R. is touching an illustration of mashed potatoes in a book about Thanksgiving. A note adds, “R. seemed really interested in the mashed potatoes. I asked, “Do you like mashed potatoes?” R. answered by looking up then down. I then added, ‘Who makes the best mashed potatoes?’ She said, ‘Aggie’ (her word for Dad).”","Video: There is a predictable chart about favorite sports. The teacher holds up a choice board with 6 symbols representing different sports. H. chooses basketball to complete his sentence. Then begins vocalizing and rocking back and forth in his chair. The teacher says, “You LOVE basketball.” H. selects several buttons on his AAC device. Finally, he says, “THE LAKERS ARE LIT!” A note adds, “We had no idea H. knew how to get to the All About Me page on his device.”"],"teks":["OL_SHARE","RESP_CONN"]},{"id":"T3b","text":"Combines two or more words, signs, or symbols to ask simple questions about academic content.","ex":["Data Sheet: Books are listed in the first column. Dates are listed at the top. Tally marks indicate that V. asked questions with two or more words 3 times during shared reading last week.","Note: “Next week, we are going on a field trip to the aquarium. We’ve been talking about it every day. Today, I read a book about the aquarium. L. interrupted me, using his AAC device to ask, “WHEN GO?”.","Video: The teacher is talking about the vocabulary word, hover. S. uses her AAC device to ask, “WHAT THAT?”"],"teks":["OL_LISTEN"]},{"id":"T3c","text":"Responds to direct requests about academic content by combining three or more words, signs, or symbols.","ex":["Note: “During shared reading with Ish, I asked C. to tell me what happened on the page. He used his communication device to say, ‘HE DO IT’ and pointed to the drawing on the page.”","Photo: Shows a chart the class made about student characteristics. A note adds, “I asked students to describe each other. K. looked at T. and used her AAC device to say, ’GOOD LIKE FUN.’”","Work Sample: Copy of J.’s independent writing about the Valentine’s Day dance. A note adds, “Before writing, we talked about the dance. J. used her talker to say, ’I WANT GO,’ ‘LIKE MUSIC DANCE GOOD’ and ’GOOD TIME GO’.”"],"teks":["OL_DIR","OL_LISTEN"]},{"id":"T3d","text":"Responds to direct questions about academic content by combining three or more words, signs, or symbols.","ex":["Datasheet: SLP provides a datasheet listing K.’s responses to CROWD, Wh questions during shared reading. Three responses are circled because they were made up of 3 words.","Note: The teacher wrote down what J. said with her communication device when asked to describe the vocabulary words, grow I “IT GOT BIG”, shrink -”MAKE IT LITTLE”, and stay - “DO NOT GO”.","Video: The teacher is reading Enemy Pie. She stops and says, “Tell me what Jeremy did.” P. uses his communication device to respond, ‘GET HIM OUT.’"],"teks":["OL_LISTEN"]},{"id":"T3e","text":"Combines three or more words, signs, or symbols to make comments or direct another person’s attention in academic contexts.","ex":["Note: “After today’s read aloud of Shel Silverstein poems, G. raised her hand and said, ‘I WANT MORE!’”","Photo: Photo of DD. smiling and pointing to the picture she created in history class. The note says that DD. used her communication device to say, “I DO THAT.”","Video: During a group reading activity, students can be seen demonstrating comprehension by manipulating a frog hand-puppet. The student, who has not received a turn, looks interestedly at the puppet before signing, “I want turn”."],"teks":["OL_SHARE"]},{"id":"T3f","text":"Combines three or more words, signs, or symbols in interactions with another person lasting two or more turns across academic contexts.","ex":["Note: “Today during reading, BB. asked to read the book we read last week, using his AAC to request ‘READ MORE COOKIE ?’. When I responded that we had returned that book to the library he requested, ‘GO GET IT’.”","Photo: A group of students gathered around a teacher who is holding up the book, The Dot. A note adds, “After today’s read aloud, L used her communication device to say, ‘LIKE ME READ.’ I told her it would be a choice during reading time. She said, ‘I GET IT’.”","Video: The teacher finishes writing the first sentence on the predictable chart. She turns to the group and N. says, “I go first.” The teacher replies, “Actually, D. asked to go first today.” N. repeats, “I go first.” The teacher adds, “You will have a turn. D. first.” N. does not look happy but replies, “Okay.”"],"teks":["OL_DISC"]},{"id":"T3g","text":"Combines three or more words, signs, or symbols to connect personal experiences to academic content.","ex":["Note: “H. chose a book about soccer and used his communication device to tell me, ‘I DO IT. I PLAY. MAKE GOAL.’ Apparently, he’s the best player on his power wheelchair soccer team.”","Video: The teacher is doing shared reading with Sheep in a Jeep. M. used her device to say, “I HAVE IT.” The teacher asked, “Sheep or a jeep?” M. selects several buttons on the communication device and says, “JEEP.” The teacher says, “You have a jeep?” M. gets excited and adds, “RIDE FAST.”","Work Sample: A pre-writing graphic organizer filled with thoughts about T.’s favorite animal, cats. Cats are funny, pretty, and soft. In the corner is a student-drawn picture of a cat with distinctive markings on the face and tail. A note adds: “When I asked T. about this drawing, he told me, “’My cat, Toby’”."],"teks":["OL_SHARE","RESP_CONN"]},{"id":"T3h","text":"Combines three or more words, signs, or symbols to make comments that relate to things peers or adults are saying or doing about academic content.","ex":["Note: “After one student shared his writing with the class, E. used his communication device to say, ‘YOU DO THAT GOOD’.”","Photo: Five students are holding word cards during the “Be the Sentence” activity of Predictable Chart Writing. A note adds, “When the students lined up in the wrong order, M. shouted out, ‘It not right’.”","Video: While reading a book about the zoo, the teacher pauses to comment, “I love going to the zoo!”, F replies shaking her head and, signing “It smell bad”."],"teks":["OL_DISC","OL_SHARE"]}]},{"code":"T4","outcome":"When interacting with peers or adults in academic contexts, the learner uses language flexibly to initiate, respond, and interact.","note":"","indicators":[{"id":"T4a","text":"Connects three or more words, signs, or symbols according to grammatical rules to relate personal experiences to academic content.","ex":["Note: :A. was flipping through classroom pictures while brainstorming writing topics. She paused on the picture from when I knocked the math counters on the floor. She used her AAC device to say, ‘DOWN LIKE DOG.’ I paused and remembered we had re-read Pig the Pug earlier. ‘Yes, they did go down like Pug!’”","Note: During chart writing, S. picked a picture of flowers to complete, I can grow . She used her AAC device to say, “MOM LIKES THAT.”","Video: Small group reading a book about what to expect at the dentist. The teacher asks, “Who goes to the dentist?” M. immediately goes to her AAC device to say, “I GO TOMORROW.”"],"teks":["OL_SHARE","RESP_CONN"]},{"id":"T4b","text":"Connects three or more words, signs, or symbols according to grammatical rules to ask questions about academic content.","ex":["Note: “We were grouping animals by different habitats. M. has a gerbil named Max. He used his AAC device to ask, ‘WHERE MAX LIVE?’ He was asking about Max’s habitat.”","Note: “M. was reading a book about sharks. When I walked by, he was on a page where it looked like the shark was ready to eat a dolphin. He used his AAC device to say, ‘HE EAT IT’. Then he made a questioning expression and pointed to the dolphin.”","Photo: Picture of the student pointing to the word ‘gazpacho’ in the title of the book Grandma’s Gazpacho. A note adds, “As soon as I pulled this book out of my bag, N. found a word they didn’t recognize. N. used their AAC device to ask me, ‘WHAT IS GAZP?’”"],"teks":["OL_LISTEN"]},{"id":"T4c","text":"Connects three or more words, signs, or symbols according to grammatical rules to respond to direct requests for information.","ex":["Datasheet: Across the top, it says, Three symbols/words to information requests. Dates are listed down the side, and things A. has said are listed next to each date. It shows several days with one or more requests recorded.","Photo: R. is smiling, pointing at a picture of a group in a museum. A note adds, “I told R. to ‘Tell me your writing idea.’ She stopped flipping through the photos and used her device to say, ‘GO LOOK GOOD FUN.’ Then she pointed to the picture of our field trip to the museum and smiled.”","Video: Video of a small group talking about rules at school. A note adds, “I said, ‘D. tell me one rule we have at school.’ D. used his AAC device to say, ‘WALK NOT RUN’ (in the hallway).”"],"teks":["OL_DIR","OL_LISTEN"]},{"id":"T4d","text":"Connects three or more words, signs, or symbols according to grammatical rules to respond to questions.","ex":["Datasheet: Across the top it says, Ideas for writing. Five questions to ask after B. selects a topic are listed down the first column. Dates are listed across the top and B.’s answers to each question are recorded. The data shows responses of 3 or more words in grammatical order as responses to questions on many days.","Note. “I held up a copy of The True Story of the Three Little Pigs. I asked, ‘What happened to the wolf?’ A. used his AAC device to say, ‘GO TO POLICE’.”","Photo: Screenshot of AAC device. A note adds, “During making words F. added a letter to us to make the word bus. I asked M. why he wasn’t taking the bus today. He used his device to say, ‘GO TO DOCTOR’.”"],"teks":["OL_LISTEN"]},{"id":"T4e","text":"Connects three or more words, signs, or symbols according to grammatical rules to make comments.","ex":["Datasheet: A Three or More Words to Comment sheet lists book titles in the first column and dates across the top, numbers 1, 2, 3, and 4 represent the number of words in the comments G. makes during shared reading. There are 3’s and 4’s on several days.","Note: “During shared reading of The Koala Who Could, L. used her device to say ‘HE IS WORRIED’ (when Kevin’s tree was about to fall).”","Photo: Screen capture of AAC device with the sequence I LIKE CHOCOLATE. A note adds, “During our cereal pre-writing brainstorm I approached R. with a box of Fruity Pebbles. This is what they had to say about that! LOL”"],"teks":["OL_SHARE"]},{"id":"T4f","text":"Connects three or more words, signs, or symbols according to grammatical rules to direct another person’s attention.","ex":["Note: “I could tell M. was particularly inspired during writing this morning. Before any other student had finished, M. approached me with their AAC device and said, ‘READ IT TO ME.’ It was about their family’s upcoming trip to the water park!”","Photo: Two students smiling holding up books about turtles. A note adds, “M. vocalized to get my attention. His AAC device message window said, ‘WE LIKE TURTLES!’\"","Video: Student gets teacher’s attention to show word he spelled. A note adds, “While I was reading Pigeon Needs a Bath to another group, L. was doing a making words activity with the paraprofessional. He was excited to tell me, ‘I spelled bath.’ Then he pointed to each letter saying, B-A-T-H!”"],"teks":["OL_SHARE"]},{"id":"T4g","text":"Connects two or more words, signs, or symbols according to grammatical rules to interact with another person across three or more turns.","ex":["Note: “During shared reading we read Being Nice at Dinner, R. commented ‘Not good’ (after reading page about Helen throwing food and dishes). I replied, ‘Throwing dishes is not good.’ R. added, ‘Throwing food is not good.’ I continued, ‘What a mess!’ R. added, ‘Time to clean up.’”","Video: Small group doing predictable chart writing. A note adds, “Sentence stem was Dogs like to . D picked a picture of a dog eating and used his AAC device to say, ‘EAT FOOD.’ I replied, ‘Does your dog like to eat food?’ He shook his head and said, ‘PEOPLE FOOD.’ I replied, ‘Oh, he doesn’t like dog food, huh?’ He shook his head again and said, ‘HE EAT CHICKEN.’”","Work Sample: Student-drawn picture of themselves twirling like a tornado. A note adds, “Told class gym was cancelled because of a leaky pipe. J. looked really upset and asked me, ‘Can I draw?’. I replied, ‘Of course!’ and quickly grabbed some paper and crayons. They produced this drawing and told me, ‘I want to move!’. I asked, ‘Hmm… where else can we move besides the gym?’, to which they responded, ‘Can I go outside?’. ‘Great thinking!’ I replied, and the whole class went to the playground instead. J. saved the day!”"],"teks":["OL_DISC"]},{"id":"T4h","text":"Connects two or more words, signs, or symbols according to grammatical rules to make comments that build on something a peer or adult said.","ex":["Note: “Today I told the class we were going to write about our favorite restaurants and told them I particularly liked pizza. Without prompting, H. told me, “I like pepperoni pizza.”","Photo: Students with thumbs down in front of a chart. A note adds, “After reading I Will Never Eat a Tomato, we made a chart of things we will not eat. I showed a picture and said, ‘I will not eat Brussels sprouts.’ M replied, ‘NO, GREEN BALLS!’","Video: Shared reading with the book Fudge is Funny. After reading that Fudge pretended, he was a dog, the teacher commented, ‘Fudge is silly!’ M. replied with his AAC device, ‘LIKE ME’ and started to by silly vocalizing like a barking dog."],"teks":["OL_DISC"]}]}]},{"title":"Receptive Language to Academic Vocabulary","desc":"This scale supports tracking students’ progress as they work toward understanding language in academic contexts and acquiring new vocabulary they hear and read.","levelDescs":{"E1":"Communicators learning to use behaviors, gestures, and vocalizations to communicate intentionally with others who are working toward demonstrating beginning engagement with and attention to language-driven interactions.","E2":"Intentional, early symbolic communicators who are beginning to attend and engage and are working toward demonstrating understanding during familiar language-driven routines.","T3":"Symbolic communicators beginning to understand early literacy who are working toward demonstrating an understanding of text during familiar shared reading routines.","T4":"Flexible symbolic communicators who are starting to read and write with understanding and working to demonstrate understanding when reading or listening.","C5-7":"Conventional communicators, readers, and writers working on reading text with fluency and comprehension and writing to convey meaning."},"placement":[{"n":1,"q":"Does the student demonstrate an understanding of the meaning of new academic vocabulary as it is introduced?","yes":"Start with Levels C5-7.","no":"Go to the next question."},{"n":2,"q":"Does the student demonstrate an understanding of simple conversations, stories, or directives of increasing complexity and length in academic contexts?","yes":"Start with Level T4.","no":"Go to the next question."},{"n":3,"q":"Does the student demonstrate an understanding of simple conversations, stories, or directives in academic contexts?","yes":"Start with Level T3.","no":"Go to the next question."},{"n":4,"q":"Does the student demonstrate increasing attention to and initial understanding of language in academic contexts?","yes":"Start with Level E2.","no":"Go to the next question."},{"n":5,"q":"Does the student demonstrate attention to and initial understanding of language in academic contexts?","yes":"Start with Level E1.","no":"Start working on communication and start with Level E1."}],"levels":[{"code":"E1","outcome":"When interacting with peers or adults in academic contexts, the learner demonstrates attention to and initial understanding of language.","note":"","indicators":[{"id":"E1a","text":"Responds to verbal (spoken or signed) bids for attention.","ex":["Data Sheet: The top of the page includes the student’s name, date, title, and Responds to Name, and the left column lists the days of the week. Next to each day are the numbers 1-5 and a + sign. Adults have circled each time L. responded to her name up to 5 times or more.","Photo: Picture of a student sitting at the worktable and smiling. A note adds, “A. had a huge smile when I said, ‘Good morning, A’! What a nice change since she is often too tired to interact early in the morning.”","Video: The teacher is taking attendance. When she says P’s name, he looks up."],"teks":["OL_LISTEN"]},{"id":"E1b","text":"Follows a pointing gesture by looking.","ex":["Note: “E. helped me create our class schedule today! I gave her each card with an activity name. E. placed the card where I pointed, and then we hung up the schedule for the class. E. made an excellent teaching assistant!”","Photo: Picture of N. intently looking at a book on the computer. A note adds, “Today, during independent reading, I moved N’s wheelchair in front of the computer and opened the book. Then, I pointed to and talked about various things in the illustrations. N. followed my point and attended to the things I pointed out.”","Video: The teacher points to each word and reads a chart, and R. looks up at the chart 2 out of the 5 times his teacher points at a new sentence."],"teks":["OL_LISTEN"]},{"id":"E1c","text":"Recognizes or responds to tone of voice and/or intonation.","ex":["Note: “S. was having difficulty participating today, but he took his turn immediately when I used my firm voice. He knew I wasn’t playing.”","Photo: Picture of the book, No David! And an attached note that reads, “Today we were reading No David! I enthusiastically exclaimed No and No David each time it appeared in the book, and Z. chuckled each time.”","Video: The teacher gathers students to around the table. She has a book hiding on her lap. She excitedly says, “I have a new book!” B. smiles and looks at her lap in anticipation."],"teks":["OL_LISTEN"]},{"id":"E1d","text":"Attends to others who are speaking or signing for brief periods.","ex":["Note: “We were doing a writing minilesson today. M. is usually with Ms. P, but we were short staffed so M. joined us. I was explaining how to write about a picture. As I described the picture, M. was reaching for it and vocalizing. Each time a peer spoke, M. stopped to listen. She really seemed to be listening to them.”","Photo: The picture shows the teacher reading to students sitting at a table and facing him. One student is leaning forward toward the book. A note attached reads, “J. was interested in our book today. He kept looking up and leaning forward whenever I read a new page.”","Video: The video shows the teacher sharing a book with the class and N’s interpreter, signing what the teacher reads. You can see N. focusing briefly on the interpreter each time the teacher turns to a new page."],"teks":["OL_LISTEN"]},{"id":"E1e","text":"Anticipates the next step when engaged in familiar, academic routines.","ex":["Note: “Today, when I told the class we were getting ready for Morning Meeting, L. immediately looked over to the area in the classroom where we gather.”","Note: “It was time to reread our chart today. As the kids gathered around, I said, ’First, we’ll reread the chart,’ and before I picked up the pointer, H. looked down at the tray where I keep the pointer. He knew I would use the pointer to point word-by-words while I read.”","Video: The video shows the teacher running an alphabet lesson. She leads the class in reviewing the letter name with upper and lowercase versions of the letter d. Then she tells the students it is time to write the letter d. K. looked over at the alphabet flip chart on the table. A note adds, “K. knew that she would use the flipchart to practice writing the letter next.”"],"teks":["OL_LISTEN"]},{"id":"E1f","text":"Engages in familiar, interactive, academic routines without extrinsic rewards.","ex":["Note: “It’s working! We’re trying to focus on learning instead of work. As we move away from asking Z. to make choices of reinforcers to work for, Z. is engaging more and more during our academic routines. Today, he stayed with us for the entire shared reading session – he even pointed to some words on his core board – not sure what they meant, but he’s participating!”","Photo: Picture of a child reading while sitting in a bean bag chair and a caption that reads, I’m a reader and a writer! An attached note explains, “When I asked students to choose a book for independent reading, D. reached for the book we had created last week during Predictable Chart Writing. Sometimes she gets antsy during independent reading time, but I guess not when she is one of the book’s authors!”","Work Sample: A sheet of paper with a picture of a cat at the top of the page and four upper- case letters written by an adult. An attached note reads, “B. chose to write about cats today and selected the letters B, C, I, and L using partner-assisted scanning with an alphabet flip chart. She was motivated to write about her favorite animal!”"],"teks":["OL_LISTEN"]},{"id":"E1g","text":"Demonstrates understanding of simple directives (e.g., give me, touch).","ex":["Data Record: A list of times when T. followed one step directions. Each has a date to accompany it.","Note: “Not only is C. following directions, she is starting to recognize some favorite books. At the start of shared reading, I told her we were going to read Tough Boris. I had three books and when I asked her to give me Tough Boris, she looked right at it.”","Work Sample: Sheet of paper with the following letters: K, S, B, N, and D. An attached note explains, “I gave R. a choice of four things to write about today and asked her to look at the one she wanted. She looked at the photo of swimming.”"],"teks":["OL_DIR"]},{"id":"E1h","text":"Recognizes the name of familiar people and objects.","ex":["Data Sheet: The data sheet has book titles listed down the first column. The second column has a date and a list of objects the student identified during shared reading of the book. On the top it reads s, Objects that V. identified when reading familiar books with objects we gathered.","Note: “D. repeatedly shows that he knows his writing notebook, pencil, and his talker. He looks right at each when I name them. I can’t wait for him to use them all to communicate more with me! ”","Video: Video shows the teacher rereading a predictable chart. As she reads the name of the student who authored each sentence, V. looks at the student."],"teks":["VOC_WORDS"]}]},{"code":"E2","outcome":"When interacting with peers or adults in academic contexts, the learner demonstrates increasing attention to and understanding of language.","note":"","indicators":[{"id":"E2a","text":"Demonstrates understanding of the names/labels of familiar people or objects in academic contexts.","ex":["Note: “J. really likes our new para-professional and definitely knows who she is. When I told him it was time to go to her center, he leaned toward the table she was sitting at and vocalized to let me know I needed to wheel him over there.”","Photo: Six items spread out on a table that all start with the letter, P. An attached note reads, “Today’s letter of the day was P. N. easily found the 2 items I asked her to locate, a picture and a pencil.”","Video: Video shows teacher making invisible ink with her students during Science. The teachers asks M. to hand her a bowl and a paintbrush, which she does."],"teks":["VOC_WORDS"]},{"id":"E2b","text":"Connects words or phrases with corresponding gestures in academic contexts.","ex":["Note: “Today in science, we learned about bears. When I explained that hibernation is what bears do in the winter, L rested her head on her hands and pretended to sleep. I guess she wanted to be like a bear.”","Photo: Picture of student smiling and holding his thumb up. An attached note explains, “D. was so proud when he finished gluing on the picture for his page of the book in Predictable Chart Writing. When I told him his work looked great, he gave me a thumbs up.”","Video: Video shows teacher reading How to Clean a Dirty Dog to the class. When she reads the page that says, Rub the dog with soap., C. moves her hand side to side like she is washing the dog."],"teks":["VOC_WORDS","OL_DIR"]},{"id":"E2c","text":"Demonstrates understanding of the relationship between familiar objects and actions that appear in books and other academic contexts.","ex":["Note: “Today in science, we read the book, Homegrown Tomatoes. When I got to the page that described the need to water the tomato plants, P. looked over at the watering can we use for our garden. She knows what we use that for.”","Video: Teacher tells everyone they are going to read a book called How to do the Dishes, and C. vocalizes loudly and looks at the sink.","Work Sample: Page with a picture of a soccer ball on top and the upper-case letters B, I, K, S, S, X, and W. An attached note reads, “Today when I said it was time for writing, S. vocalized and looked at the alphabet flip chart that was sitting on her desk. She knows that when it’s time to write, she needs her alphabet.”"],"teks":["VOC_WORDS"]},{"id":"E2d","text":"Anticipates a missing word or phrase from a familiar text, poem, or rhyme.","ex":["Note: “We have been reading short poems about animals (owls, elephants, birds). Today, when I read the last couple of lines of the poem about elephants, ‘He has no fingers, but he does have toes, And goodness gracious, what a …’, I paused before reading the last word and N. touched his nose. He got it!”","Photo: Picture of an adult and a child sitting next to each other on a couch reading. An attached note reads, “Today, J. and I read the book, That’s Disgusting, and he loved it! I read the page that described an action, and he vocalized with intonation and made a funny face to ‘say’ the repeated line on the following page, ‘That’s disgusting.’ Apparently gross things really motivate middle school boys”","Video: Teacher is reading, Dirty Bertie. Each time she reads something gross that Bertie does and then turns the page, A. shakes her head “no” even before the teacher reads the page."],"teks":["CMP_PRED","PA_RHYME"]},{"id":"E2e","text":"Laughs or smiles in response to humor in academic contexts.","ex":["Note: “Today, C. rolled his eyes like the teenager that he is and laughed out loud when I had trouble pronouncing the word, antennae. We were discussing insects, and C. thought it was hilarious that I pronounced the word incorrectly. Then we all started laughing.”","Photo: Picture shows student laughing and holding his nose. A note is attached that says, “G. cracked up when we read The Pigeon Needs a Bath today, especially when we read about the Pigeon smelling bad.”","Video: Teacher is reading a Tar Heel Reader book called Animal Jokes. F. seems confused by a couple of them but laughs loudly at the joke about the elephant."],"teks":["OL_LISTEN"]},{"id":"E2f","text":"Demonstrates understanding of directives that are part of familiar academic routines.","ex":["Data Sheet: Title of the sheet is Follows Directions During Writing. Student’s name is at the top as well as the date (Week of). The days of the week are written across the top row and down the left side of the sheet are 3 directions: 1) Chooses a topic, 2) Selects letters for writing, 3) Shares writing with teacher and a + or – next to each one to indicate whether the student followed that direction each day.","Note: “W. responded the first time I asked him to pick out a book from the shelf for our independent reading time today. I usually have to take his hand and walk him over to the bookshelf, but he did it independently today!”","Work Sample: Individual words from a sentence glued onto a piece of paper. An attached note explains, “During Predictable Chart Writing, Q. followed my direction to cut her sentence strip into words (I like the beach). When I asked her to put her sentence back together it took 2 tries, but she stuck with it and did it correctly.”"],"teks":["OL_DIR"]},{"id":"E2g","text":"Sustains attention during language-based academic routines.","ex":["Note: “After shared reading, I asked E. what she thought about the book we read. E. smiled. I said it looked like she liked the book and then asked her what she liked about it. E. took the book and turned to the page that showed a treasure chest filled with gold baubles. We laughed when I said her gold earrings looked like they came from that treasure chest.”","Photo: Picture shows students sitting at a table while the teacher is sharing a book with them. One child is leaning forward and looking intently at the book. An attached note explains, “J. was super interested in the book we read today. She kept leaning toward the book, and I was afraid she was going to fall out of her chair!”","Work Sample: Piece of paper with a photo of an LA Lakers basketball jersey on top and the letters b, b, f, g, h, I, l, l, w, w written below the picture. An attached note says, “H. chose to write about the LA Lakers today. Before he started writing, I asked him some questions to find out what he knew about the Lakers. His responses let me know they are his favorite basketball team, he has been to their games before, and he likes it when they win.”"],"teks":["OL_LISTEN"]},{"id":"E2h","text":"Responds to yes/no questions about academic content using conventional gestures (head nod/shake), words, signs, or symbols.","ex":["Data Sheet: Top of sheet has student’s name, date (week of), and the title, Responds to Yes/No Questions at Least 5 Times/Day. A row across the top lists the days of the week. And under each week day are 5 squares, each has a list of responses modes: gesture (head nod/shake), word, sign, picture symbol. Each time the student responded to a yes/no question, and adult circled the response mode. Student met the criteria of at least 5 yes/no responses/day 3 of the 5 days of data collection.","Photo: Picture of student sitting at a computer, watching and listening to a book. A note is attached that explains, “M. chose a book about camping today for independent reading and seemed to really enjoy it. I asked her if she had ever been camping, and she signed ‘no’. When I asked if the book made her interested in camping, she smiled and signed ‘yes’.”","Video: Teacher finishes reading the book, Chickens to the Rescue and asks B. if she thinks the chickens will rescue the pigs on the last page of the book. B. makes a thumbs up sign and nods her head, yes."],"teks":["OL_LISTEN"]}]},{"code":"T3","outcome":"When interacting with peers or adults in academic contexts, the learner demonstrates an understanding of simple conversations, stories, or directives.","note":"","indicators":[{"id":"T3a","text":"Demonstrates understanding of words that are used across academic contexts.","ex":["Note: “We read a book in class today called Matt and Tom about how 2 boys solved a problem. When I asked if anyone could tell me about a problem they have solved, G. pointed to our whiteboard, which still had the problems we worked on and solved during Math 😊\"","Photo: Picture shows teacher reading to a group of students sitting in a semi-circle in front of her. An attached note explains: “Today we were reading About Hatchett, and I asked if anyone could tell me the meaning of the word, search. N. signed ‘look.’ I asked her if she had ever been on a search for something, and she signed ‘yes’ and pointed to the basket of objects we had collected earlier in the day during a scavenger hunt (search) for items starting with the letter, R. Excellent connection!”","Video: Class is doing a science experiment and teacher says they need to measure one cup of water. F. uses his communication system to say, “GET THAT” and points to a yard stick hanging on the wall. The teacher explains, “We do use the yard stick to measure how long things are, but we need a special cup to measure water.”"],"teks":["VOC_WORDS","VOC_CTX"]},{"id":"T3b","text":"Demonstrates understanding of words that describe familiar people or objects in various contexts.","ex":["Note: “We have been sharing books about famous people and discussing what it means to be famous. H. got very excited and opened the sports page on his communication device and selected, ‘KOBE’ and ‘LEBRON,’ two of the most famous professional basketball players.”","Video: Teacher is reading a book about lions to her students that includes information about how lions have a loud roar. She asks who can tell her something else that is loud, and J. says, “school bell.”","Work Sample: Poster titled, Things that are Enormous. An attached note explains, “We have been reading The Enormous Potato, and I wanted to see if students were getting the concept. I gave K. 8 photos (3 things that were big, 2 things that were medium sized and 3 that were small), and she found the hippo, tall building, a huge pumpkin to accurately complete her poster.”"],"teks":["VOC_WORDS"]},{"id":"T3c","text":"Demonstrates understanding of directives that include two or more steps in academic contexts.","ex":["Note: “In our daily writing sessions, we’ve been working on becoming more independent in selecting topics. Today, I asked R. to look through a stack of pictures he might want to write about, choose one, and then bring it to me so we could discuss it. He did a great job of making his selection (NASCAR) and showing me what he chose. We had a nice discussion, and it turns out he really knows a lot about NASCAR, which makes it a great writing topic.”","Photo: Students sitting in a bean bag chair reading a book. A note reads, “I asked Y. to select a book from our classroom bookshelf, and find a spot to sit down and read. He chose the same book we read during shared reading and made himself very comfortable in the bean bag chair.”","Work Sample – Sheet of paper with individual words glued on it to form a sentence. A note is attached that reads, “During our Predictable Chart Writing lesson today, J. independently followed my directions to cut his sentence apart and then put the words in the correct order. She’s really getting the hang of this!”"],"teks":["OL_DIR"]},{"id":"T3d","text":"Responds to simple wh- questions in academic contexts.","ex":["Note: “L. was really engaged during shared reading today. We were reading Tom Sawyer’s Adventures, and when I asked, ‘Who was Tom’s best friend?’ he pointed to the picture of Huck Finn. I’m going to show him where he can find more stories about Tom Sawyer in case he wants to read them during self-directed reading or at home.”","Photo: Picture shows a written chart titled, My Favorite Sport and 5 sentences underneath it. A note is attached that explains, “We wrote a chart about our favorite sport today. I asked H. to finish the sentence, I like … but he looked confused. Then I asked, ‘What’s your favorite sport?’ and he quickly opened up the sports page on his communication device and selected ‘BASKETBALL.’”","Video: Teacher is using the CROWD strategy during shared reading of The Word Collector, and asks P., “What do you think the word, marvelous, means? P. uses her communication device and responds, “MORE GOOD.”"],"teks":["OL_LISTEN","CMP_Q"]},{"id":"T3e","text":"Sustains attention during interactions and instruction with familiar academic content.","ex":["Note: “During Shared Reading, we read Being Nice at Dinner. When we got to the pages that mentioned different types of foods, I. starting talking up a storm! He named one food item, and each time anyone else added another type of food, I. would name yet another. I think he literally wanted the last word.”","Photo: Picture of 4 students each holding a card with one written word. An attached note explains, “M. got really involved in today’s ‘Be the Sentence’ activity. She was working with her classmates to make sure they did NOT put the words in the correct order, and thought it was hysterical when I read the scrambled sentence out loud. Since she and her friends made every word combination BUT the correct one, I’m pretty sure they knew just what they were doing😊\"","Work Sample: A page filled with upper-case letters. A note is attached that says, “S. was really motivated to write today. He chose to write about power soccer and told me all about the team he is on, and how they never win because their power chairs are too slow. Once he began writing, he kept selecting letters until I told him we had to stop to go to our next activity. I promised him he could write more about this tomorrow.”"],"teks":["OL_LISTEN"]},{"id":"T3f","text":"Demonstrates understanding of familiar academic content by making comments or asking questions that relate to it.","ex":["Data Sheet: The title of the sheet is, Comments, Responses, and Questions During Shared Reading, and there is a space for the student’s name. Across the top row, there are 5 columns labeled Date, Book, Comments, Response, Questions. This was used once a week by one of paraprofessionals to record the date and book used during shared reading, and a tally mark was placed under the correct heading each time the student initiated a comment, responded to the teacher, and/or asked a question.","Photo: Teacher is reading a book to a group of students seated in front of her. There is a note attached that explains, “Today we read Movie Night. When we got to the page that talked about watching a movie with your dog, J. asked me if I had a dog, which I do. He wanted to know the dog’s name and wanted me to know he watches movies with his dog. It was a really nice connection.”","Video: Teacher is reading a Predictable Chart Writing chart and pointing to each word as she reads. When the teacher is finished, C. uses her communication device to say, “I WANT READ.”"],"teks":["OL_LISTEN","OL_DISC"]},{"id":"T3g","text":"Demonstrates understanding by making a comment that relates to a prior comment during interactions with peers and adults.","ex":["Note: “E. shared his writing with the class today. He wrote about his service dog. I told him I thought what he wrote was interesting, and would like to know more. E. used his communication device to tell me, ‘I DO MORE.’ I’ll give him the option of adding to this when we write again tomorrow.”","Photo: The picture shows a predictable chart the class created, and the topic is travel with the sentence stem: I can go to (fill in the blank). The teacher attached a note which explains, “When we made our chart about places to travel in our state, the mountains were a popular choice. N. chose that response first. When her classmate made the same choice, N. used her communication device to say, ‘LIKE ME.’”","Video: Teacher is reading the book, Exercise with her class. When they get to a page about basketball, the teacher asks K. if he plays basketball. He says, “Yes” then adds, “he on team” and looks at one classmate."],"teks":["OL_DISC"]},{"id":"T3h","text":"Identifies the beginning and end of stories and other events across academic contexts.","ex":["Note: “When our paraprofessional, Mrs. J. quietly set up our table for writing today with paper and the various ‘pencils’ students use, L. used her communication device to say, ‘I WRITE.’ Then she looked at the stack of photos she uses to choose a topic and said, ‘GET THAT.’ She clearly knows what we need to write and how to get started.”","Photo: Picture shows 3 sentence strips on the white board. The teacher included a note which says, “We have been sharing the book, Pig the Pug all week long. Today I wrote 3 events from the story on sentence strips and asked the students to decide which one of the 3 events happened at the beginning of the story and which one happened at the end of the story. After finishing the book, I read the 3 choices, and A. looked at the correct responses to tell me she knew the beginning and the end!”","Video: Teacher is sharing a book with the class and after reading the final page, C. spontaneously says, “The End.”"],"teks":["LIT_PLOT"]}]},{"code":"T4","outcome":"When interacting with peers or adults in academic contexts, the learner demonstrates an understanding of conversations, stories, or directives of increasing complexity and length.","note":"","indicators":[{"id":"T4a","text":"Demonstrates understanding of content-specific words taught in academic contexts.","ex":["Note: “We have been discussing the idea of comparing things in science, math, and reading. Today, I told the class we were going to read The Pigeon Needs a Bath and compare it to Don’t Let the Pigeon Drive the Bus. I asked Q. to tell me what it means to compare 2 things, and he used his communication systems to say, ‘WHAT SAME DIFFERENT’.”","Photo: Picture shows a poster of the Solar System with the planets. An attached note reads, “W. is so interested in our unit on the Solar System. When I talked about the earth orbiting around the sun, W. signed, ‘make circle’. He’s got the idea!”","Video: Class is doing an experiment to make a homemade volcano erupt. Teacher asks if anyone can tell her what the word, erupt means, and C. uses her communication device to say, “GO UP”, “HOT.”"],"teks":["VOC_WORDS","VOC_CTX"]},{"id":"T4b","text":"Demonstrates understanding of words that describe characters, settings, problems, and other elements of texts.","ex":["Note: “We are reading the book, Living at Camp Green Lake and discussing the setting of the story. After I described Camp Green Lake, I asked J. what she thought about the setting. She used her communication device to say, ‘NOT GOOD’ and ‘NOT WANT GO THERE’. She understood the conditions there were tough.”","Photo: Chart with a list of 10 describing words in the left column, and middle column labeled “YES” and a column on the right, labeled “NO”. An attached note reads, “We have been discussing the concept of characters in books and how to describe them. During the anchor activity before we read today, we came up with a list of 10 words to describe ourselves and after reading the book, I asked students to tell me ‘YES’ or ‘NO’ this word did or did not describe the main character. L. identified 2 of the 4 words that described the main character.\"","Work Sample: Sheet is titled, Problems and Solutions. There are 4 words that indicate different types of problems: hungry, tired, thirsty, and dirty. Directions require the student to choose a solution to the problem from a list of 3 options. P. identified 3 of 4 correct responses."],"teks":["VOC_WORDS","LIT_CHAR","LIT_SET"]},{"id":"T4c","text":"Demonstrates understanding of multi-step requests and directives.","ex":["Data Sheet: Sheet is titled, Follows Directions and is used to track C’s understanding and completion of at least 5 teacher directions each day. Sheet has a space for the student’s name (B.), date (week of), and the days of the week listed in a row across the top. The left column has 3 boxes labeled: 1-step Directions, 2-step Directions and 3-step Directions, where tally marks indicate frequency. B. completed at least one 2-step or 3-step direction on 4 of the 5 weekdays.","Photo: Picture shows the 5 words, I can make a smoothie, arranged in order to make a sentence. An attached note explains, “R. is doing so well in Predictable Chart Writing! I asked him to cut apart the sentence he created, mix up the words, and put them back in order. All I had to do was watch as he completed all 3 steps on his own!”","Video: Teacher is doing a Making Words lesson with K. and asks him to take away one letter from the word, had, and choose a new letter to make the word, sad. K. completes the task of removing then replacing the correct letter."],"teks":["OL_DIR"]},{"id":"T4d","text":"Responds to wh- questions about concrete information in academic contexts.","ex":["Note: “We have been learning about the word, selfish. After we read the book, Pig the Pug, I asked M. who was selfish, and he pointed to the character, Pig. We had another discussion about how some people use the words, pig and hog, to refer to a person who is selfish. That’s why Pig is a good name for the Pug in the book.”","Photo: Picture shows 3 written sentence strips. A note explains, “All week long, we’ve been reading the book, Ish. Today, our anchor activity was to sequence the 3 events shown in the photo. N. selected the correct event when I asked her to show me what happened first.”","Video: Teacher is reading the book, Jo’s Haircut, to the class. At the end of the story, she asks the class why Jo cut her hair. D. uses her communication device to say, “SHE WANT HELP.” An attached note explains, “D. understood that Jo cut her hair to sell it and give the money to her mom.”"],"teks":["OL_LISTEN","CMP_Q"]},{"id":"T4e","text":"Identifies the beginning, middle, and end of stories and other events across academic contexts.","ex":["Data Sheet: Sheet is titled, Story Sequencing and has a space for the student’s name at the top. There are 5 columns on the sheet: Date, Title of Story, Beginning, Middle, End. There are 10 rows under the columns, and in each row, there is a + or minus in the appropriate column to indicate whether the student was able to identify the beginning, middle and/or ending events of the specific story. The student consistently identified the beginning event (10/10), has increased frequency of identifying the ending event (5/10) and was able to identify the beginning, middle and ending events of the final 2 stories (2/10).","Note: “We have been discussing fairy tales in class and how they have a structure. We are working to create our own fairy tale. I put some information on the board, read it to the students and asked who could help me put it in order so we can have a beginning, middle and the end of our fairy tale. D. came up to the board and pointed to the phrase, Once upon a time...., then pointed to problem, solution, and finally, Happily ever after. Now that we have the structure in place, we can work together to come up with the details of our story.”","Photo: Picture shows 3 written sentence strips. A note explains, “Today we read a book to decide which of these 3 events happened in the beginning. middle and end of the story. R. quickly identified the beginning and ending events, which left the last choice to go in the middle. He’s getting the idea of sequencing.”"],"teks":["LIT_PLOT"]},{"id":"T4f","text":"Sustains attention when introduced to unfamiliar academic content.","ex":["Note: “We read a book about bats today, and I have never seen A. so interested and engaged! He was leaning forward, vocalizing, and pointing to pictures that interested him. I wonder if he has ever seen a live bat?”","Photo: Picture shows a paper airplane. An attached note explains, “Today, we read a book about how make a paper airplane. B. was so interested, leaning forward and listening intently as I shared the book. As soon as I finished the book, he used his communication device to say, ‘I WANT MAKE.’ This is the paper plane he made after we read the book!”","Video: Video shows a 10-minute Making Words lesson with M. carefully listening and following the teacher’s directions as she attempts to spell 6 words using different combinations of the letters a, n, p and t, and then identify all the words that start with the letter, t."],"teks":["OL_LISTEN"]},{"id":"T4g","text":"Demonstrates understanding of new academic content by making comments or asking questions that relate to it.","ex":["Data Sheet: Sheet is titled, Weekly Vocabulary. Student’s name is written at the top along with the date. The left column of the sheet lists 10 vocabulary words students have worked on this week. There is a space next to each word where the student definition is written during the end of the week assessment. Student used his communication system to correctly define 7 of the 10 words by composing messages 1 to 3 words in length.","Note: “We have been learning about different types of weather events in Science. We read a new book about thunderstorms today, and E. was really interested. She initiated several comments after I read some of the pages. When the book described lightning, E. used her communication system to say, ‘I HEAR.’ After the page about heavy rain, E, composed the message, ‘IT COME DOWN’. At the end of the book, she used her communication system to say, ‘NOT LIKE.’ Maybe E. doesn’t like storms, but she sure seems interested in weather 😊\"","Video of teacher reading Dreamers with the class. When she gets to a page showing the characters sitting in a library setting, surrounded by books, G. goes to the Places page on her communication system and selects the message, “MEDIA CENTER.” Teacher replies, “Media Center, that is like our Media Center.”"],"teks":["OL_LISTEN","OL_DISC"]},{"id":"T4h","text":"During multiple turn interactions or discussions with peers and adults, demonstrates understanding by making comments that relate to a prior comment.","ex":["Note: Today we read a book called, Exercise and B. had lots to say about it. When we read a page about soccer, he used his communication device to tell me, “I PLAY”. I told him that I knew that and then he continued by telling me, “HE PLAY” and looked at 1 classmate, then said again, “HE PLAY” and looked at another classmate. They are all on the same team. B. made a great connection between information in the book and his own experience.”","Video: Teacher is reading the book, Being Nice at Dinner. When she reads a page that has a photo of a table full of food, W. says, “French fries.” A classmate responds, “lettuce” and W. replies, “chicken nuggets.” Another classmate responds, “hamburger”, and W. says, “salad.” Teacher reads the next page that mentions fruit and W. begins to list fruits by saying, “apple, banana, pear.”","Work Sample: Page has a picture of a garden at the top of it and the title, My Garden. The following letters/words are on the page – I like flw. Look prty. Sml good. I make garden. An attached note reads, “After reading a book, School Garden, P. chose to write about gardens. Before writing, we talked about her topic. I asked if she had liked the book. She smiled, nodded her head and signed, ‘yes’. Then, we discussed what she knew about gardens. She signed ‘flower’, ‘smell good’, ‘pretty.’ All of this information was in the book. I asked if she had a garden and she signed, ‘I make.’ After our conversation, this is what she wrote.”"],"teks":["OL_DISC"]}]},{"code":"C5-7","outcome":"The learner acquires new academic vocabulary as it is introduced.","note":"","indicators":[{"id":"C5-7a","text":"Demonstrates understanding of the meaning of tier 2 vocabulary (i.e., academic vocabulary that appears across contexts) used in familiar texts.","ex":["Data Sheet: Sheet is titled, Weekly Vocabulary. Student’s name is written at the top along with the date. The left column of the sheet lists 10 vocabulary words selected from a text that students have read and learned about this week. There is a space next to each word showing how the student defined the word at the end of week. Student used his communication system to correctly define 8 of the 10 words by composing messages 1 to 3 words in length.","Note: “We have been reading, The Pigeon Needs a Bath. Today I asked J. to finish the sentence, ‘He needs to bathe to …’, and J. signed ‘clean up’, ‘make look good.’ He definitely understands why we need to bathe!”","Video: Video shows teacher introducing vocabulary for the week which includes a word used in a previous text. The teacher asks students to tell her about the word, disappear, and R. uses his communication device to say, “GO,” “NOT HERE.”"],"teks":["VOC_CTX","VOC_WORDS"]},{"id":"C5-7b","text":"Demonstrates understanding of the meaning of tier 2 vocabulary (i.e., academic vocabulary that appears across contexts) used in familiar academic routines.","ex":["Note: “We have been discussing the idea of problems and solutions, and doing anchor- read- apply lessons that involve identifying them in stories we are reading. C. made a connection when she said, ‘Like in Math’.”","Photo: Picture shows a chart. The title of the chart is Comparing Women Long Ago and Today. The top of the chart has a column for Same and Different and the left side of the chart lists 4 things (i.e., hair, clothes, jobs, rights) with similarities and differences listed next to each item. An attached note explains, “Today I told the class we were going to compare things that are the same and different for women from the past and women who are alive now. I reminded students we have compared things before in Math and Science, and E. said, ‘Same and different.’ She knows what it means to compare things.”","Video: Teacher is beginning a Math lesson and reminds students they have been learning about patterns. He asks students to look around the room and see if anyone can find a pattern. J. raises his hand and when called on points to his classmates and signs, “blue, white, blue, white.” His classmate is wearing a blue and white striped shirt."],"teks":["VOC_CTX","VOC_WORDS"]},{"id":"C5-7c","text":"Demonstrates understanding of the meaning of tier 2 vocabulary (i.e., academic vocabulary that appears across contexts) used in new texts","ex":["Note: \"I introduced the book, Getting Ready to Camp today, and when I read the text, “First, pack camping supplies,” I asked the students what they knew about the word, supplies. N. went to the art page on her communication system to say, ‘PAINT BRUSH SCISSORS’. I confirmed those are all supplies we need to make art and then talked about supplies people need to camp.”","Photo: Picture of students sitting at a table filled with food. An attached notes reads, “We had this meal after reading the book, A Medieval Feast. I asked if anyone wanted to tell me what a feast was, and P. used her communication device to say, ‘MAKE MORE TO EAT’, ‘EAT BIG.’ One look at this full table shows that she was right. We had a feast with all that food!”","Video: Teacher is reading the book, Treasure and Pirates. As soon as she reads the title, E. signs, “dragon” and his teacher asks, “Are you remembering when we read about treasures in Elmer and the Dragon Find Treasure?” E. smiles, nods his head and signs, “yes.”"],"teks":["VOC_CTX","VOC_WORDS"]},{"id":"C5-7d","text":"Demonstrates understanding of the meaning of tier 3 vocabulary (i.e., subject specific words) used in familiar texts.","ex":["Data Sheet: Sheet is titled, Science Vocabulary. Student’s name is written at the top along with the date. The left column of the sheet lists 5 vocabulary words selected from a text about the solar system that the students have been studying this week. Student used her communication system to correctly define the tier 2 words, earth, sun, rotate, and the tier 3 words, astronomy, and astronomer by composing messages 3-4 words in length.","Note: “We have been reading books about different types of weather, and I asked if anyone could tell me what a meteorologist does. H. used his communication device to say, ‘I CAN.’ Then he selected ‘TALK’ on his core page and went to the Morning Meeting activity page and chose ‘WEATHER.’ I said, ‘That’s right! A meteorologist studies and then talks about the weather’.”","Video: Teacher is reading a book in Science about volcanoes. They read a page that mentions magma, and she asks if anyone wants to say what they know about magma. R. raises his hand and signs, “hot”, “liquid”, “rock.”"],"teks":["VOC_CTX","VOC_WORDS"]},{"id":"C5-7e","text":"Demonstrates understanding of the meaning of tier 3 vocabulary (i.e., subject specific words) used in familiar academic routines.","ex":["Note: “We are studying the Civil War, and I have been talking about that time period in American History. I asked if anyone remembered what the term, antebellum, meant and J. said, ‘before the war.’ Great definition!”","Photo: Picture shows a sheet of Math problems and a score of 85%. An attached note reads, “I gave this sheet to M. and told her we needed to do some calculation. I asked her what she could tell me about calculation, and she used her communication device to say, ‘DO WORK’, ‘GET IT RIGHT’ Her score of 85 shows she knows her calculation!”","Video: Teacher is doing a Math lesson and showing students 3 circles indicating equivalent fractions. One circle is divided in ½ and shows 1 side in dark blue. Another circle is divided into 4 sections and 2 are dark blue. The 3rd circle has 6 sections and 3 are dark blue. The teacher says, “These circles show 3 different fractions – ½, 2/4ths and 3/6ths. Each circle has a different number of parts.” As she points to each circle she says, “This circle has 2 parts, this one has 4 and this one has 6, but the same amount of each circle is dark blue. That’s why we call ½, 2/4ths and 3/6ths equivalent fractions. Can someone tell me what they know about the word, equivalent?” S. vocalizes and uses her communication device to say, “SAME DIFFERENT” The teacher responds, “That’s right. Equivalent means that the amount is the same even though the numbers in the fraction look different.”"],"teks":["VOC_CTX","VOC_WORDS"]},{"id":"C5-7f","text":"Demonstrates understanding of the meaning of tier 3 vocabulary (i.e., subject specific words) used in new texts.","ex":["Note: “Today I introduced the book, Say Something, to the class. I asked if anyone wanted to share what they knew about the word, advocacy. P. used her communication device to say, ‘WORK TO HELP.’ I acknowledged her response and expanded it by saying that advocacy is helping others. We can work to help their causes.”","Photo: Picture shows the cover of the book, Southwest Sunrise. An attached note explains, “Today I talked about the idea of using language to create atmosphere in a book. I asked if anyone knew anything about the word, atmosphere, and Q. used her device to say, ‘WHAT YOU SEE’ ‘WHAT YOU FEEL.’ I confirmed her answer and added that authors can use language to help us see and feel things in a book. That is creating atmosphere.”","Video: Teacher is reading a book about hurricanes and comes to a page that includes the word, deluge. When she asks what the class if anyone has ever been in a deluge, L. signs “yes,” “pouring rain.”"],"teks":["VOC_CTX","VOC_WORDS"]},{"id":"C5-7g","text":"Uses tier 2 vocabulary (i.e., academic vocabulary that appears across contexts) during reading, writing, or other interactions in academic contexts.","ex":["Note: “We learned the vocabulary word, surrender in our history unit. Today, J. was playing Tic Tac Toe with a classmate, and I asked who won. J. told me his classmate did and used the keyboard and word prediction on his communication device to spell out, ‘I SURRENDER.’ I guess he knew when to quit!”","Video: Teacher is leading a lesson where she talks about a situation or a thing and students provide a word to describe it. She mentions the vegetable, Brussel sprouts, and asks who can describe that. E. holds up his hand, walks over to the class library and grabs the book, That’s Disgusting! He puts it on the table and makes a nasty expression with his face while pointing to the word, disgusting.","Work Sample: The sample has a photo of a volcano glued to the top and writing underneath that reads: Watch out! This is hot. It can erup. You get fire lava. It is bad. An attached note explains, “R. has been fascinated by our unit on volcanoes. It was exciting to see him use the vocabulary words, erupt and lava in his independent writing.”"],"teks":["VOC_RESP"]},{"id":"C5-7h","text":"Uses tier 3 vocabulary (i.e., subject specific words) during reading, writing, or other interactions in academic contexts.","ex":["Note: “In English Language Arts, we learned that hyperbole is exaggeration that you use to make a point. Today, when I said everyone better remember to turn in their homework tomorrow or there would be trouble, P. used the keyboard and word prediction in her communication device to say, ‘HYPERBOLE’ We all cracked up, especially because it was true 😊\"","Photo: Picture of a K. in her fancy dress for the dance after school. A note explains, “We learned about metamorphosis is our science unit, and K. definitely got the idea. When she changed into her dress for the dance at the end of the school day, everyone commented on how lovely she looked. She used her communication device with word prediction to write, ‘MY METAMORPHOSIS’ Indeed, she had morphed from a student to a star.”","Work Sample: This is a page with a student’s writing. The title reads, Food I Like, and the text reads: I like to eat fruit. I like to eat green. I do not like meat. My name can be Erbivor. A note is attached that explains, “It was so exciting to see what S. wrote today! We have been learning about dinosaurs and talked about herbivores. S. is a vegetarian, but now I guess she considers herself an herbivore like some of the dinosaurs we studied 😊\""],"teks":["VOC_RESP"]}]}]},{"title":"Alphabet and Phonological Awareness to Decoding and Spelling","desc":"This scale supports tracking student progress as they learn about letters and sounds, develop awareness of sounds in spoken language, and work toward decoding and spelling words.","levelDescs":{"E1":"Communicators learning to use behaviors, gestures, and vocalizations to communicate intentionally with others and are working toward recognizing words, sounds, and other symbols.","E2":"Intentional, early symbolic communicators who are beginning to attend and engage during academic instruction and are working toward demonstrating a beginning understanding of the alphabet and sounds during language-based interactions.","T3":"Symbolic communicators beginning to understand early literacy who are demonstrating early alphabet and phonological awareness and working toward applying that understanding in language-based interactions.","T4":"Flexible symbolic communicators who are starting to read and write and are working to apply alphabetic knowledge and phonological awareness in reading and writing tasks.","C5":"Conventional communicators, readers, and writers working toward reading and spelling single-syllable words with simple spelling patterns.","C6":"Conventional communicators, readers, and writers working toward independently reading short texts.","C7":"Conventional communicators, readers, and writers working toward reading and spelling more complex one- and two-syllable words in longer texts."},"placement":[{"n":1,"q":"Does the student independently read texts with 100 or more words, including a variety of one and two-syllable words?","yes":"Start with Level C7.","no":"Go to the next question."},{"n":2,"q":"Does the student identify and spell most single-syllable words, including high-frequency and decodable words?","yes":"Start with Level C6.","no":"Go to the next question."},{"n":3,"q":"Does the student successfully identify and spell 50 or more words?","yes":"Start with Level C5.","no":"Go to the next question."},{"n":4,"q":"Does the student identify 16 or more letters of the alphabet based on their name and represent the beginning sound of words when writing or spelling?","yes":"Start with Level T4.","no":"Go to the next question."},{"n":5,"q":"Does the student recognize some alphabet letters in upper- or lower-case form and sound and recognize when words begin or end with the same sound?","yes":"Start with Level T3.","no":"Go to the next question."},{"n":6,"q":"Does the student recognize familiar symbols and words while attending during language- based interactions?","yes":"Start with Level E2.","no":"Go to the next question."},{"n":7,"q":"Is the student working to attend, intentionally communicate, and recognize words and sounds during language-based interactions?","yes":"Start with Level E1.","no":"Start working on communication and start with Level E1."}],"levels":[{"code":"E1","outcome":"When interacting with peers or adults in academic contexts, the learner attends to and recognizes familiar words, sounds, and symbols.","note":"","indicators":[{"id":"E1a","text":"Associ
